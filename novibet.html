<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Novibet .NET Academy — Interactive C# Trainer</title>
<style>
:root{
  --bg:#0b0f17; --bg2:#111827; --panel:#121a28; --panel2:#16202f;
  --line:#22304a; --line2:#2d3f5e;
  --tx:#e6edf7; --tx2:#9fb0c9; --tx3:#6b7f9c;
  --acc:#ffc247; --acc2:#ff9f1c; --ok:#3ddc97; --bad:#ff6b6b; --info:#5eb1ff; --pur:#b48cff;
  --mono:"JetBrains Mono","Fira Code",Consolas,"SF Mono",Menlo,monospace;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
::selection{background:var(--acc);color:#000}
a{color:var(--acc)}
/* ---------- layout ---------- */
#app{display:flex;min-height:100vh}
#side{width:290px;flex:0 0 290px;background:linear-gradient(180deg,#0d1420,#0a0e16);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;padding:18px 14px 40px}
#main{flex:1;min-width:0;padding:26px 34px 90px;max-width:1080px;margin:0 auto}
@media(max-width:900px){
  #app{flex-direction:column}
  #side{position:static;width:100%;flex:none;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  #main{padding:18px 16px 70px}
}
/* ---------- sidebar ---------- */
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px}
.brand .dot{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;color:#111;font-weight:800;font-size:15px;flex:none}
.brand b{font-size:14.5px;letter-spacing:.2px;display:block}
.brand span{font-size:11px;color:var(--tx3);display:block;letter-spacing:.4px;text-transform:uppercase}
.progwrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin:0 4px 14px}
.progwrap .lbl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--tx2);margin-bottom:7px;letter-spacing:.3px}
.bar{height:6px;border-radius:99px;background:#1c2740;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));width:0;transition:width .45s cubic-bezier(.4,0,.2,1)}
.navsec{font-size:10.5px;text-transform:uppercase;letter-spacing:1.1px;color:var(--tx3);padding:12px 10px 6px;font-weight:600}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;font-size:13.5px;color:var(--tx2);transition:.15s;border:1px solid transparent}
.nav button:hover{background:#16203200;background:#151f31;color:var(--tx)}
.nav button.on{background:linear-gradient(90deg,rgba(255,194,71,.14),rgba(255,194,71,.03));color:var(--acc);border-color:rgba(255,194,71,.25)}
.nav .num{font-family:var(--mono);font-size:11px;width:22px;height:22px;border-radius:6px;background:#1a2436;display:grid;place-items:center;flex:none;color:var(--tx3)}
.nav button.on .num{background:rgba(255,194,71,.2);color:var(--acc)}
.nav .tick{margin-left:auto;color:var(--ok);font-size:12px;opacity:0}
.nav button.done .tick{opacity:1}
.nav button.done .num{background:rgba(61,220,151,.15);color:var(--ok)}
.searchbox{position:relative;margin:0 4px 6px}
.searchbox input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:9px 11px 9px 32px;font-size:13px;font-family:var(--sans);outline:none}
.searchbox input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(255,194,71,.09)}
.searchbox svg{position:absolute;left:10px;top:10px;opacity:.45}
/* ---------- generic ---------- */
h1{font-size:29px;line-height:1.2;margin:0 0 6px;letter-spacing:-.5px}
h2{font-size:20px;margin:34px 0 12px;letter-spacing:-.2px;display:flex;align-items:center;gap:9px}
h2:before{content:"";width:3px;height:18px;border-radius:3px;background:var(--acc)}
h3{font-size:15.5px;margin:0 0 8px}
p{margin:0 0 12px}
code{font-family:var(--mono);font-size:.88em;background:#1b2436;border:1px solid var(--line);padding:1px 5px;border-radius:5px;color:#ffd88a;white-space:nowrap}
.lead{color:var(--tx2);font-size:15.5px;margin-bottom:4px}
.hero{border:1px solid var(--line);background:linear-gradient(135deg,#131c2b,#0e1522);border-radius:16px;padding:22px 24px;margin-bottom:8px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;background:radial-gradient(circle,rgba(255,194,71,.10),transparent 70%)}
.kicker{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--acc);font-weight:700;margin-bottom:8px}
.metarow{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{font-size:11.5px;background:#1a2436;border:1px solid var(--line2);color:var(--tx2);padding:3px 10px;border-radius:99px}
.chip.acc{background:rgba(255,194,71,.12);border-color:rgba(255,194,71,.3);color:var(--acc)}
/* ---------- tabs ---------- */
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:22px 0 22px;position:sticky;top:0;background:var(--bg);z-index:20;padding-top:6px}
.tabs button{all:unset;cursor:pointer;padding:9px 14px;font-size:13.5px;color:var(--tx2);border-radius:9px 9px 0 0;border-bottom:2px solid transparent;transition:.15s;display:flex;align-items:center;gap:7px}
.tabs button:hover{color:var(--tx);background:#141d2d}
.tabs button.on{color:var(--acc);border-bottom-color:var(--acc)}
.tabs .cnt{font-family:var(--mono);font-size:10.5px;background:#1c2740;padding:1px 6px;border-radius:99px;color:var(--tx3)}
/* ---------- cards ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:0 0 16px}
.card.star{border-color:rgba(255,194,71,.35);background:linear-gradient(180deg,rgba(255,194,71,.05),var(--panel) 60px)}
.card h3{display:flex;align-items:center;gap:8px;font-size:16px}
.star-badge{font-size:10px;background:rgba(255,194,71,.16);color:var(--acc);border:1px solid rgba(255,194,71,.3);padding:2px 8px;border-radius:99px;letter-spacing:.5px;font-weight:700;white-space:nowrap}
.card ul{margin:8px 0 4px;padding-left:20px}
.card li{margin-bottom:5px}
.note{border-left:3px solid var(--info);background:rgba(94,177,255,.07);padding:9px 13px;border-radius:0 9px 9px 0;font-size:13.5px;color:#cfe2fb;margin:12px 0 0}
.note.warn{border-color:var(--acc);background:rgba(255,194,71,.07);color:#ffe6b0}
.note.bad{border-color:var(--bad);background:rgba(255,107,107,.07);color:#ffd0d0}
.note b{color:#fff}
/* ---------- code ---------- */
.codewrap{position:relative;margin:12px 0 0;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#0a1018}
.codehead{display:flex;align-items:center;gap:8px;padding:6px 12px;background:#0e1622;border-bottom:1px solid var(--line);font-size:11px;color:var(--tx3);font-family:var(--mono);letter-spacing:.4px}
.codehead .cp{margin-left:auto;cursor:pointer;color:var(--tx3);font-size:11px;padding:2px 8px;border-radius:6px;border:1px solid var(--line)}
.codehead .cp:hover{color:var(--acc);border-color:var(--acc)}
pre{margin:0;padding:13px 15px;overflow-x:auto;font-family:var(--mono);font-size:12.9px;line-height:1.62;tab-size:2}
pre::-webkit-scrollbar{height:8px}
pre::-webkit-scrollbar-thumb{background:#25324b;border-radius:99px}
pre code{background:none;border:0;padding:0;border-radius:0;color:inherit;font-size:inherit;white-space:pre;display:block}
.k{color:#ff9ecd}.t{color:#7fd6ff}.s{color:#b8e994}.c{color:#5b6d87;font-style:italic}.n{color:#ffcb6b}.op{color:#c8d3e8}.at{color:#b48cff}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:820px){.split{grid-template-columns:1fr}}
.badcode .codehead{background:rgba(255,107,107,.09);color:#ff9d9d;border-bottom-color:rgba(255,107,107,.25)}
.badcode{border-color:rgba(255,107,107,.3)}
.okcode .codehead{background:rgba(61,220,151,.09);color:#7fe9bd;border-bottom-color:rgba(61,220,151,.25)}
.okcode{border-color:rgba(61,220,151,.3)}
/* ---------- table ---------- */
table{width:100%;border-collapse:collapse;margin:12px 0 0;font-size:13.5px}
th{text-align:left;padding:9px 11px;background:#16202f;color:var(--tx2);font-weight:600;font-size:12px;letter-spacing:.4px;text-transform:uppercase;border-bottom:1px solid var(--line)}
td{padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td code{white-space:normal}
/* ---------- quiz / drills ---------- */
.q{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:14px}
.q .qh{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.q .qn{font-family:var(--mono);font-size:11px;background:#1c2740;color:var(--tx3);width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;margin-top:1px}
.q .qt{font-size:15px;font-weight:600;line-height:1.5}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opt{all:unset;cursor:pointer;display:flex;gap:11px;align-items:flex-start;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:#101828;transition:.13s;font-size:14px;line-height:1.5}
.opt:hover:not(.locked){border-color:var(--line2);background:#152034;transform:translateX(2px)}
.opt .ltr{font-family:var(--mono);font-size:11px;width:20px;height:20px;border-radius:5px;background:#1e2a40;display:grid;place-items:center;flex:none;color:var(--tx3);margin-top:1px}
.opt.right{border-color:var(--ok);background:rgba(61,220,151,.10)}
.opt.right .ltr{background:var(--ok);color:#05130c}
.opt.wrong{border-color:var(--bad);background:rgba(255,107,107,.10)}
.opt.wrong .ltr{background:var(--bad);color:#2a0505}
.opt.locked{cursor:default}
.opt.dim{opacity:.5}
.expl{margin-top:12px;padding:11px 14px;border-radius:10px;background:#0e1622;border:1px solid var(--line);font-size:13.5px;color:var(--tx2);display:none}
.expl.show{display:block;animation:fade .25s}
.expl b{color:var(--acc)}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.scorebar{position:sticky;bottom:14px;background:linear-gradient(135deg,#16223a,#111a2b);border:1px solid var(--line2);border-radius:13px;padding:13px 18px;display:flex;align-items:center;gap:14px;margin-top:20px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.scorebar b{font-size:19px;font-family:var(--mono)}
.btn{all:unset;cursor:pointer;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#141414;font-weight:700;font-size:13px;padding:8px 16px;border-radius:9px;transition:.15s;text-align:center}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--tx2);font-weight:500}
.btn.ghost:hover{border-color:var(--acc);color:var(--acc);filter:none}
/* ---------- flashcards ---------- */
.fcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:12px}
.fc{height:165px;perspective:1200px;cursor:pointer}
.fci{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
.fc.flip .fci{transform:rotateY(180deg)}
.fcf,.fcb{position:absolute;inset:0;backface-visibility:hidden;border-radius:13px;border:1px solid var(--line);padding:16px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:14px;overflow:auto}
.fcf{background:var(--panel);font-weight:600}
.fcb{background:linear-gradient(135deg,#16233a,#101827);transform:rotateY(180deg);color:var(--tx2);font-size:13.2px;line-height:1.55}
.fcf:after{content:"κλικ για απάντηση";position:absolute;bottom:9px;left:0;right:0;font-size:10px;color:var(--tx3);letter-spacing:.5px;font-weight:400}

/* ---------- task editor ---------- */
.taskgrid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:start;margin-top:16px}
@media(max-width:1150px){.taskgrid{grid-template-columns:1fr}}
.edwrap{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#0a1018}
.edhead{display:flex;align-items:center;gap:8px;padding:7px 12px;background:#0e1622;border-bottom:1px solid var(--line);font-size:11px;color:var(--tx3);font-family:var(--mono);letter-spacing:.4px}
textarea.ed{display:block;width:100%;min-height:560px;background:#0a1018;color:#e6edf7;border:0;outline:none;font-family:var(--mono);font-size:12.9px;line-height:1.62;padding:13px 15px;resize:vertical;tab-size:4;white-space:pre;overflow-wrap:normal;overflow-x:auto}
textarea.ed::placeholder{color:var(--tx3)}
.chk{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;position:sticky;top:62px}
.chk .hd{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;text-transform:uppercase;letter-spacing:.9px;color:var(--tx3);font-weight:600}
.chk .hd b{font-family:var(--mono);font-size:15px;color:var(--acc);letter-spacing:0}
.chk ul{list-style:none;padding:0;margin:11px 0 0}
.chk li{display:flex;gap:9px;align-items:flex-start;padding:7px 0;font-size:13px;color:var(--tx3);border-top:1px solid rgba(255,255,255,.045);line-height:1.45}
.chk li:first-child{border-top:0}
.chk li .b{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line2);flex:none;margin-top:2px;display:grid;place-items:center;font-size:10px;color:transparent;transition:.15s}
.chk li.ok{color:var(--tx)}
.chk li.ok .b{background:var(--ok);border-color:var(--ok);color:#05130c}
.chk li.no .b{border-color:var(--line2)}
.chk .done{margin-top:12px;padding:11px 13px;border-radius:10px;background:rgba(61,220,151,.1);border:1px solid var(--ok);color:#8ff0c6;font-size:13px}
.tbar{height:5px;border-radius:99px;background:#1c2740;overflow:hidden;margin-top:9px}
.tbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--ok));width:0;transition:width .3s}
.tabs button.tsk{color:var(--acc)}
.tabs button.tsk.on{color:var(--acc)}
.taskbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hintbox{border-left:3px solid var(--pur);background:rgba(180,140,255,.07);padding:10px 13px;border-radius:0 9px 9px 0;font-size:13.3px;color:#ddd0ff;margin-top:10px}
.hintbox b{color:#fff}
/* ---------- misc ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.pit{border:1px solid var(--line);border-radius:13px;overflow:hidden;margin-bottom:14px;background:var(--panel)}
.pit>.ph{padding:12px 16px;font-weight:600;font-size:14.5px;display:flex;gap:9px;align-items:center;background:#141d2d;border-bottom:1px solid var(--line)}
.pit>.ph .x{color:var(--bad);font-size:16px}
.pit>.pb{padding:14px 16px}
.why{font-size:13.5px;color:var(--tx2);margin-top:11px;padding-left:11px;border-left:2px solid var(--line2)}
.iv{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--panel);overflow:hidden}
.iv summary{cursor:pointer;padding:13px 17px;font-weight:600;font-size:14.5px;list-style:none;display:flex;gap:10px;align-items:center}
.iv summary::-webkit-details-marker{display:none}
.iv summary:before{content:"▸";color:var(--acc);transition:.2s;display:inline-block}
.iv[open] summary:before{transform:rotate(90deg)}
.iv summary:hover{background:#151f31}
.iv .ivb{padding:2px 17px 16px 38px;color:var(--tx2);font-size:14px;border-top:1px solid var(--line)}
.iv .ivb>:first-child{margin-top:12px}
.day-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:13px;margin-top:16px}
.dtile{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px;cursor:pointer;transition:.16s}
.dtile:hover{border-color:var(--acc);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.dtile .dn{font-family:var(--mono);font-size:11px;color:var(--acc);letter-spacing:1px}
.dtile h4{margin:6px 0 6px;font-size:15px}
.dtile p{font-size:12.8px;color:var(--tx3);margin:0}
.plan{border-left:2px solid var(--line);padding-left:22px;margin-left:8px;position:relative}
.plan .step{margin-bottom:22px;position:relative}
.plan .step:before{content:"";position:absolute;left:-28px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--acc);border:3px solid var(--bg)}
.plan h4{margin:0 0 4px;font-size:15.5px}
.plan .t{font-size:11.5px;color:var(--acc);font-family:var(--mono);letter-spacing:.5px}
.hl{background:rgba(255,194,71,.22);border-radius:3px;padding:0 2px}
.empty{color:var(--tx3);text-align:center;padding:50px 20px;font-size:14px}
.gap{display:inline-block;min-width:92px;border-bottom:2px dashed var(--acc);text-align:center;font-family:var(--mono);color:var(--acc);cursor:pointer;padding:0 6px}
.gap.filled{border-bottom-style:solid;color:var(--ok);border-color:var(--ok)}
.gap.err{color:var(--bad);border-color:var(--bad)}
.tokens{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.tok{all:unset;cursor:pointer;font-family:var(--mono);font-size:12.5px;background:#1a2436;border:1px solid var(--line2);padding:5px 11px;border-radius:7px;transition:.13s}
.tok:hover{border-color:var(--acc);color:var(--acc)}
.tok.used{opacity:.3;pointer-events:none}
kbd{font-family:var(--mono);font-size:11px;background:#1c2740;border:1px solid var(--line2);border-bottom-width:2px;padding:1px 6px;border-radius:5px}
.res{margin-top:20px;text-align:center;padding:26px;border-radius:14px;border:1px solid var(--line)}
.res.pass{border-color:var(--ok);background:rgba(61,220,151,.07)}
.res.fail{border-color:var(--acc);background:rgba(255,194,71,.07)}
.res .big{font-size:44px;font-weight:800;font-family:var(--mono);line-height:1}
.srch-item{padding:11px 14px;border:1px solid var(--line);border-radius:11px;margin-bottom:8px;cursor:pointer;background:var(--panel)}
.srch-item:hover{border-color:var(--acc)}
.srch-item .where{font-size:11px;color:var(--acc);letter-spacing:.5px;text-transform:uppercase}
.srch-item .what{font-size:14px;margin-top:3px}
.srch-item .prev{font-size:12.5px;color:var(--tx3);margin-top:4px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand"><div class="dot">C#</div><div><b>Novibet .NET Trainer</b><span>Days 01 — 09 · interactive</span></div></div>
    <div class="searchbox">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8fa0bb" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      <input id="search" placeholder="Αναζήτηση… (Ctrl+K)" autocomplete="off">
    </div>
    <div class="progwrap">
      <div class="lbl"><span>Quiz ενοτήτων</span><span id="pgtxt">0 / 9</span></div>
      <div class="bar"><i id="pgbar"></i></div>
      <div class="lbl" style="margin-top:11px"><span>Εργασίες κώδικα</span><span id="tktxt">0 / 9</span></div>
      <div class="bar"><i id="tkbar" style="background:linear-gradient(90deg,#2bb673,#3ddc97)"></i></div>
    </div>
    <div class="navsec">Ξεκίνα εδώ</div>
    <div class="nav" id="nav-top"></div>
    <div class="navsec">Η ύλη</div>
    <div class="nav" id="nav-days"></div>
    <div class="navsec">Εξάσκηση</div>
    <div class="nav" id="nav-bot"></div>
  </aside>
  <main id="main"></main>
</div>
<script>
const DAYS = [
/* ============================ DAY 01 ============================ */
{
n:1, title:"C# Basics", tag:"Types · Classes · Collections · Null · Control flow",
sub:"Το θεμέλιο. Αν καταλάβεις σωστά μόνο ένα πράγμα σήμερα, ας είναι το value vs reference.",
goal:"Να γράφεις κλάσεις με properties/constructors, να διαλέγεις σωστή collection, να χειρίζεσαι null χωρίς NullReferenceException.",
concepts:[
{t:"Value types vs Reference types", star:true,
html:`Αυτό είναι <b>το mental model</b> της C#. Καθορίζει τι θα συμβεί σε κάθε ανάθεση (<code>=</code>) που θα γράψεις στη ζωή σου.
<ul>
<li><b>Value type</b> → η μεταβλητή κρατάει <i>την ίδια την τιμή</i>. Ανάθεση = <b>αντιγραφή</b>. Ζει (κυρίως) στο stack. Ο GC δεν ασχολείται.</li>
<li><b>Reference type</b> → η μεταβλητή κρατάει μια <i>διεύθυνση</i> στο heap. Ανάθεση = αντιγραφή της <b>διεύθυνσης</b>, όχι του αντικειμένου. Δύο μεταβλητές δείχνουν στο ίδιο πράγμα.</li>
</ul>`,
code:{lang:"csharp",label:"value-vs-reference.cs",src:`// ── VALUE TYPE ─────────────────────────────
int a = 5;
int b = a;      // αντιγραφή της τιμής
b = 10;
// a είναι ακόμα 5   ✔

// ── REFERENCE TYPE ─────────────────────────
var p1 = new Player("Alice");
var p2 = p1;    // αντιγραφή του reference — ΙΔΙΟ object!
p2.Name = "Bob";
// p1.Name είναι επίσης "Bob"   ⚠

// Value types:   int, double, float, decimal, bool, char,
//                struct, enum, DateTime, Guid
// Reference types: class, record, interface, string, object,
//                  array, List<T>, delegate, dynamic`},
table:{head:["","Value types","Reference types"],rows:[
["Πού αποθηκεύεται","Stack (κυρίως)","Heap"],
["Τι κρατά η μεταβλητή","Την τιμή (π.χ. <code>5</code>)","Τη διεύθυνση (pointer)"],
["<code>a = b</code>","Αντίγραφο της τιμής","Αντίγραφο του reference"],
["Garbage Collector","Δεν το αγγίζει","Το καθαρίζει ο GC"]]},
note:{type:"warn",html:`Το <code>string</code> είναι reference type <b>αλλά immutable</b> — γι' αυτό συμπεριφέρεται σαν value type στην πράξη. Το <code>==</code> στα strings συγκρίνει <b>περιεχόμενο</b> (ειδική περίπτωση), σε δικές σου κλάσεις συγκρίνει <b>reference</b>.`}},

{t:"Classes, Properties & Constructors",
html:`Η κλάση είναι το blueprint. Το <b>property</b> είναι ελεγχόμενη πρόσβαση σε κατάσταση — <u>ποτέ public field</u>. Ο constructor είναι το σημείο όπου το αντικείμενο γεννιέται <b>έγκυρο</b>: αν δεν μπορεί να είναι έγκυρο, ρίχνεις exception εκεί.`,
code:{lang:"csharp",label:"Player.cs",src:`public class Player
{
    // Auto-implemented properties
    public Guid   Id    { get; }              // μόνο ο constructor
    public string Name  { get; set; }         // όλοι
    public int    Score { get; private set; } // μόνο η ίδια η κλάση

    public Player(string name)
    {
        // Validation στον constructor: το object γεννιέται έγκυρο ή καθόλου
        if (string.IsNullOrWhiteSpace(name))
            throw new ArgumentException("Name cannot be empty", nameof(name));

        Id    = Guid.NewGuid();
        Name  = name;
        Score = 0;
    }

    public void AddScore(int points)
    {
        if (points < 0) throw new ArgumentOutOfRangeException(nameof(points));
        Score += points;   // η μόνη πόρτα για να αλλάξει το Score
    }

    public override string ToString() => $"{Name} (Score: {Score})";
}`},
table:{head:["Property","Read","Write","Ποιος θέτει την τιμή"],rows:[
["<code>Id { get; }</code>","✅","❌","Μόνο ο constructor"],
["<code>Name { get; set; }</code>","✅","✅","Οποιοσδήποτε"],
["<code>Score { get; private set; }</code>","✅","✅*","Μόνο η κλάση Player"]]}},

{t:"Control flow — προτίμησε το switch expression",
html:`Όλα τα κλασικά υπάρχουν (<code>if/else</code>, <code>for</code>, <code>foreach</code>, <code>while</code>, <code>do/while</code>). Ο κανόνας: <b>for</b> όταν χρειάζεσαι index, <b>foreach</b> για οτιδήποτε <code>IEnumerable&lt;T&gt;</code>, <b>do/while</b> όταν πρέπει να τρέξει τουλάχιστον μία φορά. Για mapping τιμή → τιμή, το <b>switch expression</b> (C# 8+) είναι μισός κώδικας και δεν ξεχνάς <code>break</code>.`,
code:{lang:"csharp",label:"switch-expression.cs",src:`// ✕ Παλιό switch statement — φλύαρο, ξεχνάς break, χρειάζεται προδήλωση
string label;
switch (player.Score)
{
    case 0:  label = "New player"; break;
    default: label = player.Score < 1000 ? "Beginner" : "Expert"; break;
}

// ✓ switch expression (C# 8+) — μία έκφραση, ο compiler ελέγχει πληρότητα
string label2 = player.Score switch
{
    0        => "New player",
    < 1000   => "Beginner",
    < 10000  => "Intermediate",
    _        => "Expert",          // _ = default
};

// Χρήσιμα μοτίβα
foreach (var p in players)
{
    if (p.Score == 0) continue;    // skip αυτό το iteration
    if (p.Score >= 10000) break;   // βγες τελείως από το loop
    Console.WriteLine(p.Name);
}`}},

{t:"Collections — ποια διαλέγεις",
html:`Το 90% της δουλειάς είναι δύο τύποι: <code>List&lt;T&gt;</code> όταν σε νοιάζει η <b>σειρά</b>, <code>Dictionary&lt;K,V&gt;</code> όταν σε νοιάζει το <b>lookup με κλειδί</b>. Το lookup σε <code>List</code> είναι O(n) — σε <code>Dictionary</code> O(1).`,
code:{lang:"csharp",label:"collections.cs",src:`// List<T> — ordered, dynamic size, επιτρέπει duplicates
var players = new List<Player>();
players.Add(new Player("Alice"));
players.Add(new Player("Bob"));

var alice = players.FirstOrDefault(p => p.Name == "Alice");   // null αν δεν βρεθεί
var top3  = players.OrderByDescending(p => p.Score).Take(3).ToList();
players.Remove(alice);   // by reference
players.RemoveAt(0);     // by index

// Dictionary<K,V> — O(1) lookup, μοναδικά keys
var registry = new Dictionary<Guid, Player>();
registry[player.Id] = player;          // add ή overwrite

if (registry.TryGetValue(id, out var found))   // ← το σωστό pattern
    Console.WriteLine(found.Name);
// registry[id] πετάει KeyNotFoundException αν δεν υπάρχει!

registry.ContainsKey(id);
registry.Remove(id);`},
table:{head:["Collection","Ordered","Duplicates","Lookup by key","Πότε"],rows:[
["<code>List&lt;T&gt;</code>","✅","✅","❌","Σειρά, iteration — το default"],
["<code>Dictionary&lt;K,V&gt;</code>","❌","Key ❌ / Value ✅","✅","Lookup με id/κλειδί"],
["<code>HashSet&lt;T&gt;</code>","❌","❌","❌","Μοναδικότητα, γρήγορο Contains"],
["<code>Queue&lt;T&gt;</code>","✅","✅","❌","FIFO — ουρά εργασιών"],
["<code>Stack&lt;T&gt;</code>","✅","✅","❌","LIFO — undo, αναδρομή"],
["<code>Array</code>","✅","✅","❌","Σταθερό μέγεθος, performance"]]}},

{t:"Null handling", star:true,
html:`Το <code>NullReferenceException</code> είναι το #1 runtime error. Η C# σου δίνει τέσσερα εργαλεία — μάθε και τα τέσσερα.`,
code:{lang:"csharp",label:"null-handling.cs",src:`// ? σε value type → nullable
int? score = null;
int value = score ?? 0;              // ?? null-coalescing: "αν null, δώσε 0"

// ?. null-conditional: "αν null, μη συνεχίσεις — γύρνα null"
string? name = player?.Name;         // null αν player == null
int len = player?.Name?.Length ?? 0; // αλυσίδα με ασφάλεια

// Nullable reference types (.NET 6+, <Nullable>enable</Nullable>)
string  nonNullable = "Alice";       // ο compiler σε προειδοποιεί αν βάλεις null
string? nullable    = null;          // ρητά μπορεί να είναι null

// Pattern matching — ο μοντέρνος τρόπος
if (player is null)      Console.WriteLine("Not found");
if (player is not null)  player.AddScore(100);

// Guard σε public API
ArgumentNullException.ThrowIfNull(player);`},
note:{type:"warn",html:`<code>??</code> vs <code>?.</code>: το <code>?.</code> <b>σταματάει την αλυσίδα</b> και γυρνά null· το <code>??</code> <b>δίνει εναλλακτική τιμή</b>. Σχεδόν πάντα τα χρησιμοποιείς μαζί.`}},

html:`Στο Novibet (και παντού) το <code>main</code> είναι η <b>πηγή αλήθειας</b>: ποτέ direct commit. Δουλεύεις σε feature branch, ανοίγεις PR, περνάς code review, γίνεται merge.`,

# ...γράφεις κώδικα...
git add .
git commit -m "feat: player registry console app"
git push -u origin day01/player-registry  # μετά → Pull Request στο GitHub

# Χρήσιμα
git status          # τι έχει αλλάξει
git log --oneline   # ιστορικό
git diff            # τι ακριβώς άλλαξε`},

],
pitfalls:[
{t:"<code>==</code> σε reference types",
bad:`var p1 = new Player("Alice");
var p2 = new Player("Alice");

if (p1 == p2)      // false! Συγκρίνει references
    Console.WriteLine("ίδιοι");`,
good:`// Λύση 1: σύγκρινε αυτό που σε νοιάζει
if (p1.Name == p2.Name) { }

// Λύση 2: record → value equality δωρεάν (Day 02)
public record PlayerData(string Name, int Score);`,
why:`Δύο διαφορετικά αντικείμενα στο heap έχουν διαφορετικές διευθύνσεις, ακόμα κι αν τα περιεχόμενα είναι ίδια. Εξαίρεση: το <code>string</code> κάνει override το <code>==</code> και συγκρίνει περιεχόμενο.`},
{t:"Public mutable field αντί για property",
bad:`public class Player
{
    public int Score;   // ο καθένας το αλλάζει, χωρίς κανόνες
}
player.Score = -9999;   // κανείς δεν το εμπόδισε`,
good:`public class Player
{
    public int Score { get; private set; }

    public void AddScore(int points)
    {
        if (points < 0) throw new ArgumentOutOfRangeException(nameof(points));
        Score += points;
    }
}`,
why:`Το property σου δίνει <b>έλεγχο</b> στο πότε και πώς αλλάζει η κατάσταση. Είναι το πρώτο βήμα του encapsulation (Day 02) και το θεμέλιο του DDD entity (Day 04).`},
{t:"Direct indexer σε Dictionary",
bad:`var player = registry[id];   // KeyNotFoundException αν λείπει`,
good:`if (registry.TryGetValue(id, out var player))
    Use(player);
else
    NotFound();`,

],

iv:[
["Εξήγησέ μου τη διαφορά stack και heap στη C#.",
"Το stack είναι μια γρήγορη, LIFO περιοχή μνήμης ανά thread: εκεί ζουν τα local variables και τα value types, και καθαρίζονται αυτόματα όταν βγει το scope. Το heap είναι κοινή περιοχή όπου ζουν τα αντικείμενα των reference types· τα διαχειρίζεται ο Garbage Collector. Όταν γράφω <code>new Player(...)</code>, το αντικείμενο πάει στο heap και η μεταβλητή στο stack κρατά μόνο τη διεύθυνσή του. Πρακτική συνέπεια: ανάθεση value type = αντίγραφο, ανάθεση reference type = δεύτερο «κλειδί» για το ίδιο σπίτι."],
["Γιατί properties και όχι public fields;",
"Το property είναι στην ουσία ζεύγος μεθόδων, οπότε μπορώ να βάλω κανόνες (validation, logging, lazy loading) χωρίς να αλλάξω το API προς τους callers. Επίσης μου δίνει διαφορετικά δικαιώματα ανάγνωσης/εγγραφής — π.χ. <code>{ get; private set; }</code> — που είναι το θεμέλιο του encapsulation: η κατάσταση αλλάζει μόνο μέσα από μεθόδους που επιβάλλουν τους κανόνες."],
["Πώς αποφεύγεις το NullReferenceException;",
"Πρώτα με nullable reference types ενεργοποιημένα, ώστε ο compiler να μου δείχνει πού μπορεί να υπάρξει null. Μετά με guard clauses στα public entry points (<code>ArgumentNullException.ThrowIfNull</code>), με <code>?.</code> και <code>??</code> όπου το null είναι θεμιτό, και με το Try* pattern αντί για direct indexer. Ο κανόνας μου: το null δεν πρέπει να ταξιδεύει βαθιά μέσα στο σύστημα — το σταματάω στο σύνορο."]
]
},

n:2, title:"OOP, LINQ, Records & Tasks", tag:"3 πυλώνες · Interfaces · LINQ · Records · async",
sub:"Από «γράφω κώδικα που τρέχει» σε «γράφω κώδικα που άλλοι μπορούν να επεκτείνουν».",
goal:"Να διαλέγεις abstract class vs interface, να γράφεις LINQ pipelines αντί για loops, να ξέρεις πότε record και πότε class.",
concepts:[
{t:"Οι 3 πυλώνες του OOP", star:true,
html:`<ul>
<li><b>Inheritance</b> — reuse πεδίων/συμπεριφοράς από base class, με <code>:</code>. Στη C# <b>μία μόνο</b> base class (όχι multiple inheritance).</li>
<li><b>Encapsulation</b> — κρύβεις την εσωτερική κατάσταση πίσω από ελεγχόμενο public API. Εσύ αποφασίζεις <i>πώς</i> και <i>πότε</i> αλλάζει.</li>
<li><b>Polymorphism</b> — μία διεπαφή, πολλές υλοποιήσεις. Η συμπεριφορά καθορίζεται από τον <b>runtime type</b>, όχι από τον τύπο της μεταβλητής.</li>
</ul>`,
code:{lang:"csharp",label:"polymorphism.cs",src:`public abstract class Payment
{
    protected Payment(decimal amount) => Amount = amount;
    public decimal Amount { get; }

    // Abstract member: κάθε concrete payment ΠΡΕΠΕΙ να δώσει το δικό του Pay()
    public abstract void Pay();
}

public class CardPayment : Payment
{
    private readonly string _card;
    public CardPayment(decimal amount, string card) : base(amount) => _card = card;
    public override void Pay() => Console.WriteLine($"I paid with card {Amount} EUR");
}

public class CashPayment : Payment
{
    public CashPayment(decimal amount) : base(amount) { }
    public override void Pay() => Console.WriteLine($"I paid with cash {Amount} EUR");
}

// ── Polymorphism σε δράση ────────────────────────────────
Payment cardPayment = new CardPayment(10m, "4111...");
Payment cashPayment = new CashPayment(5m);

cardPayment.Pay();   // "I paid with card 10 EUR"
cashPayment.Pay();   // "I paid with cash 5 EUR"
// Ο τύπος της μεταβλητής είναι Payment — η συμπεριφορά έρχεται από το runtime type`},
note:{type:"info",html:`Αυτό είναι το κλειδί: ο κώδικας που καλεί <code>Pay()</code> <b>δεν χρειάζεται να ξέρει</b> ποιο είδος πληρωμής είναι. Νέο είδος πληρωμής = νέα κλάση, μηδέν αλλαγές στους callers. Είναι το ίδιο μοτίβο με το Strategy pattern (Day 04).`}},

{t:"Access modifiers",
html:`Ο κανόνας: <b>ξεκίνα από το πιο κλειστό</b> και άνοιξε μόνο ό,τι χρειάζεται.`,
table:{head:["Modifier","Ποιος βλέπει"],rows:[
["<code>public</code>","Όλοι, από παντού"],
["<code>private</code>","Μόνο η ίδια η κλάση (ούτε οι κληρονόμοι)"],
["<code>protected</code>","Η ίδια η κλάση + όσες κληρονομούν από αυτήν"],
["<code>internal</code>","Μόνο μέσα στο ίδιο assembly (project)"],
["<code>sealed</code>","(σε class) δεν μπορεί να κληρονομηθεί"]]}},

{t:"Abstract class vs Interface", star:true,
html:`Η πιο συχνή ερώτηση συνέντευξης για junior. Η απάντηση σε μία γραμμή: <b>abstract class = «είναι» με κοινή υλοποίηση, interface = «μπορεί να κάνει» / συμβόλαιο.</b>`,
code:{lang:"csharp",label:"abstract-vs-interface.cs",src:`// ABSTRACT CLASS — μοιράζεται δεδομένα και υλοποίηση
public abstract class Payment
{
    protected Payment(decimal amount) => Amount = amount;
    public decimal Amount { get; }          // shared data
    public void LogAudit() => /* κοινή υλοποίηση */ ;
    public abstract void Pay();             // υποχρεωτικό override
}

// INTERFACE — καθαρό συμβόλαιο, χωρίς κατάσταση
public interface IRefundable
{
    void Refund(decimal amount);
}

// Μία base class... αλλά ΟΣΑ interfaces θέλεις
public class CardPayment : Payment, IRefundable, IDisposable
{
    public override void Pay()   { }
    public void Refund(decimal a){ }
    public void Dispose()        { }
}`},
table:{head:["","Abstract class","Interface"],rows:[
["Πολλαπλή κληρονομιά","❌ μία μόνο","✅ όσα θες"],
["Κρατά κατάσταση (fields)","✅","❌ (μόνο properties/μέθοδοι)"],
["Default implementation","✅","✅ από C# 8, αλλά σπάνια"],
["Constructor","✅","❌"],
["Πότε","Κοινή βάση + shared code","Συμβόλαιο, testability, DI"]]},
note:{type:"warn",html:`Στην πράξη στο Novibet stack: <b>interfaces παντού</b> (γιατί κάνεις inject και mock — Day 04 & 09), abstract class μόνο όταν υπάρχει πραγματικά κοινή υλοποίηση (π.χ. <code>DomainException</code> — Day 03).`}},

{t:"Nullable&lt;T&gt; και generic collections",
html:`Το <code>Nullable&lt;T&gt;</code> (δηλαδή <code>int?</code>) επιτρέπει σε value type να παραστήσει «καμία τιμή» — που είναι <b>διαφορετικό</b> από το 0. Κρίσιμο για δεδομένα από βάση. Και προσοχή: παραμένει struct — δεν γίνεται reference type.`,
code:{lang:"csharp",label:"nullable-and-generics.cs",src:`decimal? amount = null;
if (amount.HasValue)
    Use(amount.Value);          // .Value πετάει αν είναι null!

// Στην πραγματικότητα είναι:
public struct Nullable<T> where T : struct
{
    public bool HasValue { get; }
    public T    Value    { get; }
}

// ── Generic vs non-generic collections ──────────────────
var old = new ArrayList();      // ✕ System.Collections — τα πάντα ως object
old.Add(42);                    //   BOXING: int → object (heap allocation)
int x = (int)old[0];            //   UNBOXING + cast, χωρίς type safety

var list = new List<int>();     // ✓ System.Collections.Generic
list.Add(42);                   //   χωρίς boxing, type-safe στο compile time`},
note:{type:"info",html:`<b>Boxing</b> = η μετατροπή value type σε reference type (τυλίγεται σε object στο heap). Κοστίζει allocation + GC. Γι' αυτό τα generics υπάρχουν.`}},

{t:"LINQ — τα βασικά", star:true,
html:`LINQ = Language Integrated Query. Περιγράφεις <b>τι</b> θέλεις, όχι <b>πώς</b> να γίνει. Δουλεύει το ίδιο σε λίστα στη μνήμη, σε XML ή σε βάση (Day 05).`,
code:{lang:"csharp",label:"linq-basics.cs",src:`// Filtering & projection
IEnumerable<Payment> mine = payments.Where(p => p.CustomerId == 123);
IEnumerable<int> ids       = payments.Select(p => p.CustomerId);

// Ένα στοιχείο
var first  = payments.First();               // ✕ πετάει αν άδειο
var safe   = payments.FirstOrDefault();      // ✓ null / default αν άδειο
var only   = payments.Single(p => p.Id == 5);// ✕ πετάει αν 0 Ή >1 matches
var maybe  = payments.SingleOrDefault(p => p.Id == 5); // πετάει μόνο αν >1

// Έλεγχοι & paging
bool any   = payments.Any(p => p.Amount > 100);
int count  = payments.Count();
var page   = payments.Skip(20).Take(10);     // σελίδα 3, 10 ανά σελίδα

// SelectMany — flatten: κάθε στοιχείο δίνει σειρά, όλες ενώνονται σε μία
var allTags = players.SelectMany(p => p.Tags);

// GroupBy → IEnumerable<IGrouping<TKey, T>>, κάθε group έχει .Key
var byCountry = players.GroupBy(p => p.Country);
foreach (var g in byCountry)
    Console.WriteLine($"{g.Key}: {g.Count()} players");

// Εκτέλεση
List<Payment> l = payments.Where(p => p.Amount > 0).ToList();
Dictionary<int, Payment> map = payments.ToDictionary(p => p.Id);`},
note:{type:"warn",html:`<code>First()</code> vs <code>FirstOrDefault()</code> vs <code>Single()</code>: <b>First</b> = «δώσε μου το πρώτο, πρέπει να υπάρχει». <b>FirstOrDefault</b> = «μπορεί και να μην υπάρχει». <b>Single</b> = «πρέπει να υπάρχει ακριβώς ένα» — χρήσιμο ως assertion σε lookup με primary key.`}},

{t:"Deferred execution & method chaining", star:true,
html:`Το πιο παρεξηγημένο κομμάτι του LINQ. Όταν γράφεις ένα query, <b>δεν τρέχει τίποτα</b>. Χτίζεις ένα σχέδιο. Τρέχει μόνο όταν κάποιος το κάνει enumerate — <code>foreach</code>, <code>ToList()</code>, <code>Count()</code>, <code>First()</code>.`,
code:{lang:"csharp",label:"deferred-execution.cs",src:`// Τίποτα δεν έχει τρέξει ακόμα — απλώς ένα σχέδιο
var query = payments
    .Where(p => p.CustomerId == 146)
    .OrderByDescending(p => p.CreatedAt)
    .Select(p => new { p.Id, p.Amount })
    .Take(20);

payments.Add(new Payment { CustomerId = 146 });   // πρόσθεσα ΜΕΤΑ το query

var results = query.ToList();   // ← ΤΩΡΑ τρέχει, και βλέπει και το νέο payment!

// ⚠ Παγίδα: πολλαπλή εκτέλεση
var expensive = db.Players.Where(p => p.Score > 100);   // IQueryable
var c = expensive.Count();      // 1o hit στη βάση
var l = expensive.ToList();     // 2o hit στη βάση!
// Λύση: υλοποίησέ το μία φορά → var list = expensive.ToList();`},
note:{type:"bad",html:`Στο Day 05 αυτό γίνεται κρίσιμο: το <code>IQueryable</code> του EF Core μεταφράζεται σε SQL <b>τη στιγμή της υλοποίησης</b>. Αν κάνεις <code>.ToList()</code> νωρίς, φέρνεις όλο τον πίνακα στη μνήμη και φιλτράρεις εκεί.`}},

{t:"Records — value equality δωρεάν",
html:`Το <code>record</code> (C# 9) είναι reference type σχεδιασμένο για <b>δεδομένα</b>. Η μεγάλη διαφορά: δύο records είναι ίσα αν τα <b>περιεχόμενά</b> τους είναι ίσα.`,
code:{lang:"csharp",label:"records.cs",src:`// Positional record — ο πιο συνηθισμένος τρόπος για DTOs
public record PlayerDto(int Id, string Name, string Country);

// Ισοδύναμο με property syntax
public record PaymentRecord
{
    public decimal Amount     { get; init; }   // init = set μόνο κατά τη δημιουργία
    public int     CustomerId { get; init; }
}

var a = new PaymentRecord { Amount = 10m, CustomerId = 123 };
var b = new PaymentRecord { Amount = 10m, CustomerId = 123 };

a == b;        // TRUE  — value equality (σε class θα ήταν false)

// with expression — αντίγραφο με αλλαγές, χωρίς mutation
var c = a with { Amount = 20m };`},
note:{type:"info",html:`<b>Κανόνας:</b> record για <b>δεδομένα</b> (DTOs, commands/queries — Day 07, value objects — Day 04), class για <b>συμπεριφορά</b> (services, handlers, entities με invariants).`}},

{t:"Task & async/await — η πρώτη γνωριμία",
html:`Το <code>Task</code> είναι <b>υπόσχεση</b> μελλοντικού αποτελέσματος. Το πρόβλημα που λύνει: τα threads είναι ακριβά και το να τα μπλοκάρεις ενώ περιμένεις I/O (βάση, HTTP) είναι σπατάλη. Πλήρης ανάλυση στο Day 06.`,
code:{lang:"csharp",label:"task-intro.cs",src:`// Χωρίς async: το thread στέκεται και περιμένει τη βάση
public Player GetPlayer(int id) => _db.Players.Find(id);

// Με async: το thread επιστρέφει στο pool και εξυπηρετεί άλλο request
public async Task<Player?> GetPlayerAsync(int id)
    => await _db.Players.FindAsync(id);

// Παράλληλα ανεξάρτητα calls
var t1 = _api.GetRatesAsync();
var t2 = _db.GetPlayersAsync();
await Task.WhenAll(t1, t2);        // περιμένει και τα δύο
var rates = await t1;`}}
],
pitfalls:[
{t:"Το LINQ query εκτελείται πολλές φορές",
bad:`var top = players.Where(p => p.Score > 100)
                 .OrderByDescending(p => p.Score);

Console.WriteLine(top.Count());   // 1η εκτέλεση
foreach (var p in top) { }        // 2η εκτέλεση — ξανά όλη η δουλειά!`,
good:`var top = players.Where(p => p.Score > 100)
                 .OrderByDescending(p => p.Score)
                 .ToList();       // υλοποίησέ το ΜΙΑ φορά

Console.WriteLine(top.Count);     // property πλέον, όχι query
foreach (var p in top) { }`,
why:`Deferred execution: κάθε enumeration ξανατρέχει ολόκληρο το pipeline. Σε in-memory λίστα είναι απλώς σπατάλη· σε <code>IQueryable</code> (EF Core) είναι <b>δεύτερο query στη βάση</b>.`},
{t:"<code>Single()</code> εκεί που ήθελες <code>FirstOrDefault()</code>",
bad:`var player = players.Single(p => p.Country == "GR");
// InvalidOperationException: "Sequence contains more than one element"`,
good:`var player = players.FirstOrDefault(p => p.Country == "GR");
if (player is null) return NotFound();`,
why:`<code>Single</code> σημαίνει «εγγυώμαι ότι υπάρχει ακριβώς ένα». Χρησιμοποίησέ το μόνο για lookup με μοναδικό κλειδί, όπου το να υπάρχουν δύο <b>είναι</b> bug που θέλεις να μάθεις.`},
{t:"Non-generic collections / boxing",
bad:`var list = new ArrayList();
list.Add(1);
list.Add("δύο");             // κανείς δεν το εμπόδισε
int x = (int)list[1];        // InvalidCastException στο runtime`,
good:`var list = new List<int>();
list.Add(1);
// list.Add("δύο");          // ✓ compile error — το πιάνεις πριν τρέξει`,
why:`Τα generics δίνουν type safety στο <b>compile time</b> και αποφεύγουν το boxing. Οι non-generic (<code>ArrayList</code>, <code>Hashtable</code>) υπάρχουν μόνο για legacy συμβατότητα.`}
],

code:`var scores = new List<int> { 10, 20, 30 };

var query = scores.Where(s => s > 15);
scores.Add(40);

Console.WriteLine(query.Count());`,

{t:"Value equality",
code:`public record Point(int X, int Y);
public class  Dot  { public int X; public int Y; }

var r1 = new Point(1, 2);
var r2 = new Point(1, 2);
var d1 = new Dot { X = 1, Y = 2 };
var d2 = new Dot { X = 1, Y = 2 };

Console.WriteLine($"{r1 == r2} {d1 == d2}");`,
q:"Ποιο είναι το output;",
opts:["True True","True False","False True","False False"],a:1,
ex:"Το <code>record</code> έχει αυτόματα value equality (συγκρίνει περιεχόμενα) → True. Η <code>class</code> κρατά την default reference equality → δύο ξεχωριστά αντικείμενα στο heap → False."},
{t:"Ποιο LINQ;",
code:`// Έχω: List<Company> όπου κάθε Company έχει List<Car> Cars
// Θέλω: μία επίπεδη λίστα με ΟΛΑ τα αυτοκίνητα όλων των εταιρειών`,

],

iv:[
["Πότε θα διάλεγες interface και πότε abstract class;",
"Interface όταν ορίζω συμβόλαιο και θέλω πολλές, άσχετες μεταξύ τους υλοποιήσεις — ειδικά όταν το χρειάζομαι για dependency injection και mocking. Abstract class όταν οι υλοποιήσεις μοιράζονται πραγματικά κοινό κώδικα ή κατάσταση, π.χ. μια ιεραρχία <code>DomainException</code> με κοινά πεδία. Στην πράξη ξεκινάω από interface και προσθέτω abstract base μόνο όταν εμφανιστεί επανάληψη."],
["Εξήγησέ μου το deferred execution και πού μπορεί να σε καεί.",
"Το LINQ χτίζει pipeline και δεν το εκτελεί μέχρι να το κάνεις enumerate. Δύο πράγματα καίνε: πρώτον, αν κάνεις enumerate δύο φορές, η δουλειά γίνεται δύο φορές — σε EF Core σημαίνει δύο queries στη βάση. Δεύτερον, αν το underlying collection αλλάξει ανάμεσα στη δήλωση και την εκτέλεση, βλέπεις τα νέα δεδομένα, που συχνά εκπλήσσει. Ο κανόνας μου: υλοποιώ με <code>ToList()</code> στο σημείο που τελειώνει η σύνθεση του query."],
["Γιατί records για DTOs;",
"Επειδή ένα DTO <b>είναι</b> τα δεδομένα του: δύο DTOs με ίδια περιεχόμενα πρέπει λογικά να είναι ίσα, και το record μου το δίνει δωρεάν μαζί με χρήσιμο <code>ToString</code> για logs. Επίσης τα <code>init</code>-only properties τα κάνουν ουσιαστικά immutable, οπότε δεν μπορεί κάποιος να τα μεταλλάξει καθώς ταξιδεύουν μέσα στο σύστημα."]
]

concepts:[
{t:"Guard clauses — απόρριψη νωρίς", star:true,
html:`Το «pyramid of doom» (φωλιασμένα if) κρύβει το happy path στο βάθος. Οι guard clauses το γυρίζουν ανάποδα: <b>απορρίπτεις νωρίς, το happy path μένει flat και τελευταίο</b>.`,
code:{lang:"csharp",label:"✕ pyramid of doom",bad:true,src:`if (amount > 0) {
  if (amount >= 5m) {
    if (currency is "EUR" or "USD") {
      if (accountActive)
        return "OK (accepted)";
      else
        return "Rejected: not active";
    }
    else return "Rejected: currency";
  }
  else return "Rejected: below min";
}
else return "Rejected: amount <= 0";`},
code2:{lang:"csharp",label:"✓ guard clauses",ok:true,src:`if (amount <= 0)
    return "Rejected: must be positive";

if (amount < 5m)
    return "Rejected: below minimum";

if (currency is not ("EUR" or "USD" or "GBP"))
    return "Rejected: bad currency";

if (!accountActive)
    return "Rejected: not active";

return "OK";   // happy path: flat & last`},
note:{type:"info",html:`Ίδια λογική, μηδέν nesting. Κάθε συνθήκη διαβάζεται μόνη της, και προσθέτεις νέο κανόνα με μία γραμμή στη σωστή θέση.`}},

{t:"Validated path vs Exceptional path", star:true,
html:`Η πιο σημαντική απόφαση της ημέρας: <b>throw ή return;</b>
<ul>
<li><b>Αναμενόμενο & ανακτήσιμο</b> (ο χρήστης έβαλε αρνητικό ποσό) → επίστρεψε result/μήνυμα. Χωρίς throw, χωρίς stack trace, χωρίς θόρυβο στα logs.</li>
<li><b>Παραβίαση invariant</b> (ο λογαριασμός δεν υπάρχει) → <b>throw</b>. Κάτι πάει στραβά στο σύστημα, όχι στο input.</li>
</ul>`,
code:{lang:"csharp",label:"validated-vs-exceptional.cs",src:`// VALIDATED — ο χρήστης μπορεί νόμιμα να το κάνει λάθος
if (amount < 10m)
    return ValidationResult.Fail("Minimum withdrawal is 10.00.");

// EXCEPTIONAL — παραβίαση invariant του συστήματος
var account = _repo.Find(id)
    ?? throw new InvalidOperationException($"Account {id} was not found.");`},
note:{type:"bad",html:`Exceptions για συνηθισμένο validation = <b>control-flow abuse</b>: ακριβό (stack unwinding), θορυβώδες στα logs, και κρύβει τα πραγματικά προβλήματα.`}},

{t:"Ποιο exception, πότε",
html:`Μην πετάς σκέτο <code>Exception</code>. Ο τύπος του exception είναι <b>πληροφορία</b> για τον caller.`,
table:{head:["Exception","Σημαίνει","Παράδειγμα"],rows:[
["<code>ArgumentException</code> / <code>ArgumentNullException</code>","Ο caller έδωσε λάθος όρισμα","Κενό όνομα, null repository"],
["<code>ArgumentOutOfRangeException</code>","Το όρισμα εκτός επιτρεπτού εύρους","Αρνητικό ποσό ανάληψης"],
["<code>InvalidOperationException</code>","Το αντικείμενο σε λάθος state","Ανάληψη σε άγνωστο λογαριασμό"],
["<code>AccountLockedException</code> (custom)","Παραβίαση business rule","Κατάθεση σε κλειδωμένο λογαριασμό"]]},
code:{lang:"csharp",label:"custom-exceptions.cs",src:`// Ιεραρχία: μία abstract βάση + business-meaningful φύλλα
public abstract class DomainException : Exception
{
    protected DomainException(string message, Exception? inner = null)
        : base(message, inner) { }
}

// Το custom exception κουβαλά TYPED ΔΕΔΟΜΕΝΑ, όχι μόνο string
public class InsufficientBalanceException : DomainException
{
    public Guid    AccountId       { get; }
    public decimal Balance         { get; }
    public decimal RequestedAmount { get; }

    public InsufficientBalanceException(Guid accountId, decimal balance, decimal requested)
        : base($"Account {accountId} has {balance} but {requested} was requested.")
    {
        AccountId = accountId;
        Balance = balance;
        RequestedAmount = requested;
    }
}

// Ο caller μπορεί να αντιδράσει ΠΡΟΓΡΑΜΜΑΤΙΣΤΙΚΑ:
catch (InsufficientBalanceException ex)
{
    var missing = ex.RequestedAmount - ex.Balance;   // ← όχι parsing string!
    ShowTopUpPrompt(missing);
}

// Η ιεραρχία:
// DomainException (abstract)
//  ├─ InsufficientBalanceException (AccountId, Balance, RequestedAmount)
//  ├─ AccountLockedException       (AccountId)
//  ├─ UnsupportedCurrencyException (Currency)
//  └─ DepositFailedException       (AccountId, + InnerException)`}},

{t:"<code>throw;</code> vs <code>throw ex;</code>", star:true,
html:`Ίσως η πιο συχνή ερώτηση junior interview. Η διαφορά είναι ένα σύμβολο και όλο το stack trace σου.`,
code:{lang:"csharp",label:"✕ throw ex;",bad:true,src:`try { Deposit(); }
catch (Exception ex)
{
    _logger.LogError(ex, "failed");
    throw ex;      // ✕ ΜΗΔΕΝΙΖΕΙ το stack trace
                   //   Φαίνεται σαν να ξεκίνησε ΕΔΩ.
                   //   Χάθηκε η πραγματική γραμμή του bug.
}`},
code2:{lang:"csharp",label:"✓ throw;",ok:true,src:`try { Deposit(); }
catch (Exception ex)
{
    _logger.LogError(ex, "failed");
    throw;         // ✓ κρατά το αρχικό throw site
}

// Ή ακόμα καλύτερα — wrap με context:
catch (KeyNotFoundException ex)
{
    throw new DepositFailedException(account.Id,
        "Could not apply PSP settlement conversion.", ex);
    //  ↑ το ex γίνεται InnerException
}`},
note:{type:"bad",html:`<b>Ποτέ άδειο catch.</b> <code>catch (Exception) { }</code> είναι χειρότερο από crash: το bug υπάρχει, απλώς κανείς δεν το μαθαίνει. Και πάντα <b>catch specific πριν το general</b> — ο CLR παίρνει το πρώτο match.`}},

{t:"AggregateException",
html:`Όταν πολλά tasks αποτυγχάνουν ταυτόχρονα, χρειάζεσαι <b>όλα</b> τα σφάλματα, όχι το πρώτο.`,
code:{lang:"csharp",label:"aggregate-exception.cs",src:`try
{
    Task.WaitAll(taskA, taskB, taskC);     // blocking
}
catch (AggregateException agg)
{
    foreach (var inner in agg.InnerExceptions)      // ← ΟΛΑ τα failures
        Console.WriteLine($"{inner.GetType().Name}: {inner.Message}");
}

// .InnerException  (ενικός) → μόνο το ΠΡΩΤΟ failure
// .InnerExceptions (πληθυντικός) → ΟΛΑ, ως collection

// ⚠ await Task.WhenAll(...) κάνει unwrap ΜΟΝΟ το πρώτο exception.
//   Αν θέλεις όλα, κράτα το Task και δες το task.Exception.`}},

{t:"Logging: γιατί όχι <code>Console.WriteLine</code>", star:true,
html:`Το <code>Console.WriteLine</code> είναι μια χαρά για script πέντε λεπτών. Δεν είναι ο τρόπος που μια υπηρεσία μιλάει στους operators της:
<ul>
<li>Χωρίς <b>level</b> — δεν ξεχωρίζεις το «info» από το «το site έπεσε».</li>
<li>Χωρίς timestamp, category, correlation id — δεν ξέρεις ποιο request, πότε, πού.</li>
<li>Δεν φιλτράρεται και δεν σβήνει ανά περιβάλλον.</li>
<li>Δεν είναι structured — είναι αδιαφανές string, δεν κάνεις query ούτε alert.</li>
</ul>`,
code:{lang:"csharp",label:"structured-logging.cs",src:`// ✕ interpolated — ένα αδιαφανές string, δεν κάνεις query πάνω του
_logger.LogInformation($"Deposit {amount} for {accountId}");

// ✓ structured — {Amount} και {AccountId} γίνονται NAMED PROPERTIES
_logger.LogInformation("Deposit {Amount} for {AccountId}", amount, accountId);
//   → στο Kibana: Amount > 1000 AND AccountId = "..."   ← queryable!

// Levels: Trace → Debug → Information → Warning → Error → Critical
_logger.LogWarning("Retry {Attempt} for {Pair}", attempt, pair);
_logger.LogError(ex, "Deposit failed for {AccountId}", accountId);  // exception ΠΡΩΤΟ`},
note:{type:"warn",html:`Ο κανόνας: <b>το όνομα της ιδιότητας, όχι το interpolated string.</b> Στο Novibet κάθε deposit log γραμμή κουβαλά <code>{Amount}</code>, <code>{AccountId}</code>, <code>{Currency}</code> και είναι queryable πάνω σε εκατομμύρια events.`}},

{t:"NLog — ο provider πίσω από την αφαίρεση",
html:`Ο κώδικάς σου βλέπει <b>μόνο</b> <code>ILogger&lt;T&gt;</code>. Το πού πάνε τα logs το αποφασίζει το config — αλλάζεις backend χωρίς να αγγίξεις μία γραμμή C#.`,
code:{lang:"xml",label:"nlog.config",src:`<targets>
  <!-- TARGET = πού πάνε τα logs -->
  <target xsi:type="ColoredConsole" name="console"
          layout="\${time} [\${level:uppercase=true}] \${message}" />

  <target xsi:type="File" name="file"
          fileName="logs/day3-\${shortdate}.log"
          layout="\${longdate}|\${level}|\${message}|\${all-event-properties}" />
</targets>

<rules>
  <!-- RULE = ποιο level πάει πού -->
  <logger name="*" minlevel="Trace" writeTo="console" />
  <logger name="*" minlevel="Info"  writeTo="file" />
</rules>`},
note:{type:"info",html:`<b>Target</b> = πού · <b>Layout</b> = μορφή κάθε γραμμής · <b>Rule</b> = ποιο level πού. Στο Novibet: JsonLayout με <code>includeAllProperties</code>, <code>maxInnerExceptionLevel=5</code>, και <code>correlationId</code> σε κάθε γραμμή — ένα request ανιχνεύσιμο σε πολλά microservices (και προωθείται ως <code>X-Correlation-ID</code> στα εξερχόμενα HTTP calls).`}},

{t:"Debugging: διάβασε πρώτα το inner exception", star:true,
html:`Όταν κάνεις wrap ένα exception, δημιουργείς αλυσίδα: το <b>outer</b> σου λέει ποια business λειτουργία απέτυχε, το <b>inner</b> σου λέει <b>γιατί</b>. Πάντα ξεκίνα από το inner.`,
code:{lang:"text",label:"stack — 4 frames βάθος",src:`ProcessDepositCommand
  └─ DepositService.PlaceDeposit
       └─ SettlementConversionService.ApplyPspSettlementConversion
            └─ CurrencyConverter.Convert
                 ← throws KeyNotFoundException (rate "BTC" not found)

// DepositFailedException: "Could not apply PSP settlement conversion."
//   InnerException → KeyNotFoundException: "BTC"    ← ΕΔΩ είναι η αιτία`},
code2:{lang:"csharp",label:"debugger toolkit",src:`// Conditional breakpoint  → σπάει σε ΤΙΜΗ:      fromCurrency == "BTC"
// Hit-count breakpoint     → σπάει στο Ν-οστό iteration:  = 3
// F11  Step Into           → μπες μέσα στη μέθοδο
// F10  Step Over           → εκτέλεσέ την χωρίς να μπεις
// Watch window             → παρακολούθησε deposit, account.Balance
// Immediate window         → δοκίμασε τη διόρθωση πριν τη γράψεις:
//                            account.Balance + amount
// Async stack traces: θα δεις compiler-generated MoveNext() frames
//   και markers "--- End of stack trace from previous location ---"`}},

{t:"Μία ροή, τέσσερις καταστάσεις",
html:`Ο ίδιος κώδικας (κατάθεση σε BTC χωρίς FX rate) — αλλάζει μόνο ο χειρισμός σφάλματος:`,
table:{head:["#","Κατάσταση κώδικα","Τι συμβαίνει"],rows:[
["1","Καθόλου try/catch","Unhandled crash — ωμό CLR trace, μηδέν business context"],
["2","<code>catch (Exception) { }</code>","Σιωπηλή κατάποση — <b>χειρότερο από crash</b>, κανείς δεν το ξέρει"],
["3","catch + wrap + rethrow","Business exception, το InnerException διατηρείται"],
["4","+ structured ILogger","Caught, wrapped ΚΑΙ logged — πλήρως παρατηρήσιμο ✓"]]}}
],
pitfalls:[
{t:"Άδειο catch (swallow)",
bad:`try { ProcessPayment(); }
catch (Exception) { }        // «να μη σκάσει η εφαρμογή»
// Η πληρωμή απέτυχε. Κανείς δεν το ξέρει. Ούτε εσύ.`,
good:`try { ProcessPayment(); }
catch (PaymentGatewayException ex)
{
    _logger.LogError(ex, "Payment failed for {OrderId}", orderId);
    throw new PaymentFailedException(orderId, ex);
}`,
why:`Το άδειο catch κρύβει το bug που θα σε ξυπνήσει στις 3 τα ξημερώματα. Αν πραγματικά θέλεις να αγνοήσεις κάτι, γράψε <b>γιατί</b> σε σχόλιο και κάνε τουλάχιστον <code>LogDebug</code>.`},
{t:"Catch general πριν από specific",
bad:`try { Deposit(); }
catch (Exception ex)                       { Handle(ex); }
catch (InsufficientBalanceException ex)    { ShowTopUp(ex); }
//     ↑ δεν φτάνει ΠΟΤΕ εδώ — compile error στη C#`,
good:`try { Deposit(); }
catch (InsufficientBalanceException ex) { ShowTopUp(ex); }   // specific
catch (DomainException ex)              { ShowMessage(ex); } // λιγότερο specific
catch (Exception ex)                    { LogAndRethrow(ex); } // general τελευταίο`,
why:`Ο CLR παίρνει το <b>πρώτο</b> catch που ταιριάζει. Specific → general, πάντα.`},
{t:"Interpolated string στο logger",
bad:`_logger.LogInformation($"User {userId} deposited {amount}");
// Στο Kibana: ένα string. Δεν φιλτράρεις, δεν κάνεις alert, δεν κάνεις aggregate.`,
good:`_logger.LogInformation("User {UserId} deposited {Amount}", userId, amount);
// Στο Kibana: UserId και Amount ως πεδία → query, dashboards, alerts.`,
why:`Επιπλέον: με το structured format το string δεν κατασκευάζεται καθόλου αν το level είναι απενεργοποιημένο — έχεις και performance όφελος.`}
],

catch (Exception ex)

{t:"Throw ή return;",
code:`// Ο χρήστης προσπαθεί να κάνει ανάληψη 3€

iv:[
["Πώς αποφασίζεις αν κάτι πρέπει να είναι exception;",
"Ρωτάω αν είναι κάτι που ο χρήστης μπορεί εύλογα να κάνει λάθος και να ξαναπροσπαθήσει. Αν ναι, είναι validation και επιστρέφω δομημένο αποτέλεσμα — δεν κοστίζει stack unwinding και δεν γεμίζει θόρυβο τα logs. Αν όμως παραβιάζεται μια αναλλοίωτη υπόθεση του συστήματος — ο λογαριασμός δεν υπάρχει, το FX rate λείπει — τότε είναι exception, γιατί κανένα σωστό μονοπάτι δεν έπρεπε να φτάσει εκεί. Δηλαδή: exceptions για το εξαιρετικό, όχι για το συνηθισμένο."],
["Τι κάνεις όταν πιάνεις ένα exception που δεν μπορείς να χειριστείς;",
"Το τυλίγω, δεν το καταπίνω. Πετάω ένα business-meaningful exception με το αρχικό ως InnerException, ώστε ο επάνω κόσμος να μάθει τι λειτουργία απέτυχε χωρίς να χάσω την τεχνική αιτία. Και το καταγράφω structured, με τα ids που θα χρειαστώ για να το βρω. Αυτό που δεν κάνω ποτέ είναι άδειο catch — προτιμώ να σκάσει ένα request παρά να αποτύχει σιωπηλά μια πληρωμή."],
["Ένα request αποτυγχάνει στο production. Πώς το ερευνάς;",
"Ξεκινάω από το correlation id: με αυτό τραβάω όλες τις γραμμές του συγκεκριμένου request από όλα τα services στο Kibana. Βλέπω το exception log και διαβάζω πρώτα το inner exception, γιατί εκεί είναι η αιτία — ο outer μου λέει μόνο ποια business λειτουργία έσπασε. Αν χρειαστεί, αναπαράγω τοπικά με conditional breakpoint στην τιμή που έσπασε και επιβεβαιώνω την υπόθεσή μου με το Immediate window πριν γράψω τη διόρθωση."]
]

{t:"DDD — Entity, Value Object, Aggregate",
html:`Το DDD είναι εργαλειοθήκη, όχι εντολή. Χρησιμοποιείς τα βαριά εργαλεία εκεί που κερδίζουν τη θέση τους.`,
table:{head:["Έννοια","Ταυτότητα","Mutable;","Ισότητα","Παράδειγμα"],rows:[
["<b>Entity</b>","Έχει <code>Id</code>","✅","Ίδιο <code>Id</code>","<code>Player</code>, <code>Wallet</code>"],
["<b>Value Object</b>","Καμία","❌ immutable","Ίδια <b>όλα</b> τα πεδία","<code>Money(Amount, Currency)</code>"],
["<b>Aggregate</b>","Ο root έχει Id","—","—","<code>Wallet</code> (root) φυλάει το Balance"],
["<b>Bounded Context</b>","—","—","—","«Wallet» context vs «Player profile» context"]]},
code:{lang:"csharp",label:"aggregate-root.cs",src:`// AGGREGATE ROOT — ο φύλακας των invariants.
// Όλες οι αλλαγές περνούν από αυτόν. Κανείς δεν αγγίζει το Balance απευθείας.
public class Wallet
{
    public int      PlayerId { get; }
    public Currency Currency { get; }
    public decimal  Balance  { get; private set; }   // ← private set!

    public void AddFunds(decimal amount)
    {
        if (amount <= 0) throw new ArgumentOutOfRangeException(nameof(amount));
        Balance += amount;
    }

    public void SubtractFunds(decimal amount)
    {
        // Ο ΦΥΛΑΚΑΣ ζει ΕΔΩ, όχι στο strategy, όχι στον controller
        if (Balance - amount < 0)
            throw new InsufficientFundsException(PlayerId, Balance, amount);
        Balance -= amount;
    }

    // Σκόπιμα χωρίς έλεγχο: chargebacks, admin corrections, ποινές
    public void ForceSubtractFunds(decimal amount) => Balance -= amount;
}

// VALUE OBJECT — χωρίς ταυτότητα, immutable, value equality δωρεάν
public record Money(decimal Amount, string Currency);`},
note:{type:"info",html:`Το κέρδος του DDD: όταν ο product owner λέει «wallet», «balance», «currency», ο κώδικας λέει το ίδιο. Η συζήτηση απεικονίζεται κατευθείαν σε κλάσεις — και ο κανόνας <b>δεν μπορεί να παρακαμφθεί</b>, γιατί το ίδιο το αντικείμενο τον επιβάλλει.`}},

{t:"Dependency Injection", star:true,
html:`Μία πρόταση: <b>η κλάση ζητάει ό,τι χρειάζεται στον constructor — δεν το φτιάχνει μόνη της.</b> Ένα κρυφό <code>new()</code> κολλάει την κλάση σε μία υλοποίηση και σε μια πραγματική βάση: δεν την τεστάρεις ποτέ.`,
code:{lang:"csharp",label:"✕ new() μέσα στην κλάση",bad:true,src:`public class WalletService
{
    // Κρυφή εξάρτηση, welded σε EF Core, ΑΔΥΝΑΤΟ να τεστάρω
    private readonly IWalletRepository _repo = new EfWalletRepository();

    public void Adjust(int id) { ... }
}`},
code2:{lang:"csharp",label:"✓ constructor injection",ok:true,src:`public class WalletService : IWalletService
{
    private readonly IWalletRepository _repo;

    public WalletService(IWalletRepository repo)   // ρητή, αντικαταστάσιμη
    {
        _repo = repo;
    }

    public void AdjustFunds(int playerId, Currency currency,
                            decimal amt, IFundsStrategy strategy)
    {
        var wallet = _repo.GetWallet(playerId, currency);
        strategy.Execute(wallet, amt);
    }
}
// Σε test: περνάς fake IWalletRepository — μηδέν βάση, μηδέν container`},
note:{type:"warn",html:`<b>Program to interfaces:</b> εξαρτήσου από <code>IWalletRepository</code>, όχι από <code>EfWalletRepository</code>. Αλλάζεις in-memory → SQL Server και οι callers δεν το καταλαβαίνουν καν.`}},

{t:"Composition Root & DI Container",
html:`Το <b>Composition Root</b> είναι το ΕΝΑ σημείο όπου συναρμολογείται όλο το object graph — το <code>Program.cs</code>. Είναι το μόνο μέρος όπου επιτρέπεται <code>new()</code>. Ο container απλώς <b>αυτοματοποιεί</b> αυτό το pattern — δεν το αντικαθιστά.`,
code:{lang:"csharp",label:"με το χέρι",src:`// Program.cs — Composition Root
// 1. Χτίσε τα φύλλα πρώτα (Infrastructure)
IWalletRepository repo = new InMemoryWalletRepository();

// 2. Διάλεξε strategy
IFundsStrategy strategy = new AddFundsStrategy();

// 3. Κάνε inject
IWalletService service = new WalletService(repo);

var menu = new ConsoleMenu(service, strategy);
menu.Run();
// Καμία άλλη κλάση δεν ξέρει concrete type.
// Αύριο: InMemory → EfWalletRepository, αλλάζει ΜΟΝΟ αυτό το αρχείο.`},
code2:{lang:"csharp",label:"με container",src:`var services = new ServiceCollection();

// Δήλωσε το mapping μία φορά
services.AddScoped<IWalletRepository, EfWalletRepository>();
services.AddScoped<IWalletService,    WalletService>();
services.AddSingleton<IFundsStrategy, AddFundsStrategy>();

var provider = services.BuildServiceProvider();

// Ζήτα το κορυφαίο — ο container χτίζει ΟΛΟ το graph αναδρομικά
var service = provider.GetRequiredService<IWalletService>();`}},

{t:"DI Lifetimes", star:true,
html:`Τρεις επιλογές. Το να τις μπερδέψεις είναι το <b>#1 DI bug</b> — και εμφανίζεται μόνο υπό φόρτο.`,
table:{head:["Lifetime","Πόσα instances","Χρήση","Παράδειγμα"],rows:[
["<b>Singleton</b>","Ένα για όλη την εφαρμογή","Stateless, thread-safe, ακριβό στην κατασκευή","Cache, <code>HttpClient</code>, Polly circuit breaker"],
["<b>Scoped</b>","Ένα ανά HTTP request","Δουλειά ανά request","<code>DbContext</code>, repositories"],
["<b>Transient</b>","Νέο σε κάθε injection","Ελαφριοί stateless helpers","Validators, mappers"]]},
code:{lang:"csharp",label:"lifetimes.cs",src:`services.AddSingleton<ICache, MemCache>();               // 1 για την app
services.AddScoped<IWalletRepo, EfWalletRepo>();         // 1 ανά request
services.AddTransient<IValidator, Validator>();          // νέο κάθε φορά

// Autofac (Day 07) — ίδια πράγματα, άλλα ονόματα:
//   SingleInstance()          = Singleton
//   InstancePerLifetimeScope()= Scoped
//   InstancePerDependency()   = Transient  (default)`},
note:{type:"bad",html:`<b>Ο χρυσός κανόνας:</b> ένα service δεν πρέπει ποτέ να κρατά dependency με <b>μικρότερη</b> διάρκεια ζωής από τη δική του.`}},

{t:"Strategy pattern",
html:`Μια οικογένεια αλγορίθμων πίσω από ένα interface. Νέα συμπεριφορά = <b>μία κλάση + μία γραμμή wiring</b>. Τίποτα άλλο δεν αλλάζει — αυτό είναι το <b>Open/Closed Principle</b>.`,
code:{lang:"csharp",label:"strategy.cs",src:`// Interface — ζει στο Application
public interface IFundsStrategy
{
    void Execute(Wallet wallet, decimal amount);
}

public class AddFundsStrategy : IFundsStrategy
{
    public void Execute(Wallet w, decimal a) => w.AddFunds(a);
}

public class SubtractFundsStrategy : IFundsStrategy
{
    public void Execute(Wallet w, decimal a) => w.SubtractFunds(a);  // περιέχει guard
}

public class ForceSubtractFundsStrategy : IFundsStrategy
{
    public void Execute(Wallet w, decimal a) => w.ForceSubtractFunds(a); // χωρίς έλεγχο
}

// ── Προσθέτω τέταρτη συμπεριφορά ──────────────────────────
public class BonusMultiplierStrategy : IFundsStrategy
{
    public void Execute(Wallet w, decimal a) => w.AddFunds(a * 2);
}
// + μία γραμμή στο Program.cs:
services.AddSingleton<IFundsStrategy, BonusMultiplierStrategy>();
// Το service και το menu ΔΕΝ ΑΛΛΑΞΑΝ καθόλου.`},
note:{type:"warn",html:`Δύο κανόνες: (1) το <b>guard</b> (π.χ. «όχι αρνητικό balance») ζει στο <b>domain method</b>, όχι στο strategy — το strategy μόνο επιλέγει ποια μέθοδο θα καλέσει. (2) Ποτέ δεν διαλέγεις strategy με <code>if/switch + new</code> — κάνεις <b>inject</b> τη σωστή.`}},

{t:"Interface Segregation — το «I» του SOLID",
html:`Καμία κλάση δεν πρέπει να εξαρτάται από μεθόδους που δεν καλεί ποτέ.`,
code:{lang:"csharp",label:"interface-segregation.cs",src:`// ✕ Fat interface — ο reader αναγκάζεται να "βλέπει" και Delete
public interface IPlayerRepository
{
    Player FindPlayer(int playerId);   // οι readers το θέλουν
    void   AddPlayer(Player player);   // οι writers το θέλουν
    void   DeletePlayer(int playerId); // ελάχιστοι το θέλουν
}

// ✓ Segregated — μικρά, εστιασμένα συμβόλαια
public interface IPlayerReader { Player FindPlayer(int playerId); }
public interface IPlayerWriter { void   AddPlayer(Player player); }

// Ένα read-only query εξαρτάται μόνο από IPlayerReader —
// δεν μπορεί καν να δει το DeletePlayer.`}}
],
pitfalls:[
{t:"Application → Infrastructure (το #1 λάθος)",
bad:`// στο Application layer
using WorldRank.Infrastructure;      // ✕ εξωτερική εξάρτηση!

public class WalletService
{
    private readonly EfWalletRepository _repo;   // ✕ concrete type
}`,
good:`// στο Application layer
public interface IWalletRepository { Wallet GetWallet(int id, Currency c); }

public class WalletService
{
    private readonly IWalletRepository _repo;    // ✓ abstraction
    public WalletService(IWalletRepository repo) => _repo = repo;
}
// Το EfWalletRepository ζει στο Infrastructure και υλοποιεί το interface.`,
why:`Ο κανόνας εξάρτησης παραβιάζεται: το εσωτερικό layer έμαθε για το εξωτερικό. Αποτέλεσμα: δεν τεστάρεις χωρίς βάση, δεν αλλάζεις provider, το EF Core εξαπλώνεται παντού.`},
{t:"Επιλογή strategy με if/switch",
bad:`IFundsStrategy s;
if (op == "add")           s = new AddFundsStrategy();
else if (op == "subtract") s = new SubtractFundsStrategy();
else                       s = new ForceSubtractFundsStrategy();
// Κάθε νέα strategy = άλλο ένα else if. Open/Closed παραβιάστηκε.`,
good:`// Ο container δίνει τη σωστή· ή, όταν χρειάζεται επιλογή κατά runtime,
// ένα registry από τον container — ποτέ new() στο service:
public WalletService(IEnumerable<IFundsStrategy> strategies) { ... }`,
why:`Με <code>new()</code> + switch, κάθε νέα συμπεριφορά αγγίζει υπάρχοντα κώδικα, άρα ρισκάρει regression. Με injection, προσθέτεις κλάση και γραμμή wiring — τίποτα άλλο δεν αλλάζει.`},
{t:"Service Locator",
bad:`public void Adjust(int id)
{
    var repo = ServiceLocator.Get<IWalletRepository>();   // κρυφή εξάρτηση
    ...
}`,
good:`public class WalletService
{
    private readonly IWalletRepository _repo;
    public WalletService(IWalletRepository repo) => _repo = repo;  // ρητή
}`,
why:`Ο Service Locator κρύβει τι χρειάζεται η κλάση: δεν το βλέπεις στον constructor, και όταν λείπει το registration σκάει στο <b>runtime</b> αντί στο compile time. Θεωρείται anti-pattern.`}
],

["Τι σου δίνει η Clean Architecture στην πράξη;",
"Τέσσερα πράγματα που τα νιώθεις μόλις αλλάξουν οι απαιτήσεις. Τεστάρω business rules χωρίς βάση ή HTTP, γιατί βρίσκονται πίσω από interfaces. Αλλάζω υλοποίηση — in-memory σήμερα, SQL Server αύριο — και οι κανόνες δεν το καταλαβαίνουν. Βρίσκω πράγματα γρήγορα, γιατί κάθε κανόνας ζει σε ακριβώς ένα σημείο. Και τα σύνορα περιορίζουν την ακτίνα καταστροφής: δεν σπάει σιωπηλά ένας business κανόνας επειδή πείραξα τον controller."],
["Εξήγησέ μου τα τρία DI lifetimes και μια παγίδα του καθενός.",
"Singleton είναι ένα instance για όλη την εφαρμογή — κατάλληλο για stateless, thread-safe και ακριβά αντικείμενα όπως cache ή circuit breaker· η παγίδα είναι το captive dependency, όταν κρατά κάτι scoped και το παγώνει. Scoped είναι ένα ανά HTTP request — εκεί ανήκει ο DbContext· η παγίδα είναι να τον κάνεις Singleton, γιατί ο change tracker δεν είναι thread-safe και διαρρέουν δεδομένα μεταξύ χρηστών. Transient είναι νέο σε κάθε injection, καλό για ελαφριούς helpers· η παγίδα είναι να βάλεις εκεί κάτι με κατάσταση, όπως έναν circuit breaker που τότε ξεχνά κάθε αποτυχία."],
["Πώς θα πρόσθετες μια νέα λειτουργία χωρίς να σπάσεις υπάρχοντα κώδικα;",
"Με το Strategy pattern και τον container. Γράφω μία νέα κλάση που υλοποιεί το υπάρχον interface, την καταχωρώ με μία γραμμή στο Composition Root, και τελείωσα — καμία υπάρχουσα κλάση δεν αγγίζεται, οπότε δεν υπάρχει ρίσκο regression. Αυτό είναι το Open/Closed: ανοιχτό στην επέκταση, κλειστό στην τροποποίηση. Το αντίθετο θα ήταν ένα switch που το πειράζω κάθε φορά, δηλαδή ένα σημείο που σπάει ξανά και ξανά."]
]
},
/* ============================ DAY 05 ============================ */
{
n:5, title:"SQL, Dapper & EF Core", tag:"JOIN · GROUP BY · Indexes · MERGE · DbContext",
sub:"Η βάση δεν είναι λεπτομέρεια — είναι εκεί που ζουν τα δεδομένα και εκεί που πεθαίνει η απόδοση.",
goal:"Να γράφεις σωστά JOIN/GROUP BY, να ξέρεις πότε Dapper και πότε EF Core, και γιατί ο DbContext είναι Scoped.",
concepts:[
{t:"Το σχήμα: keys & σχέσεις",
html:`<b>PRIMARY KEY</b> = μοναδική ταυτότητα γραμμής. <b>FOREIGN KEY</b> = αναφορά σε άλλον πίνακα. Μία Company → πολλά Cars (1:N).`,
code:{lang:"sql",label:"schema.sql",src:`CREATE TABLE Companies (
    Id   INT PRIMARY KEY,
    Name VARCHAR(100) NOT NULL
);

CREATE TABLE Cars (
    Id        INT PRIMARY KEY,
    Model     VARCHAR(100) NOT NULL,
    CompanyId INT NOT NULL REFERENCES Companies(Id)   -- FOREIGN KEY
);

-- Πάντα index στο FK: επιταχύνει join & lookup
CREATE INDEX IX_Cars_CompanyId ON Cars (CompanyId);`}},

{t:"Indexes — clustered vs non-clustered",
html:`Ένα index μετατρέπει το <b>table scan</b> (διάβασε τα πάντα) σε <b>index seek</b> (πήγαινε κατευθείαν).`,
table:{head:["","Clustered","Non-clustered"],rows:[
["Τι είναι","Η <b>φυσική σειρά</b> των γραμμών στον δίσκο — ο ίδιος ο πίνακας είναι το index","Ξεχωριστή δομή: η στήλη + pointer πίσω στη γραμμή"],
["Πόσα ανά πίνακα","<b>Ένα</b> — συνήθως το PK","Πολλά"],
["Ιδανικό για","Το primary key","Στήλες που φιλτράρεις ή κάνεις join (FKs)"]]},
note:{type:"warn",html:`<b>Το κόστος:</b> κάθε index επιβραδύνει τα INSERT/UPDATE/DELETE (πρέπει να ενημερωθεί). Κάνε index στα read-heavy μονοπάτια· έλεγξε τα write-heavy.`}},

{t:"INNER JOIN vs LEFT JOIN", star:true,
html:`Ο κανόνας σε μία γραμμή: <b>INNER = τομή</b> (μόνο τα matches) · <b>LEFT = όλα τα αριστερά</b> + matches όπου υπάρχουν (αλλιώς NULL).`,
code:{lang:"sql",label:"INNER JOIN",src:`SELECT co.Name, ca.Model
FROM   Companies co
JOIN   Cars ca ON ca.CompanyId = co.Id;

-- Μόνο εταιρείες που ΕΧΟΥΝ τουλάχιστον ένα αυτοκίνητο.
-- Εταιρεία με μηδέν αυτοκίνητα εξαφανίζεται από το αποτέλεσμα.`},
code2:{lang:"sql",label:"LEFT JOIN",src:`SELECT co.Name, ca.Model
FROM   Companies co
LEFT JOIN Cars ca ON ca.CompanyId = co.Id;

-- ΟΛΕΣ οι εταιρείες μένουν.
-- Όπου δεν υπάρχει αυτοκίνητο, το Model έρχεται NULL.`},
note:{type:"info",html:`Σκέψου τι θέλεις να δεις όταν <b>δεν υπάρχει match</b>. Θέλεις να χαθεί η γραμμή; INNER. Θέλεις να τη δεις με κενά; LEFT.`}},

{t:"GROUP BY & HAVING — WHERE πριν, HAVING μετά", star:true,
html:`Η κλασική παγίδα: <b>WHERE φιλτράρει γραμμές ΠΡΙΝ το grouping. HAVING φιλτράρει ομάδες ΜΕΤΑ την aggregation.</b>`,
code:{lang:"sql",label:"group-by.sql",src:`SELECT   CompanyId, COUNT(*) AS Cars
FROM     Cars
WHERE    Model <> 'Prototype'   -- 1) φιλτράρει ΓΡΑΜΜΕΣ πριν το grouping
GROUP BY CompanyId              -- 2) συμπτύσσει σε ομάδες
HAVING   COUNT(*) > 1;          -- 3) φιλτράρει ΟΜΑΔΕΣ μετά

-- Λογική σειρά εκτέλεσης:
-- FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY
-- Γι' αυτό δεν μπορείς να χρησιμοποιήσεις COUNT(*) μέσα σε WHERE.

-- Aggregates: COUNT, SUM, AVG, MIN, MAX`}},

{t:"Writes, MERGE & Transactions",
html:`<b>UPDATE/DELETE χωρίς WHERE αλλάζει ΟΛΕΣ τις γραμμές.</b> Ο κανόνας επιβίωσης: τρέξε πρώτα <code>SELECT</code> με το ίδιο WHERE.`,
code:{lang:"sql",label:"merge-upsert.sql",src:`-- MERGE = atomic upsert: update ή insert σε ΕΝΑ statement
DECLARE @source TABLE (Id INT, Model VARCHAR(100), CompanyId INT);
INSERT INTO @source VALUES (4, 'A-Class', 2), (21, 'Escort', 1);

MERGE INTO Cars AS target
USING @source AS source
    ON target.Id = source.Id
WHEN MATCHED THEN
    UPDATE SET target.Model = source.Model
WHEN NOT MATCHED BY TARGET THEN
    INSERT (Id, Model, CompanyId)
    VALUES (source.Id, source.Model, source.CompanyId);`},
code2:{lang:"sql",label:"transaction.sql",src:`BEGIN TRANSACTION;
BEGIN TRY
    UPDATE Cars SET Model = 'Ka' WHERE Id = 21;
    DELETE FROM Cars WHERE Id = 15;
    INSERT INTO Cars (Id, Model, CompanyId)
    VALUES (1, 'Duplicate', 1);      -- duplicate PK → σκάει

    COMMIT TRANSACTION;              -- όλα μαζί
END TRY
BEGIN CATCH
    ROLLBACK TRANSACTION;            -- ή τίποτα (atomicity)
END CATCH;`}},

{t:"ORM, Dapper & EF Core",
html:`ORM = γέφυρα ανάμεσα σε <b>γραμμές</b> και <b>αντικείμενα</b>: γραμμή → object, στήλη → property, FK → reference. Χωρίς ORM γράφεις raw ADO.NET και κάνεις mapping με το χέρι, στήλη-στήλη.`,
code:{lang:"csharp",label:"Dapper — micro-ORM (γράφεις εσύ το SQL)",src:`// READ — QueryAsync<T> κάνει map κάθε γραμμή σε T
public async Task<IEnumerable<Car>> GetByModel(string m)
{
    const string sql = "SELECT Id, Model, CompanyId FROM Cars WHERE Model = @Model;";
    return await _db.QueryAsync<Car>(sql, new { Model = m });
    //                                     ↑ ΠΑΝΤΑ parameterized — ποτέ concatenation
}

// WRITE — ExecuteAsync επιστρέφει πλήθος affected rows
public Task<int> UpdateModel(int id, string model) =>
    _db.ExecuteAsync("UPDATE Cars SET Model = @Model WHERE Id = @Id;",
                     new { Id = id, Model = model });

// JOIN — multi-mapping: ΕΝΑ round trip αντί για N+1 queries
var cars = await _db.QueryAsync<Car, Company, Car>(
    "SELECT c.Id, c.Model, c.CompanyId, co.Id, co.Name " +
    "FROM Cars c JOIN Companies co ON co.Id = c.CompanyId;",
    (car, company) => { car.Company = company; return car; },
    splitOn: "Id");   // ← πού αρχίζουν οι στήλες της Company`},
code2:{lang:"csharp",label:"EF Core — full ORM (γράφεις LINQ)",src:`// Γράφεις LINQ, το EF Core παράγει και τρέχει το SQL
var fords = await db.Cars
    .Where(c => c.Company.Name == "Ford")
    .ToListAsync();

// SELECT ... FROM Cars c
// JOIN Companies co ON co.Id = c.CompanyId
// WHERE co.Name = 'Ford'`},
note:{type:"info",html:`Δεν διαλέγεις «ένα από τα δύο» — <b>στην πράξη χρησιμοποιείς και τα δύο</b>: EF Core για το domain model και CRUD, Dapper για hot paths, σύνθετα queries και reports.`}},

{t:"DbContext & DbSet", star:true,
html:`Ο <code>DbContext</code> είναι το <b>session/unit of work</b> σου με τη βάση. Το <code>DbSet&lt;T&gt;</code> είναι ένας πίνακας που τον κάνεις query με LINQ.`,
code:{lang:"csharp",label:"DbContext.cs",src:`public class NoviAcademyContext : DbContext
{
    public NoviAcademyContext(DbContextOptions<NoviAcademyContext> options)
        : base(options) { }

    public DbSet<Car>     Cars      => Set<Car>();
    public DbSet<Company> Companies => Set<Company>();

    protected override void OnModelCreating(ModelBuilder b)
    {
        b.Entity<Car>(e =>
        {
            e.ToTable("Cars");
            e.HasKey(c => c.Id);                              // PK
            e.Property(c => c.Model)
                .HasColumnType("varchar(100)").IsRequired();  // στήλη
            e.HasOne(c => c.Company)                          // FK
                .WithMany(co => co.Cars)
                .HasForeignKey(c => c.CompanyId);
            e.HasIndex(c => c.CompanyId, "IX_Cars_CompanyId"); // index
        });
    }
}

// ── Registration (Composition Root) ─────────────────────
builder.Services.AddDbContext<NoviAcademyContext>(o => o.UseSqlServer(cs));
// AddDbContext = SCOPED by default. ΠΟΤΕ Singleton:
// ο change tracker δεν είναι thread-safe.
builder.Services.AddScoped<ICarRepository, CarRepository>();`}},

{t:"Reads: AsNoTracking, Include, IQueryable",
html:`Το <code>IQueryable</code> είναι <b>expression tree</b> — deferred, όπως το LINQ του Day 02. Το SQL δεν φεύγει μέχρι να κάνεις <code>ToListAsync()</code>/<code>ToArrayAsync()</code>.`,
code:{lang:"csharp",label:"reads.cs",src:`// AsNoTracking σε read-only queries → δεν μπαίνει στον change tracker, πιο γρήγορο
public Task<Car[]> GetAll() =>
    _db.Cars.AsNoTracking().ToArrayAsync();

// Include → eager loading των συσχετισμένων δεδομένων
public Task<Car[]> GetAllWithCompany(string? companyName = null)
{
    var query = _db.Cars
        .AsNoTracking()
        .Include(c => c.Company)
        .AsQueryable();                 // ακόμα ΤΙΠΟΤΑ δεν έτρεξε

    if (companyName is not null)        // χτίζω το query σταδιακά
        query = query.Where(c => c.Company.Name == companyName);

    return query.ToArrayAsync();        // ← ΕΔΩ φεύγει ΕΝΑ SQL query
}`},
note:{type:"bad",html:`Παγίδα: <code>_db.Cars.ToList().Where(c =&gt; ...)</code> φέρνει <b>όλο τον πίνακα</b> στη μνήμη και φιλτράρει σε C#. Κράτα το φίλτρο <b>πριν</b> την υλοποίηση, για να μεταφραστεί σε SQL <code>WHERE</code>.`}},

{t:"Writes: change tracker & SaveChanges",
html:`Ο change tracker παρακολουθεί την κατάσταση κάθε entity (<code>Added / Modified / Deleted / Unchanged</code>). Το <code>SaveChanges</code> κάνει diff και παράγει το SQL. <b>Ένα SaveChanges = ένα transaction.</b>`,
code:{lang:"csharp",label:"writes.cs",src:`// Add → INSERT
_db.Cars.Add(car);                       // state: Added
await _db.SaveChangesAsync();

// Load → mutate → save  → UPDATE
var car = await _db.Cars.FindAsync(id);
car!.Model = model;                      // state: Modified (αυτόματα!)
await _db.SaveChangesAsync();

// UPDATE χωρίς SELECT — attach stub + μάρκαρε την ιδιότητα (ένα round trip)
var stub = new Car { Id = id, Model = model };
_db.Cars.Attach(stub);
_db.Entry(stub).Property(c => c.Model).IsModified = true;
await _db.SaveChangesAsync();

// Πολλές αλλαγές, ΕΝΑ SaveChanges = ένα transaction (όλα ή τίποτα)
c.Model = "Focus";
c.CompanyId = 6;
await _db.SaveChangesAsync();`}},

{t:"Migrations & scaffolding",
html:`Το migration είναι <b>versioned diff</b> του μοντέλου σου. Code-first: εσύ γράφεις τις κλάσεις, τα migrations φτιάχνουν τη βάση. DB-first (scaffolding): η βάση υπάρχει, παράγεις τις κλάσεις.`,
code:{lang:"bash",label:"Package Manager Console",src:`# 1) Φτιάξε migration από τις αλλαγές του μοντέλου
Add-Migration InitialCreate -Context WorldRankDbContext \
  -OutputDir "Persistence/Migrations" -Project "WorldRank.Infrastructure"

# 2) Εφάρμοσέ τα στη βάση
Update-Database -Project "WorldRank.Infrastructure"

# 3) Παρήγαγε SQL script για review από DBA (ρυθμιζόμενα περιβάλλοντα!)
Script-Migration -From <Old> -To <New> -Context WorldRankDbContext

# DB-first: παρήγαγε entities + context από υπάρχουσα βάση
Scaffold-DbContext "Server=localhost;Database=WorldRank;..." \
  Microsoft.EntityFrameworkCore.SqlServer -Tables Players,Wallets`},
