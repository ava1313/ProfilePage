pitfalls:[
{t:"String concatenation στο SQL (SQL injection)",
bad:`var sql = "SELECT * FROM Cars WHERE Model = '" + model + "'";
// model = "'; DROP TABLE Cars; --"   →  αντίο πίνακας`,
good:`var sql = "SELECT * FROM Cars WHERE Model = @Model";
await _db.QueryAsync<Car>(sql, new { Model = model });`,
why:`Το parameterized query στέλνει το SQL και τα δεδομένα <b>ξεχωριστά</b> — η βάση δεν εκτελεί ποτέ το input ως κώδικα. Ισχύει και στο Dapper και στο ADO.NET· το EF Core το κάνει αυτόματα.`},
{t:"Φιλτράρισμα στη μνήμη αντί στη βάση",
bad:`var cars = _db.Cars.ToList()            // ← φέρνει ΟΛΟ τον πίνακα
                   .Where(c => c.CompanyId == 5)
                   .ToList();`,
good:`var cars = await _db.Cars
    .Where(c => c.CompanyId == 5)       // μεταφράζεται σε SQL WHERE
    .AsNoTracking()
    .ToListAsync();`,
why:`Μόλις καλέσεις <code>ToList()</code>, το <code>IQueryable</code> γίνεται <code>IEnumerable</code> και ό,τι ακολουθεί τρέχει σε C#. Με 10 γραμμές δεν το προσέχεις· με 10 εκατομμύρια, πέφτει η εφαρμογή.`},
{t:"DbContext ως Singleton",
bad:`services.AddSingleton<AppDbContext>();
// Ένα context, πολλά threads. Ο change tracker δεν είναι thread-safe.`,
good:`services.AddDbContext<AppDbContext>(o => o.UseSqlServer(cs));
// = Scoped: ένα ανά HTTP request, disposed στο τέλος του request.`,
why:`Δύο ταυτόχρονα requests μοιράζονται τον ίδιο change tracker — το request A μπορεί να διαβάσει ή να αποθηκεύσει δεδομένα του request B. Κλασική πηγή «ανεξήγητων» bugs σε production.`}
],

["Τι είναι το MERGE;","Atomic upsert σε ένα statement: MATCHED → UPDATE, NOT MATCHED → INSERT."]
],
iv:[
["Πώς θα βελτίωνες ένα αργό query;",
"Πρώτα κοιτάω το execution plan για να δω αν γίνεται table scan εκεί που θα έπρεπε να γίνεται index seek — συνήθως λείπει index στη στήλη που φιλτράρω ή κάνω join, τυπικά ένα foreign key. Μετά ελέγχω αν φέρνω περισσότερα δεδομένα από όσα χρειάζομαι: <code>SELECT *</code> ή, στο EF Core, υλοποίηση πριν το φίλτρο, που φέρνει όλο τον πίνακα στη μνήμη. Και ψάχνω για N+1, δηλαδή ένα query στη λίστα και άλλο ένα ανά στοιχείο, που το λύνω με <code>Include</code> ή ένα JOIN με Dapper. Πάντα έχω υπόψη ότι κάθε index που προσθέτω επιβαρύνει τα writes."],
["Γιατί να μη γράψω ποτέ SQL με string concatenation;",
"Γιατί δίνω στον χρήστη τη δυνατότητα να εκτελέσει δικό του SQL — SQL injection. Με parameterized query, το SQL και τα δεδομένα ταξιδεύουν ξεχωριστά και η βάση δεν μεταχειρίζεται ποτέ το input ως κώδικα. Επιπλέον, τα παραμετροποιημένα queries κάνουν καλύτερο plan caching στον SQL Server, οπότε είναι και ταχύτερα."],
["Τι είναι ο change tracker και πώς επηρεάζει τον σχεδιασμό;",
"Είναι το κομμάτι του DbContext που κρατά snapshot κάθε entity που φόρτωσες, ώστε στο SaveChanges να ξέρει τι άλλαξε και να παράγει το κατάλληλο INSERT/UPDATE/DELETE. Δύο συνέπειες: πρώτον, ο DbContext έχει κατάσταση και δεν είναι thread-safe, γι' αυτό είναι πάντα Scoped. Δεύτερον, σε read-only queries ο tracker είναι καθαρή σπατάλη, οπότε βάζω <code>AsNoTracking</code>."]
]
},

[Route("api/players")]
public class PlayersController : ControllerBase

    [HttpGet("{id:int}")]
    public async Task<IActionResult> GetById([FromRoute] int id, CancellationToken ct)

    }

{t:"Async/await — η αναλογία του σερβιτόρου", star:true,
html:`<b>Σύγχρονο:</b> ο σερβιτόρος πάει την παραγγελία στην κουζίνα και <i>στέκεται εκεί</i> μέχρι να ψηθεί. Τα άλλα τραπέζια περιμένουν.<br>

Σε όρους server: το thread <b>επιστρέφει στο pool</b> και εξυπηρετεί άλλα requests όσο περιμένουμε I/O.`,

{t:"Caching — γιατί & το cache-aside pattern", star:true,
html:`Τέσσερις λόγοι: <b>latency</b> (μικροδευτερόλεπτα από RAM αντί χιλιοστά από βάση), <b>λιγότερο DB load</b> (μία εγγραφή cache απορροφά χιλιάδες ίδια reads), <b>traffic spikes</b>, και <b>κόστος</b>.`,
code:{lang:"csharp",label:"cache-aside.cs",src:`builder.Services.AddMemoryCache();

public class RankingsService(AppDbContext db, IMemoryCache cache, ILogger<RankingsService> logger)
{
    private const string CacheKey = "rankings";

    public async Task<IEnumerable<RankingDto>> GetRankings(string? tier)
    {
        // CACHE-ASIDE: 1) κοίτα το cache
        if (!cache.TryGetValue(CacheKey, out IEnumerable<RankingDto>? rankings))
        {
            logger.LogDebug("Cache MISS — fetching from DB");

            // 2) miss → φέρε από τη βάση
            rankings = await db.Rankings.Where(x => x.Tier == tier).ToListAsync();

            // 3) βάλ' το στο cache ΜΕ TTL
            cache.Set(CacheKey, rankings, new MemoryCacheEntryOptions
            {
                AbsoluteExpirationRelativeToNow = TimeSpan.FromSeconds(30)
            });
        }
        else logger.LogDebug("Cache HIT");

        return rankings;   // 4) return
    }
}`},
note:{type:"warn",html:`Το cache-aside είναι <b>το πιο κοινό pattern για Web APIs</b>. Εναλλακτικές: <b>write-through</b> (γράφεις σε cache και DB ταυτόχρονα — μέγιστη συνέπεια, μεγαλύτερο write latency).`}},

{t:"Invalidation on write",
html:`Το δύσκολο κομμάτι του caching δεν είναι να βάλεις δεδομένα — είναι να τα <b>βγάλεις</b> όταν αλλάξουν.`,
code:{lang:"csharp",label:"invalidation.cs",src:`public async Task<IEnumerable<Player>> AdjustPoints(int id, int amount)
{
    var player = await _db.Players.FindAsync(id);
    player.Points += amount;
    await _db.SaveChangesAsync();

    _cache.Remove("rankings");   // ← ΑΜΕΣΩΣ μετά το write
    // Χωρίς αυτό: stale leaderboard μέχρι να λήξει το TTL

    return await _db.Players.OrderByDescending(p => p.Points).ToListAsync();
}

// Ο κανόνας:
//   Read  method → γέμισε το cache σε miss
//   Write method → σβήσε το κλειδί μετά την επιτυχία`},

    opt.Configuration = "localhost:6379");

public class RankingsService(IDistributedCache cache, IMediator mediator)
{
    public async Task<List<RankingDto>> GetRankings()
    {
        var bytes = await cache.GetAsync("rankings");
        if (bytes is not null)
            return JsonSerializer.Deserialize<List<RankingDto>>(bytes)!;

        var rankings = await mediator.Send(new GetRankingsQuery());
        var json = JsonSerializer.SerializeToUtf8Bytes(rankings);
        await cache.SetAsync("rankings", json, /* options με TTL */);
        return rankings;
    }
}`}},

pitfalls:[
{t:"Cache χωρίς TTL",
bad:`cache.Set(key, data);          // ζει για πάντα
// Η μνήμη μεγαλώνει μέχρι OutOfMemoryException.`,
good:`cache.Set(key, data, new MemoryCacheEntryOptions
{
    AbsoluteExpirationRelativeToNow = TimeSpan.FromSeconds(30)
});`,
why:`Ένα cache χωρίς όριο είναι memory leak με καλή δικαιολογία. Το TTL είναι επίσης το <b>δίχτυ ασφαλείας</b> σου όταν ξεχάσεις κάποιο invalidation.`},
{t:"<code>.Result</code> αντί για <code>await</code>",
bad:`public IActionResult Get(int id)
{
    var player = _service.GetPlayerAsync(id).Result;   // ✕ deadlock risk
    return Ok(player);
}`,
good:`public async Task<IActionResult> Get(int id, CancellationToken ct)
{
    var player = await _service.GetPlayerAsync(id, ct);
    return Ok(player);
}`,
why:`Το <code>.Result</code> μπλοκάρει το thread περιμένοντας μια συνέχεια που μπορεί να χρειάζεται το ίδιο ακριβώς thread — κλασικό deadlock. Και ακόμα κι όταν δεν κολλήσει, καίει ένα thread χωρίς λόγο.`},
{t:"<code>IMemoryCache</code> πίσω από load balancer",
bad:`// 3 instances πίσω από LB, το καθένα με δικό του IMemoryCache.
// Ο χρήστης κάνει refresh 3 φορές και βλέπει 3 διαφορετικά leaderboards.`,
good:`// Πάνω από ένα instance → IDistributedCache (Redis): ένα κοινό cache.
builder.Services.AddStackExchangeRedisCache(o => o.Configuration = redisCs);`,

["Γιατί async σε ένα web API;",
"Επειδή το ακριβό είναι τα threads, όχι ο χρόνος αναμονής. Όταν ένα request περιμένει τη βάση, ένα σύγχρονο μοντέλο κρατά ένα thread δεσμευμένο χωρίς να κάνει τίποτα. Με async το thread επιστρέφει στο pool και εξυπηρετεί άλλα requests, άρα ο ίδιος server αντέχει πολύ μεγαλύτερο throughput. Προσοχή όμως: async δεν σημαίνει παράλληλο, και πρέπει να είναι async όλη η αλυσίδα — ένα <code>.Result</code> στη μέση ακυρώνει το όφελος και ρισκάρει deadlock."],

{t:"Query & Command handlers",
html:`Κάθε request πάει σε <b>ακριβώς έναν</b> handler. Σύμβαση αρχείων: <code>XCommand.cs</code>, <code>XCommand.Handler.cs</code>, <code>XCommand.Validator.cs</code> — ίδιο πρόθεμα, το IDE τα ομαδοποιεί.`,
code:{lang:"csharp",label:"GetCompanyByIdQuery.Handler.cs",src:`public class GetCompanyByIdQueryHandler
    : IRequestHandler<GetCompanyByIdQuery, Company?>
{
    private readonly ICompanyRepository _companies;
    public GetCompanyByIdQueryHandler(ICompanyRepository c) => _companies = c;

    public Task<Company?> Handle(GetCompanyByIdQuery request, CancellationToken ct)
        => _companies.GetById(request.Id);
}`},
code2:{lang:"csharp",label:"CreateCarCommand.Handler.cs",src:`public async Task<int> Handle(CreateCarCommand request, CancellationToken ct)
{
    // Cross-entity check: ζει ΕΔΩ, στον handler — όχι στον validator
    _ = await _companies.GetById(request.CompanyId)
        ?? throw new InvalidOperationException("Company does not exist.");

    var car = await _cars.Add(new Car { Model = request.Model,
                                        CompanyId = request.CompanyId });
    return car.Id;      // ← μόνο το Id
}`},
note:{type:"warn",html:`Γιατί ο validator δεν κάνει repository lookups: ο validator ελέγχει <b>σχήμα</b> (μη κενό, μήκος, > 0) και είναι καθαρός/γρήγορος. Ο έλεγχος «υπάρχει αυτή η εταιρεία;» είναι <b>business rule</b> και χρειάζεται I/O → ανήκει στον handler.`}},

{t:"MediatR & pipeline behaviors", star:true,
html:`Το MediatR βρίσκει τους handlers σαρώνοντας το assembly. Ο controller κάνει inject <b>μόνο <code>IMediator</code></b> — ποτέ repositories. Και τα <b>pipeline behaviors</b> τυλίγουν <u>κάθε</u> request χωρίς να αγγίξεις κανέναν handler.`,
code:{lang:"csharp",label:"LoggingBehavior.cs",src:`public class LoggingBehavior<TRequest, TResponse>
    : IPipelineBehavior<TRequest, TResponse> where TRequest : notnull
{
    private readonly ILogger<LoggingBehavior<TRequest, TResponse>> _logger;

    public async Task<TResponse> Handle(TRequest request,
        RequestHandlerDelegate<TResponse> next, CancellationToken ct)
    {
        _logger.LogInformation("Handling {Type}", typeof(TRequest).Name);
        var response = await next();          // ← ο επόμενος στην αλυσίδα
        return response;
    }
}`},
code2:{lang:"csharp",label:"DependencyInjection.cs",src:`services.AddValidatorsFromAssembly(Assembly.GetExecutingAssembly());

services.AddMediatR(cfg =>
{
    cfg.RegisterServicesFromAssembly(Assembly.GetExecutingAssembly());
    cfg.AddOpenBehavior(typeof(LoggingBehavior<,>));      // κάθε request
    cfg.AddOpenBehavior(typeof(ValidationBehavior<,>));   // κάθε request
});

// Το ValidationBehavior βρίσκει κάθε IValidator<TRequest> και πετάει
// ΠΡΙΝ τρέξει ο handler — κακό input δεν φτάνει ποτέ στο business logic.

public class CreateCarCommandValidator : AbstractValidator<CreateCarCommand>
{
    public CreateCarCommandValidator()
    {
        RuleFor(x => x.Model).NotEmpty().MaximumLength(100);
        RuleFor(x => x.CompanyId).GreaterThan(0);
    }
}`}},

{t:"Notifications — ένα event, πολλοί handlers",
html:`Το <code>IRequest</code> έχει έναν handler. Το <code>INotification</code> έχει <b>όσους θέλεις</b>, και κανένας δεν ξέρει για τους άλλους.`,
code:{lang:"csharp",label:"notifications.cs",src:`public record CarTransferredEvent(int CarId, int FromCompanyId, int ToCompanyId)
    : INotification;

public class CarTransferredEventAuditLogHandler
    : INotificationHandler<CarTransferredEvent>
{
    public Task Handle(CarTransferredEvent e, CancellationToken ct)
    {
        _logger.LogInformation("[audit] Car #{Id} -> #{To}", e.CarId, e.ToCompanyId);
        return Task.CompletedTask;
    }
}

// Ένα δεύτερο (και τρίτο, και τέταρτο) handler — μηδέν αλλαγές αλλού
public class CarTransferredEventRecipientNotificationHandler
    : INotificationHandler<CarTransferredEvent> { /* στέλνει email */ }

// Publish:
await _mediator.Publish(new CarTransferredEvent(carId, fromId, toId), ct);`},
code2:{lang:"csharp",label:"TransferCarCommand.Handler.cs — τα πάντα μαζί",src:`public async Task Handle(TransferCarCommand request, CancellationToken ct)
{
    var car = await _cars.GetById(request.CarId)
        ?? throw new NotFoundException("Car not found.");

    _ = await _companies.GetById(request.ToCompanyId)
        ?? throw new InvalidOperationException("Target company does not exist.");

    var fromId = car.CompanyId;
    await _cars.UpdateCompany(request.CarId, request.ToCompanyId);

    await _mediator.Publish(new CarTransferredEvent(
        request.CarId, fromId, request.ToCompanyId), ct);
}
// Validate → κάνε τη δουλειά → ανακοίνωσε. Μία ευθύνη το καθένα.`}},

{t:"Ένα κεντρικό exception handler",
html:`Αντί για <code>try/catch</code> σε κάθε action, ένας χάρτης exception → status code, μία φορά στο <code>Program.cs</code>.`,
code:{lang:"csharp",label:"Program.cs",src:`app.UseExceptionHandler(errorApp => errorApp.Run(async ctx =>
{
    var ex = ctx.Features.Get<IExceptionHandlerFeature>()?.Error;

    var (code, msg) = ex switch
    {
        ValidationException e        => (400, e.Message),
        NotFoundException e          => (404, e.Message),
        InvalidOperationException e  => (400, e.Message),
        _                            => (500, "Unexpected error.")   // μη διαρρέεις!
    };

    ctx.Response.StatusCode = code;
    await ctx.Response.WriteAsJsonAsync(new { error = msg });
}));
// Κάθε failure response έχει το ίδιο σχήμα. Οι controllers έμειναν 1 γραμμή/action.`}},

builder.Host.UseServiceProviderFactory(new AutofacServiceProviderFactory());

builder.Host.ConfigureContainer<ContainerBuilder>(cb =>
{
    cb.RegisterModule<ApplicationModule>();
    cb.RegisterModule<InfrastructureModule>();
});

// Κάθε project έχει το δικό του Module — ξέρει μόνο τους δικούς του τύπους
public class ApplicationModule : Module
{
    protected override void Load(ContainerBuilder builder)
    {
        var configuration = MediatRConfigurationBuilder
            .Create(ThisAssembly)
            .WithAllOpenGenericHandlerTypesRegistered()
            .Build();

        builder.RegisterMediatR(configuration);
        builder.RegisterGenericDecorator(typeof(LoggingRequestHandler<,>),
                                         typeof(IRequestHandler<,>));
    }
}`}},

{t:"Decorator pattern — οι 3 κανόνες", star:true,
html:`<b>1.</b> Ίδιο interface με αυτό που τυλίγει. <b>2.</b> Κρατά reference στο inner. <b>3.</b> Κάνει delegate στο inner — πριν ή/και μετά προσθέτει συμπεριφορά.`,
code:{lang:"csharp",label:"LoggingRequestHandler.cs — ο πραγματικός κώδικας",src:`public class LoggingRequestHandler<TRequest, TResponse>
    : IRequestHandler<TRequest, TResponse>          // 1. ίδιο interface
    where TRequest : IRequest<TResponse>
{
    private readonly IRequestHandler<TRequest, TResponse> _inner;   // 2. inner
    private readonly ILogger<LoggingRequestHandler<TRequest, TResponse>> _logger;

    public Task<TResponse> Handle(TRequest request, CancellationToken ct)
    {
        _logger.LogInformation("{Name}", typeof(TRequest).Name);
        return _inner.Handle(request, ct);          // 3. delegate
    }
}

// Αλυσίδα:  Client → LoggingRequestHandler → ο πραγματικός handler
//
// Το ίδιο σχήμα, άλλο layer — caching στο persistence:
//   Handler → CachingDecorator<Car> → CarAggregatePersistence → EF Core → SQL`},
note:{type:"info",html:`Ο caller δεν βλέπει καμία διαφορά — εξακολουθεί να βλέπει <code>IRequestHandler&lt;,&gt;</code>. Αυτό είναι <b>Open/Closed</b>: προσθέτεις concern χωρίς να ανοίξεις τον handler. Τα pipeline behaviors του MediatR είναι η ενσωματωμένη εκδοχή του ίδιου pattern.`}},

{t:"KISS & YAGNI",
html:`<b>KISS</b> — λύσε το πρόβλημα που έχεις μπροστά σου, όχι το υποθετικό. <b>YAGNI</b> — μη γράφεις ό,τι δεν χρειάζεσαι ακόμα. Γενικεύεις στο <b>δεύτερο πραγματικό</b> use case, όχι στο πρώτο φανταστικό.`,
code:{lang:"csharp",label:"✕ YAGNI violation",bad:true,src:`// Ένα fat generic repo που δεν ζήτησε κανείς
public interface IRepository<T> where T : class
{
    Task<T?> GetByIdAsync(int id, CancellationToken ct);
    Task<IEnumerable<T>> GetAllAsync(CancellationToken ct);  // κανένας caller
    Task AddAsync(T entity, CancellationToken ct);
    Task UpdateAsync(T entity, CancellationToken ct);
    Task DeleteAsync(int id, CancellationToken ct);          // κανένας caller
}`},
code2:{lang:"csharp",label:"✓ YAGNI applied",ok:true,src:`// Χώρισέ το μόνο εκεί που reads και writes αποκλίνουν πραγματικά
public interface IAggregatePersistence<T>
{ Task<T> GetByIdAsync(int id, CancellationToken ct); }

public interface IModificationPersistence<T>
{ Task Persist(T mod, CancellationToken ct); }

// Το IQueryPersistence<TRequest,TResult> προστέθηκε ΜΟΝΟ όταν
// ένα read model χρειάστηκε πραγματικά δικό του σχήμα.`},

{
    private readonly IRequestHandler<T, Result> _inner;

    public async Task<Result> Handle(T req, CancellationToken ct)
    {
        if (_cache.TryGetValue(key, out Result r)) return r;
        r = await _inner.Handle(req, ct);
        _cache.Set(key, r);
        return r;
    }
}`,

["Τι σου δίνει το CQRS σε ένα πραγματικό project;",
"Κάθε πρόθεση αποκτά τον δικό της τύπο, οπότε ανοίγοντας τον φάκελο βλέπω ακριβώς τι κάνει το σύστημα: <code>CreateCarCommand</code>, <code>GetCarByIdQuery</code>. Ο handler έχει μία δουλειά και τεστάρεται μόνος του με ένα mocked repository. Τα cross-cutting concerns — logging, validation — μπαίνουν μία φορά ως pipeline behavior αντί να επαναλαμβάνονται. Και ο controller μένει μία γραμμή ανά action, οπότε δεν υπάρχει σημείο όπου σιγά σιγά μαζεύεται business logic."],
["Εξήγησέ μου το decorator pattern και πού το έχεις δει.",
"Ο decorator υλοποιεί το ίδιο interface με αυτό που τυλίγει, κρατά reference στο εσωτερικό αντικείμενο, και κάνει delegate σε αυτό προσθέτοντας συμπεριφορά πριν ή μετά. Ο caller δεν καταλαβαίνει τίποτα, γιατί ο τύπος δεν άλλαξε. Το έχω δει σε δύο επίπεδα: ένα <code>LoggingRequestHandler</code> που τυλίγει κάθε MediatR handler, και ένα caching decorator στο persistence που ελέγχει το cache πριν πάει στο EF Core. Ίδιο σχήμα, διαφορετικό layer — και τα δύο καταχωρούνται με μία γραμμή <code>RegisterGenericDecorator</code>, οπότε ισχύουν και για handlers που δεν έχουν γραφτεί ακόμα."],

/* ============================ DAY 08 ============================ */
{
n:8, title:"HTTP Clients, Polly & Quartz", tag:"IHttpClientFactory · Retry · Circuit breaker · ACL · CRON",
sub:"Ό,τι είναι έξω από την εφαρμογή σου θα πέσει κάποια στιγμή. Η δουλειά σου είναι να μην πέσεις μαζί του.",
goal:"Να καλείς εξωτερικά APIs χωρίς socket exhaustion, με retry/circuit breaker, και να προγραμματίζεις περιοδικές εργασίες.",
concepts:[
{t:"Socket exhaustion — γιατί το <code>new HttpClient()</code> είναι επικίνδυνο", star:true,
html:`Το <code>HttpClient</code> είναι <code>IDisposable</code>, οπότε όλοι νομίζουν ότι πρέπει να το κάνουν <code>using</code>. <b>Λάθος.</b> Κάθε νέο instance ανοίγει socket· όταν κλείσει, το λειτουργικό το κρατά σε <code>TIME_WAIT</code> για ~4 λεπτά. Υπό φόρτο εξαντλείς τα ~64k ports → <code>SocketException: address already in use</code>.`,
code:{lang:"csharp",label:"✕ anti-pattern",bad:true,src:`// Καλείται 1.000 φορές το δευτερόλεπτο υπό φόρτο
public async Task<Rate> GetRateAsync(string pair)
{
    using var client = new HttpClient();      // ← νέο socket κάθε φορά
    var response = await client.GetAsync($"https://api.example.com/rates/{pair}");
    return await response.Content.ReadFromJsonAsync<Rate>();
    // Το socket «απελευθερώνεται», αλλά μένει σε TIME_WAIT ~4 λεπτά.
    // Μετά από ~64k → SocketException
}`},
code2:{lang:"csharp",label:"✓ IHttpClientFactory",ok:true,src:`// Registration (μία φορά, στο startup) — typed client
services.AddHttpClient<IRatesGateway, RatesGateway>(client =>
    client.BaseAddress = new Uri("https://api.example.com"));

// Χρήση — το HttpClient έρχεται από το factory μέσω constructor injection
public class RatesGateway : IRatesGateway
{
    private readonly HttpClient _client;
    public RatesGateway(HttpClient client) => _client = client;

    public async Task<Rate> GetRateAsync(string pair)
        => await _client.GetFromJsonAsync<Rate>($"/rates/{pair}");
}`},
note:{type:"info",html:`Πώς βοηθά το factory: κάνει <b>pool και reuse τα <code>HttpMessageHandler</code></b>. Ο κώδικάς σου παίρνει φρέσκο «κέλυφος» <code>HttpClient</code> κάθε φορά, αλλά το ακριβό κομμάτι — το socket — επαναχρησιμοποιείται.`}},

{t:"Polly — resilience policies", star:true,
html:`Τρία εργαλεία, που συνδυάζονται: <b>Retry</b> (ξαναπροσπάθησε με αυξανόμενη καθυστέρηση), <b>Circuit breaker</b> (σταμάτα να χτυπάς κάτι που είναι νεκρό), <b>Timeout</b> (μην περιμένεις για πάντα).`,
code:{lang:"csharp",label:"polly.cs",src:`// Retry με exponential back-off: 3 προσπάθειες σε 2s, 4s, 8s
var retry = Policy
    .Handle<HttpRequestException>()
    .OrResult<HttpResponseMessage>(r => !r.IsSuccessStatusCode)
    .WaitAndRetryAsync(3, attempt => TimeSpan.FromSeconds(Math.Pow(2, attempt)));

// Circuit breaker: ανοίγει μετά από 5 αποτυχίες, ξαναδοκιμάζει σε 30s
var circuitBreaker = Policy
    .Handle<HttpRequestException>()
    .CircuitBreakerAsync(5, TimeSpan.FromSeconds(30));

// Timeout: απέτυχε μετά από 10 δευτερόλεπτα ό,τι κι αν γίνει
var timeout = Policy.TimeoutAsync(TimeSpan.FromSeconds(10));

// Συνδυασμός: εξωτερικό πρώτο, εσωτερικό πιο κοντά στην εκτέλεση
var combined = Policy.WrapAsync(retry, circuitBreaker, timeout);

services.AddHttpClient<IRatesGateway, RatesGateway>()
        .AddPolicyHandler(combined);`},
note:{type:"bad",html:`<b>Ο circuit breaker ΠΡΕΠΕΙ να είναι Singleton.</b> Έχει κατάσταση (μετράει αποτυχίες). Ως Transient παίρνει νέο, πάντα κλειστό κύκλωμα σε κάθε κλήση — ξεχνά τα failures και <b>δεν ανοίγει ποτέ</b>. Είναι το lifetime pitfall του Day 04, σε πραγματικό σενάριο.`}},

{t:"Parsing XML & JSON",
code:{lang:"csharp",label:"XML με XDocument",src:`var responseStream = await _client.GetStreamAsync("/rates.xml");
var doc = XDocument.Load(responseStream);
var ns  = XNamespace.Get("http://api.example.com/schema");   // ← ΚΡΙΣΙΜΟ

var rates = doc.Descendants(ns + "Rate")      // χωρίς το ns, γυρνά ΤΙΠΟΤΑ
    .Select(el => new RateDto(
        CurrencyPair: (string)el.Attribute("pair"),
        BidPrice:     (string)el.Element(ns + "Value")))
    .ToList();`},

{
    PropertyNameCaseInsensitive = true,        // "bidPrice" ↔ BidPrice
    DefaultIgnoreCondition = JsonIgnoreCondition.WhenWritingNull
};

var rates = await JsonSerializer.DeserializeAsync<List<RateDto>>(
    await response.Content.ReadAsStreamAsync(), options);`},

{t:"Anti-Corruption Layer (ACL)", star:true,
html:`Το εξωτερικό API έχει <b>τα δικά του</b> ονόματα, τύπους και ιδιοτροπίες (τιμές ως strings, weird casing). Αν αφήσεις αυτό το σχήμα να μπει στο domain σου, κάθε αλλαγή του τρίτου συστήματος γίνεται δική σου αλλαγή παντού.`,
code:{lang:"csharp",label:"acl.cs",src:`// 1. External DTO — ταιριάζει ΑΚΡΙΒΩΣ με τα πεδία του εξωτερικού API
public record RateDto(string CurrencyPair, string BidPrice, string AskPrice);

// 2. Domain model — καθαρό, ισχυρά τυποποιημένο, με τα ΔΙΚΑ ΜΑΣ ονόματα
public record ExchangeRate(string Pair, decimal Bid, decimal Ask)
{
    // 3. Το ACL: ο μοναδικός τόπος όπου συναντιούνται οι δύο κόσμοι
    public static ExchangeRate FromDto(RateDto dto) => new(
        Pair: dto.CurrencyPair,
        Bid:  decimal.Parse(dto.BidPrice, CultureInfo.InvariantCulture),
        Ask:  decimal.Parse(dto.AskPrice, CultureInfo.InvariantCulture));
}

// Όταν το εξωτερικό API μετονομάσει πεδία, αλλάζουν ΜΟΝΟ το RateDto
// και το FromDto. Domain, application και handlers: αναλλοίωτα.`},
note:{type:"info",html:`Πρόσεξε το <code>CultureInfo.InvariantCulture</code>: χωρίς αυτό, σε ελληνικό locale το <code>"1.25"</code> μπορεί να διαβαστεί ως 125. Κλασικό production bug.`}},

{t:"Quartz.NET — αρχιτεκτονική",
table:{head:["Στοιχείο","Τι είναι"],rows:[
["<b>Scheduler</b>","Ενορχηστρώνει jobs & triggers. Singleton, ξεκινά στο startup."],

code:{lang:"csharp",label:"DataFetchJob.cs",src:`public class DataFetchJob : IJob
{
    private readonly IExternalRatesGateway _gateway;
    private readonly IWalletRepository _repo;
    private readonly ILogger<DataFetchJob> _log;

    // Constructor injection δουλεύει κανονικά
    public DataFetchJob(IExternalRatesGateway gateway, IWalletRepository repo,
                        ILogger<DataFetchJob> log)
    { _gateway = gateway; _repo = repo; _log = log; }

    public async Task Execute(IJobExecutionContext context)
    {
        _log.LogInformation("DataFetchJob started");
        var rates = await _gateway.FetchRatesAsync(context.CancellationToken);
        await _repo.UpsertRatesAsync(rates, context.CancellationToken);   // MERGE (Day 05)
        _log.LogInformation("DataFetchJob done: {Count} rates upserted", rates.Count);
    }
}`},
code2:{lang:"csharp",label:"registration",src:`builder.Services.AddQuartz(q =>
{
    var jobKey = new JobKey("DataFetchJob");

    q.AddJob<DataFetchJob>(opts => opts.WithIdentity(jobKey));

    q.AddTrigger(opts => opts
        .ForJob(jobKey)
        .WithIdentity("DataFetchJob-trigger")
        .StartAt(DateTimeOffset.UtcNow.AddSeconds(10))   // μη χτυπήσει στο startup
        .WithCronSchedule("0 0/5 * * * ?"));             // κάθε 5 λεπτά
});

builder.Services.AddQuartzHostedService(q =>
{
    q.WaitForJobsToComplete = true;   // μη σκοτώσεις την app ενώ τρέχει job
});`}},

{t:"CRON — 6 πεδία, τα seconds πρώτα", star:true,
html:`Το Quartz <b>δεν</b> χρησιμοποιεί το unix cron 5 πεδίων. Έχει <b>6</b> (+ προαιρετικό 7ο για year), και το πρώτο είναι τα <b>δευτερόλεπτα</b>. Αυτό μπερδεύει τους πάντες την πρώτη φορά.`,
code:{lang:"text",label:"cron reference",src:`┌───────────── seconds        (0-59)
│ ┌─────────── minutes        (0-59)
│ │ ┌───────── hours          (0-23)
│ │ │ ┌─────── day of month   (1-31)
│ │ │ │ ┌───── month          (1-12 ή JAN-DEC)
│ │ │ │ │ ┌─── day of week    (1-7 ή SUN-SAT · ? = αδιάφορο)
│ │ │ │ │ │
0 0/5 * * * ?

0 0/1 * * * ?      → κάθε 1 λεπτό
0 0/5 * * * ?      → κάθε 5 λεπτά
0/5 * * * * ?      → κάθε 5 ΔΕΥΤΕΡΟΛΕΠΤΑ
0 0 * * * ?        → στην αρχή κάθε ώρας
0 0 0 * * ?        → κάθε μέρα τα μεσάνυχτα
0 0 9 ? * MON-FRI  → 9:00 π.μ. καθημερινές
0 0 8,18 * * ?     → 8:00 π.μ. και 6:00 μ.μ. κάθε μέρα`},
note:{type:"warn",html:`Το <code>?</code> σημαίνει «δεν με νοιάζει» και μπαίνει σε ένα από τα <i>day-of-month</i> / <i>day-of-week</i> — δεν μπορούν να είναι και τα δύο <code>*</code>.`}},

{t:"Error handling & misfire policies",
code:{lang:"csharp",label:"job-error-handling.cs",src:`public async Task Execute(IJobExecutionContext ctx)
{
    try
    {
        var rates = await _gateway.FetchRatesAsync(ctx.CancellationToken);
        await _repo.UpsertRatesAsync(rates, ctx.CancellationToken);
    }
    catch (Exception ex)
    {
        _log.LogError(ex, "DataFetchJob failed");

        // ΠΑΝΤΑ wrap σε JobExecutionException για να ελέγξεις το retry
        var jex = new JobExecutionException(ex);
        jex.RefireImmediately = false;   // μην ξαναδοκιμάσεις αμέσως
        throw jex;
    }
}`},
table:{head:["Misfire policy","Τι κάνει όταν ο scheduler ήταν κάτω"],rows:[
["<b>DoNothing</b>","Παράλειψε τις χαμένες εκτελέσεις· η επόμενη φεύγει κανονικά"],
["<b>FireNow</b>","Εκτέλεσε αμέσως μία φορά, μετά συνέχισε κανονικά"],
["<b>IgnoreMisfirePolicy</b>","Εκτέλεσε για <b>κάθε</b> χαμένη φορά (catch-up)"]]},
note:{type:"info",html:`Misfire = ο trigger έπρεπε να πυροδοτήσει αλλά ο scheduler ήταν κάτω (deploy, restart, crash). Διάλεξε πολιτική ανάλογα με το αν οι χαμένες εκτελέσεις έχουν αξία.`}}

pitfalls:[
{t:"<code>new HttpClient()</code> μέσα στο gateway",
bad:`public class RatesGateway : IRatesGateway
{
    public async Task<Rate> Get(string pair)
    {
        using var client = new HttpClient();   // ✕ παρακάμπτει το factory
        ...
    }
}`,
good:`public class RatesGateway : IRatesGateway
{
    private readonly HttpClient _client;
    public RatesGateway(HttpClient client) => _client = client;  // ✓ από το factory
}
// + services.AddHttpClient<IRatesGateway, RatesGateway>(...);`,
why:`Ακόμα κι αν καταχωρήσεις σωστά το factory, ένα <code>new HttpClient()</code> κρυμμένο μέσα στην κλάση επαναφέρει το socket exhaustion. Και δεν παίρνει τα Polly policies.`},
{t:"Circuit breaker ως Transient",
bad:`services.AddTransient<AsyncCircuitBreakerPolicy>(...);
// Νέο breaker σε κάθε κλήση → 0 failures στη μνήμη → δεν ανοίγει ΠΟΤΕ.`,
good:`services.AddSingleton<AsyncCircuitBreakerPolicy>(...);
// Ή, με το AddPolicyHandler, μία φορά στη ρύθμιση του HttpClient.`,
why:`Ο circuit breaker <b>είναι κατάσταση</b>: μετράει διαδοχικές αποτυχίες. Χωρίς κοινή κατάσταση, ο μηχανισμός είναι διακοσμητικός — συνεχίζεις να βομβαρδίζεις ένα service που έχει ήδη πέσει.`},
{t:"Το job πυροδοτεί αμέσως στο startup",
bad:`q.AddTrigger(o => o.ForJob(jobKey).WithCronSchedule("0 0/5 * * * ?"));
// Σε κάθε deploy/restart, το job τρέχει τη στιγμή που η εφαρμογή σηκώνεται —
// ενώ ακόμα ζεσταίνονται connections, caches, migrations.`,
good:`q.AddTrigger(o => o.ForJob(jobKey)
    .StartAt(DateTimeOffset.UtcNow.AddSeconds(10))
    .WithCronSchedule("0 0/5 * * * ?"));`,
why:`Δίνεις στην εφαρμογή χρόνο να ολοκληρώσει το startup. Σε rolling deploy με πολλά instances, αποφεύγεις και το «όλα μαζί ταυτόχρονα».`}

["Τι είναι misfire;","Ο trigger έπρεπε να πυροδοτήσει αλλά ο scheduler ήταν κάτω. Πολιτικές: DoNothing / FireNow / IgnoreMisfirePolicy (catch-up)."]
],
iv:[
["Πώς καλείς ένα εξωτερικό API με ασφάλεια;",
"Πάντα μέσω <code>IHttpClientFactory</code>, τυπικά ως typed client, ώστε να μην ανοίγω sockets σε κάθε κλήση. Πάνω του βάζω Polly: timeout για να μην κρεμάω, retry με exponential backoff για τα παροδικά σφάλματα, και circuit breaker για να σταματήσω να χτυπάω κάτι που έχει πέσει — ο breaker καταχωρείται ως Singleton, αλλιώς δεν μαζεύει ποτέ αρκετές αποτυχίες για να ανοίξει. Και ό,τι έρχεται πίσω περνά από ένα anti-corruption layer, ώστε το σχήμα του τρίτου να μη μπει στο domain μου."],
["Τι είναι το anti-corruption layer και γιατί μπαίνεις στον κόπο;",
"Είναι ένα στρώμα μετάφρασης ανάμεσα στο εξωτερικό συμβόλαιο και το δικό μου μοντέλο. Το εξωτερικό DTO αντικατοπτρίζει ακριβώς τα ονόματα και τους τύπους του τρίτου συστήματος — συχνά τιμές ως strings, περίεργο casing. Ένας mapper το μετατρέπει σε καθαρό, ισχυρά τυποποιημένο domain model. Το όφελος φαίνεται όταν ο τρίτος αλλάξει το API: αλλάζω δύο αρχεία αντί να κυνηγάω το νέο όνομα πεδίου σε όλο το codebase."],
["Πώς θα προγραμμάτιζες μια εργασία που τραβά δεδομένα κάθε 5 λεπτά;",
"Με Quartz: ένα <code>IJob</code> που παίρνει τις εξαρτήσεις του από constructor injection, ένα JobDetail και ένα CRON trigger <code>0 0/5 * * * ?</code> — θυμάμαι ότι το πρώτο πεδίο είναι δευτερόλεπτα. Βάζω <code>StartAt</code> με μικρή καθυστέρηση, ώστε να μη χτυπήσει τη στιγμή του startup, και <code>WaitForJobsToComplete</code> στο hosted service, ώστε ένα deploy να μην κόψει job στη μέση. Μέσα στο Execute τυλίγω τα πάντα σε try/catch και ξαναπετάω <code>JobExecutionException</code>, ώστε το Quartz να χειριστεί σωστά την αποτυχία. Το write το κάνω idempotent — MERGE upsert — ώστε ένα ξαναπέρασμα να μη δημιουργεί διπλότυπα."]
]
},

n:9, title:"Unit & Integration Testing", tag:"xUnit · Moq · WebApplicationFactory · Testcontainers",
sub:"Ο κώδικας που δεν τεστάρεται δεν είναι πρόβλημα testing — είναι πρόβλημα σχεδίασης.",
goal:"Να γράφεις [Fact]/[Theory] με Arrange-Act-Assert, να κάνεις mock interfaces, και να ξέρεις τι ΔΕΝ τεστάρεις.",
concepts:[
{t:"Γιατί γράφουμε tests", star:true,
html:`<ul>
<li><b>Τεκμηρίωση πρόθεσης</b> — ένα καλά ονομασμένο test είναι η πιο ακριβής προδιαγραφή: λέει τι κάνει ο κώδικας σε συγκεκριμένο σενάριο, χωρίς ασάφεια.</li>
<li><b>Δίχτυ ασφαλείας για refactoring</b> — αναδιοργανώνεις εσωτερικά με σιγουριά· αν η συμπεριφορά έμεινε ίδια, τα tests μένουν πράσινα.</li>
<li><b>Επιβάλλει καλή σχεδίαση</b> — αν δεν μπορείς να τεστάρεις μια μέθοδο απομονωμένα, <b>κάνει πολλά πράγματα</b>. Το untestable code είναι design smell.</li>
<li><b>Πιάνει regressions αμέσως</b> — ένα regression που φτάνει στο production κοστίζει ακριβά· ένα test που σκάει τοπικά κοστίζει 30 δευτερόλεπτα.</li>
</ul>`},

{t:"xUnit — [Fact] & Arrange/Act/Assert",
html:`Το <code>[Fact]</code> είναι test χωρίς παραμέτρους, ντετερμινιστικό: <b>ένα σενάριο, ένα αναμενόμενο αποτέλεσμα</b>. Σύμβαση ονομασίας: <code>MethodName_Scenario_ExpectedResult</code> — όταν σκάει, το όνομα σου λέει τι χάλασε χωρίς να ανοίξεις κώδικα.`,
code:{lang:"csharp",label:"PlayerTests.cs — [Fact]",src:`public class PlayerTests
{
    [Fact]
    public void UpdateScore_PositiveNewScore_UpdatesScore()
    {
        // Arrange — στήσε το σενάριο
        var player = new Player("Test Player");
        var updatedScore = 50;

        // Act — μία ενέργεια, αυτή που τεστάρεις
        player.UpdateScore(updatedScore);

        // Assert — μία λογική επαλήθευση
        Assert.Equal(updatedScore, player.Score);
    }
}`},
code2:{lang:"csharp",label:"[Theory] — data-driven",src:`public class PlayerTests
{
    [Theory]
    [InlineData(0)]
    [InlineData(-1)]
    [InlineData(int.MinValue)]
    public void UpdateScore_NonPositiveNewScore_ThrowsArgumentOutOfRangeException(int newScore)
    {
        // Arrange
        var player = new Player("Test Player");

        // Act
        void UpdateScore() => player.UpdateScore(newScore);

        // Assert
        Assert.Throws<ArgumentOutOfRangeException>(UpdateScore);
    }
}
// Κάθε InlineData είναι ΞΕΧΩΡΙΣΤΟ, ανεξάρτητο test run.
// Ιδανικό για edge cases: 0, -1, null, max/min — χωρίς επανάληψη του A/A/A.`}},

{t:"Moq — ελεγχόμενα fakes", star:true,
html:`Το <code>Mock&lt;T&gt;</code> αντικαθιστά μια πραγματική εξάρτηση με fake που ελέγχεις πλήρως: <code>.Setup()</code> ορίζει τι επιστρέφει, <code>.Verify()</code> επιβεβαιώνει ότι κλήθηκε.`,
code:{lang:"csharp",label:"PlayerService.cs — το SUT",src:`public class PlayerService : IPlayerService
{
    private readonly IPlayerRepository _players;
    private readonly ILogger<PlayerService> _logger;

    public PlayerService(IPlayerRepository players, ILogger<PlayerService> logger)
    { _players = players; _logger = logger; }

    public async Task<Player> CreateAsync(string name, int score, CancellationToken ct = default)
    {
        var player = new Player(name);
        player.UpdateScore(score);

        await _players.AddAsync(player, ct);
        _logger.LogInformation("Player created {PlayerId} {Name} (score {Score})",
                               player.Id, name, score);
        return player;
    }
}`},
code2:{lang:"csharp",label:"PlayerServiceTests.cs",src:`public class PlayerServiceTests
{
    // Κάθε test class παίρνει ΦΡΕΣΚΑ mocks — μηδέν κοινή κατάσταση
    private readonly Mock<IPlayerRepository> _playerRepositoryMock = new();
    private readonly Mock<ILogger<PlayerService>> _loggerMock = new();
    private readonly PlayerService _sut;   // System Under Test

    public PlayerServiceTests()
        => _sut = new PlayerService(_playerRepositoryMock.Object, _loggerMock.Object);

    [Fact]
    public async Task CreateAsync_NameAndScoreProvided_CreatesPlayer()
    {
        // Arrange
        const string playerName = "Nikopolidis";
        const int playerScore = 10;

        // Act
        var player = await _sut.CreateAsync(playerName, playerScore, CancellationToken.None);

        // Assert
        Assert.Equal(playerName, player.Name);
        Assert.Equal(playerScore, player.Score);

        _playerRepositoryMock.Verify(
            m => m.AddAsync(player, It.IsAny<CancellationToken>()), Times.Once);
    }
}`},
note:{type:"bad",html:`<b>Mock-άρεις interfaces, όχι concrete κλάσεις.</b> Το Moq δεν μπορεί να κάνει mock non-virtual μεθόδους — γι' αυτό το DI + interfaces του Day 04 δεν είναι θεωρία, είναι προϋπόθεση για να τεστάρεις.`}},

{t:"Integration testing με WebApplicationFactory",
html:`Σηκώνει <b>ολόκληρο το ASP.NET Core pipeline in-process</b> — πραγματικό middleware, πραγματικό DI, χωρίς δίκτυο. Ο <code>HttpClient</code> στέλνει requests κατευθείαν μέσα στην εφαρμογή.`,
code:{lang:"csharp",label:"TestApiFactory.cs",src:`public class TestApiFactory : WebApplicationFactory<Program>
{
    private readonly string _dbName = "noviacademy-tests-" + Guid.NewGuid();

    protected override void ConfigureWebHost(IWebHostBuilder builder)
    {
        builder.ConfigureTestServices(services =>
        {
            // Βγάλε το πραγματικό DbContext registration
            services.RemoveAll<DbContextOptions<AppDbContext>>();
            services.RemoveAll<DbContextOptions>();
            services.RemoveAll<IDbContextOptionsConfiguration<AppDbContext>>();

            // Βάλε test database
            services.AddDbContext<AppDbContext>(o => o.UseInMemoryDatabase(_dbName));

            // Βγάλε τα Quartz hosted services — δεν θέλουμε jobs στα tests
            var quartzHosted = services.Where(d =>
                d.ServiceType == typeof(IHostedService) &&
                (d.ImplementationType?.FullName?.Contains("Quartz") ?? false)).ToList();
            foreach (var d in quartzHosted) services.Remove(d);
        });
    }
}

// Χρήση: IClassFixture<T> = ΕΝΑ factory ανά test class (το pipeline
// σηκώνεται μία φορά, όχι σε κάθε test)
public class PlayersApiTests : IClassFixture<TestApiFactory>
{
    private readonly HttpClient _client;
    public PlayersApiTests(TestApiFactory factory) => _client = factory.CreateClient();

    [Fact]
    public async Task Post_ValidPlayer_Returns201()
    {
        var response = await _client.PostAsJsonAsync("/api/players",
            new { Name = "Alice", Country = "GR" });

        Assert.Equal(HttpStatusCode.Created, response.StatusCode);
    }
}`}},

{t:"Testcontainers — πραγματικός SQL Server σε Docker",
html:`Ο in-memory provider του EF Core έχει ιδιοτροπίες: δεν επιβάλλει constraints, δεν κάνει πραγματικά JOIN plans, δέχεται SQL που ο SQL Server θα απέρριπτε. Το Testcontainers σηκώνει <b>την ίδια μηχανή με το production</b>.`,
code:{lang:"csharp",label:"Testcontainers.cs",src:`public class TestApiFactory : WebApplicationFactory<Program>, IAsyncLifetime
{
    private readonly MsSqlContainer _sqlContainer =
        new MsSqlBuilder("mcr.microsoft.com/mssql/server:2019-latest").Build();

    // IAsyncLifetime: ΠΟΤΕ από constructor ή Dispose — πάντα από εδώ
    public async Task InitializeAsync()
    {
        await _sqlContainer.StartAsync();

        using var scope = Services.CreateScope();
        var db = scope.ServiceProvider.GetRequiredService<AppDbContext>();
        await db.Database.MigrateAsync();       // τρέξε τα migrations
    }

    protected override void ConfigureWebHost(IWebHostBuilder builder)
        => builder.ConfigureTestServices(services =>
        {
            services.RemoveAll<DbContextOptions<AppDbContext>>();
            services.AddDbContext<AppDbContext>(o =>
                o.UseSqlServer(_sqlContainer.GetConnectionString()));
        });

    // ΑΠΑΡΑΙΤΗΤΟ — αλλιώς τα containers διαρρέουν
    async Task IAsyncLifetime.DisposeAsync() => await _sqlContainer.DisposeAsync();
}`},
note:{type:"warn",html:`Κάθε test class παίρνει <b>δικό της container</b> με τυχαία πόρτα και άδειο σχήμα — μηδέν υπολείμματα ανάμεσα σε runs. Το κόστος: χρειάζεται Docker και είναι πιο αργό, γι' αυτό μένει στο μεσαίο επίπεδο της πυραμίδας.`}}
],
pitfalls:[
{t:"Tests που εξαρτώνται από σειρά εκτέλεσης",
bad:`public class OrderTests
{
    private static Player _player;              // ✕ κοινή στατική κατάσταση

    [Fact] public void Test1_Creates() => _player = new Player("A");
    [Fact] public void Test2_Uses()    => Assert.Equal("A", _player.Name);
}
// Το Test2 σκάει αν τρέξει πρώτο — ή παράλληλα.`,
good:`public class PlayerTests
{
    [Fact]
    public void Name_WhenCreated_IsSet()
    {
        var player = new Player("A");           // ✓ κάθε test στήνει τα δικά του
        Assert.Equal("A", player.Name);
    }
}`,
why:`Το xUnit τρέχει test classes <b>παράλληλα</b> και δεν εγγυάται σειρά. Κάθε test πρέπει να είναι πλήρως ανεξάρτητο — αλλιώς παίρνεις flaky tests που κανείς δεν εμπιστεύεται.`},
{t:"Assertions σε implementation details",
bad:`// Επαληθεύει ΠΩΣ έγινε, όχι ΤΙ έγινε
_repoMock.Verify(r => r.BeginTransaction(), Times.Once);
_repoMock.Verify(r => r.Flush(), Times.Exactly(2));
// Κάθε refactoring σπάει το test, ακόμα κι αν η συμπεριφορά είναι σωστή.`,
good:`// Επαληθεύει το παρατηρήσιμο αποτέλεσμα
var result = await _sut.WithdrawAsync(accountId, 50m);
Assert.Equal(50m, result.RemainingBalance);
_repoMock.Verify(r => r.SaveAsync(It.IsAny<Wallet>(), It.IsAny<CancellationToken>()),
                 Times.Once);`,
why:`Τα εύθραυστα tests είναι χειρότερα από καθόλου tests: εκπαιδεύουν την ομάδα να αγνοεί τα κόκκινα. Τεστάρεις συμβόλαιο και συμπεριφορά, όχι εσωτερικά βήματα.`},
{t:"<code>Thread.Sleep</code> σε async tests",
bad:`_service.StartBackgroundWork();
Thread.Sleep(2000);                 // ✕ ελπίζω να τελείωσε
Assert.True(_service.Finished);`,
good:`await _service.StartBackgroundWorkAsync();   // ✓ περίμενε το Task
Assert.True(_service.Finished);
// ή: await Task.WhenAll(tasks);`,
why:`Το sleep είναι είτε πολύ μικρό (flaky) είτε πολύ μεγάλο (αργή σουίτα) — συνήθως και τα δύο σε διαφορετικές μηχανές. Πάντα <code>await</code> το πραγματικό Task.`}

using System.Collections.Generic;

public class Player
{

    public string Name  { get; set; }
    public int    Score { get; private set; }

    public Player(string name)
    {
        if (string.IsNullOrWhiteSpace(name))
            throw new ArgumentException("Name cannot be empty", nameof(name));

        Id    = Guid.NewGuid();
        Name  = name;
        Score = 0;
    }

    public void AddScore(int points)
    {
        if (points < 0)
            throw new ArgumentOutOfRangeException(nameof(points));

        Score += points;
    }

    public override string ToString() => $"{Name} (Score: {Score})";
}

public class PlayerRegistry
{
    private readonly Dictionary<Guid, Player> _players = new();

    public void Add(Player player)
    {
        ArgumentNullException.ThrowIfNull(player);
        _players[player.Id] = player;
    }

    public Player? Find(Guid id)
        => _players.TryGetValue(id, out var player) ? player : null;

    public string Rank(Player player) => player.Score switch
    {
        0       => "New player",
        < 1000  => "Beginner",
        < 10000 => "Intermediate",
        _       => "Expert",
    };
}`},

solution:`using System;
using System.Collections.Generic;
using System.Linq;

public abstract class Payment
{
    protected Payment(decimal amount, string currency)
    {
        Amount = amount;
        Currency = currency;
    }

    public decimal Amount   { get; }
    public string  Currency { get; }
    public int     Id       { get; init; }
    public int     CustomerId { get; init; }

    public abstract void Pay();
}

public interface IRefundable
{
    void Refund(decimal amount);
}

public class CardPayment : Payment, IRefundable
{
    private readonly string _card;

    public CardPayment(decimal amount, string currency, string card)
        : base(amount, currency) => _card = card;

    public override void Pay()  => Console.WriteLine($"I paid with card {Amount} {Currency}");
    public void Refund(decimal amount) => Console.WriteLine($"Refunded {amount}");
}

public class CashPayment : Payment
{
    public CashPayment(decimal amount, string currency) : base(amount, currency) { }
    public override void Pay() => Console.WriteLine($"I paid with cash {Amount} {Currency}");
}

public record PaymentDto(int CustomerId, decimal Amount);

public class PaymentReport
{
    public List<Payment> Top3(List<Payment> payments, int customerId)
        => payments
            .Where(p => p.CustomerId == customerId)
            .OrderByDescending(p => p.Amount)
            .Take(3)
            .ToList();

    public void PrintTotalsByCurrency(List<Payment> payments)
    {
        foreach (var g in payments.GroupBy(p => p.Currency))
            Console.WriteLine($"{g.Key}: {g.Sum(p => p.Amount)}");
    }

    public Payment Find(List<Payment> payments, int id)
        => payments.FirstOrDefault(p => p.Id == id);
}`},

{l:"Κανένα <code>throw ex;</code>",r:'throw\\s+\\w+\\s*;',not:true},
{l:"Κανένα interpolated string στο logger",r:'Log(?:Information|Warning|Error|Debug)\\s*\\(\\s*\\$"',not:true},
{l:"Κανένα άδειο catch",r:'catch\\s*(?:\\([^)]*\\))?\\s*\\{\\s*\\}',not:true}],
hints:[
"Το «3 guard clauses» σημαίνει τρία <code>if (...) return \"...\";</code> στη σειρά, χωρίς <code>else</code>, με το <code>return \"OK\";</code> τελευταίο.",
"Το custom exception παίρνει τα δεδομένα στον constructor και τα εκθέτει ως <code>{ get; }</code> properties, ώστε ο caller να μην κάνει parse το message.",
"Wrap σημαίνει: <code>throw new DepositFailedException(accountId, \"...\", ex);</code> — το τρίτο όρισμα γίνεται InnerException μέσω <code>base(message, inner)</code>."],
solution:`using System;
using System.Collections.Generic;
using Microsoft.Extensions.Logging;

public abstract class DomainException : Exception
{
    protected DomainException(string message, Exception? inner = null)
        : base(message, inner) { }
}

public class InsufficientBalanceException : DomainException
{
    public Guid    AccountId       { get; }
    public decimal Balance         { get; }
    public decimal RequestedAmount { get; }

    public InsufficientBalanceException(Guid accountId, decimal balance, decimal requested)
        : base($"Account {accountId} has {balance} but {requested} was requested.")
    {
        AccountId = accountId;
        Balance = balance;
        RequestedAmount = requested;
    }
}

public class DepositFailedException : DomainException
{
    public Guid AccountId { get; }

    public DepositFailedException(Guid accountId, string message, Exception inner)
        : base(message, inner) => AccountId = accountId;
}

public class DepositService
{
    private readonly ILogger<DepositService> _logger;

    public DepositService(ILogger<DepositService> logger) => _logger = logger;

    // VALIDATED PATH — guard clauses, happy path flat & last
    public string Validate(decimal amount, string currency, bool accountActive)
    {
        if (amount <= 0)
            return "Rejected: must be positive";

        if (amount < 5m)
            return "Rejected: below minimum";

        if (currency is not ("EUR" or "USD" or "GBP"))
            return "Rejected: bad currency";

        if (!accountActive)
            return "Rejected: account not active";

        return "OK";
    }

    // EXCEPTIONAL PATH — invariant violation
    public void Withdraw(Guid accountId, decimal balance, decimal amount)
    {
        if (balance - amount < 0)
            throw new InsufficientBalanceException(accountId, balance, amount);
    }

    public void Deposit(Guid accountId, decimal amount, string currency)
    {
        try
        {
            _logger.LogInformation("Deposit {Amount} {Currency} for {AccountId}",
                                   amount, currency, accountId);
            Convert(currency, amount);
        }
        catch (KeyNotFoundException ex)
        {
            _logger.LogError(ex, "FX rate missing for {Currency}", currency);

            throw new DepositFailedException(
                accountId, "Could not apply PSP settlement conversion.", ex);
        }
    }

    private decimal Convert(string currency, decimal amount) => amount;
}`},

solution:`using System;
using Microsoft.Extensions.DependencyInjection;

// ---------- DOMAIN ----------
public class InsufficientFundsException : Exception
{
    public InsufficientFundsException(string message) : base(message) { }
}

public class Wallet
{
    public int     PlayerId { get; }
    public decimal Balance  { get; private set; }

    public Wallet(int playerId) => PlayerId = playerId;

    public void AddFunds(decimal amount)
    {
        if (amount <= 0) throw new ArgumentOutOfRangeException(nameof(amount));
        Balance += amount;
    }

    public void SubtractFunds(decimal amount)
    {
        if (Balance - amount < 0)
            throw new InsufficientFundsException($"Wallet {PlayerId} has {Balance}.");

        Balance -= amount;
    }

    // Σκόπιμα χωρίς guard: chargebacks, admin corrections, ποινές
    public void ForceSubtractFunds(decimal amount) => Balance -= amount;
}

// ---------- APPLICATION ----------
public interface IWalletRepository
{
    Wallet GetWallet(int playerId);
}

public interface IFundsStrategy
{
    void Execute(Wallet wallet, decimal amount);
}

public class AddFundsStrategy : IFundsStrategy
{
    public void Execute(Wallet wallet, decimal amount) => wallet.AddFunds(amount);
}

public class SubtractFundsStrategy : IFundsStrategy
{
    public void Execute(Wallet wallet, decimal amount) => wallet.SubtractFunds(amount);
}

public class WalletService
{
    private readonly IWalletRepository _repo;

    public WalletService(IWalletRepository repo) => _repo = repo;

    public void AdjustFunds(int playerId, decimal amount, IFundsStrategy strategy)
    {
        var wallet = _repo.GetWallet(playerId);
        strategy.Execute(wallet, amount);
    }
}

// ---------- COMPOSITION ROOT ----------
public static class Program
{
    public static void Register(IServiceCollection services)
    {
        services.AddScoped<IWalletRepository, EfWalletRepository>();
        services.AddScoped<WalletService>();
        services.AddSingleton<IFundsStrategy, AddFundsStrategy>();
    }
}

public class EfWalletRepository : IWalletRepository
{
    public Wallet GetWallet(int playerId) => new Wallet(playerId);
}`},

solution:`using System.Collections.Generic;
using System.Data;
using System.Linq;
using System.Threading.Tasks;
using Dapper;
using Microsoft.EntityFrameworkCore;
using Microsoft.Extensions.DependencyInjection;

public class NoviAcademyContext : DbContext
{
    public NoviAcademyContext(DbContextOptions<NoviAcademyContext> options) : base(options) { }

    public DbSet<Car>     Cars      => Set<Car>();
    public DbSet<Company> Companies => Set<Company>();

    protected override void OnModelCreating(ModelBuilder b)
    {
        b.Entity<Car>(e =>
        {
            e.ToTable("Cars");
            e.HasKey(c => c.Id);
            e.Property(c => c.Model).HasColumnType("varchar(100)").IsRequired();

            e.HasOne(c => c.Company)
                .WithMany(co => co.Cars)
                .HasForeignKey(c => c.CompanyId);

            e.HasIndex(c => c.CompanyId, "IX_Cars_CompanyId");
        });
    }
}

public class CarRepository
{
    private readonly NoviAcademyContext _db;
    private readonly IDbConnection _conn;

    public CarRepository(NoviAcademyContext db, IDbConnection conn)
    {
        _db = db; _conn = conn;
    }

    public Task<Car[]> GetByCompany(string companyName)
        => _db.Cars
            .AsNoTracking()
            .Include(c => c.Company)
            .Where(c => c.Company.Name == companyName)
            .ToArrayAsync();

    public async Task Add(Car car)
    {
        _db.Cars.Add(car);
        await _db.SaveChangesAsync();
    }

    public Task<IEnumerable<Car>> GetByModel(string model)
    {
        const string sql = "SELECT Id, Model, CompanyId FROM Cars WHERE Model = @Model;";
        return _conn.QueryAsync<Car>(sql, new { Model = model });
    }
}

public static class Registration
{
    public static void Register(IServiceCollection services, string cs)
    {
        services.AddDbContext<NoviAcademyContext>(o => o.UseSqlServer(cs));
        services.AddScoped<CarRepository>();
    }
}`},

solution:`using System.Collections.Generic;
using System.Threading;
using System.Threading.Tasks;
using Microsoft.AspNetCore.Mvc;
using Microsoft.EntityFrameworkCore;
using Microsoft.Extensions.Caching.Memory;

public record CreatePlayerRequest(string Name, string Country);
public record PlayerDto(int Id, string Name, string Country);

[ApiController]
[Route("api/players")]
public class PlayersController : ControllerBase
{
    private readonly IPlayerService _service;

    public PlayersController(IPlayerService service) => _service = service;

    [HttpPost]
    public async Task<IActionResult> Create([FromBody] CreatePlayerRequest req,
                                            CancellationToken ct)
    {
        var id = await _service.CreateAsync(req.Name, req.Country, ct);
        return CreatedAtAction(nameof(GetById), new { id }, new { id });
    }

    [HttpGet("{id:int}")]
    public async Task<IActionResult> GetById([FromRoute] int id, CancellationToken ct)
    {
        var player = await _service.GetByIdAsync(id, ct);
        return player is null ? NotFound() : Ok(player);
    }
}

public class RankingsService
{
    private const string CacheKey = "rankings";
    private readonly IMemoryCache _cache;
    private readonly AppDbContext _db;

    public RankingsService(IMemoryCache cache, AppDbContext db)
    {
        _cache = cache; _db = db;
    }

    public async Task<List<RankingDto>> GetRankings(CancellationToken ct)
    {
        if (!_cache.TryGetValue(CacheKey, out List<RankingDto> rankings))
        {
            rankings = await _db.Rankings.AsNoTracking().ToListAsync(ct);

            _cache.Set(CacheKey, rankings, new MemoryCacheEntryOptions
            {
                AbsoluteExpirationRelativeToNow = TimeSpan.FromSeconds(30)
            });
        }

        return rankings;
    }

    public async Task AdjustPoints(int id, int amount, CancellationToken ct)
    {
        var player = await _db.Players.FindAsync(new object[] { id }, ct);
        player.Points += amount;

        await _db.SaveChangesAsync(ct);
        _cache.Remove(CacheKey);
    }
}`},

solution:`using System.Threading;
using System.Threading.Tasks;
using FluentValidation;
using MediatR;
using Microsoft.AspNetCore.Mvc;
using Microsoft.Extensions.Logging;

// ---------- QUERY ----------
public record GetCarByIdQuery(int Id) : IRequest<Car?>;

public class GetCarByIdQueryHandler : IRequestHandler<GetCarByIdQuery, Car?>
{
    private readonly ICarRepository _cars;

    public GetCarByIdQueryHandler(ICarRepository cars) => _cars = cars;

    public Task<Car?> Handle(GetCarByIdQuery request, CancellationToken ct)
        => _cars.GetById(request.Id);
}

// ---------- COMMAND ----------
public record CreateCarCommand(string Model, int CompanyId) : IRequest<int>;

public class CreateCarCommandHandler : IRequestHandler<CreateCarCommand, int>
{
    private readonly ICarRepository _cars;
    private readonly ICompanyRepository _companies;

    public CreateCarCommandHandler(ICarRepository cars, ICompanyRepository companies)
    {
        _cars = cars; _companies = companies;
    }

    public async Task<int> Handle(CreateCarCommand request, CancellationToken ct)
    {
        _ = await _companies.GetById(request.CompanyId)
            ?? throw new InvalidOperationException("Company does not exist.");

        var car = await _cars.Add(new Car { Model = request.Model,
                                            CompanyId = request.CompanyId });
        return car.Id;
    }
}

// ---------- VALIDATOR ----------
public class CreateCarCommandValidator : AbstractValidator<CreateCarCommand>
{
    public CreateCarCommandValidator()
    {
        RuleFor(x => x.Model).NotEmpty().MaximumLength(100);
        RuleFor(x => x.CompanyId).GreaterThan(0);
    }
}

// ---------- DECORATOR ----------
public class LoggingRequestHandler<TRequest, TResponse>
    : IRequestHandler<TRequest, TResponse>
    where TRequest : IRequest<TResponse>
{
    private readonly IRequestHandler<TRequest, TResponse> _inner;
    private readonly ILogger<LoggingRequestHandler<TRequest, TResponse>> _logger;

    public LoggingRequestHandler(IRequestHandler<TRequest, TResponse> inner,
                                 ILogger<LoggingRequestHandler<TRequest, TResponse>> logger)
    {
        _inner = inner; _logger = logger;
    }

    public Task<TResponse> Handle(TRequest request, CancellationToken ct)
    {
        _logger.LogInformation("{Name}", typeof(TRequest).Name);
        return _inner.Handle(request, ct);
    }
}

// ---------- CONTROLLER ----------
[ApiController]
[Route("api/cars")]
public class CarsController : ControllerBase
{
    private readonly IMediator _mediator;

    public CarsController(IMediator mediator) => _mediator = mediator;

    [HttpGet("{id:int}")]
    public async Task<IActionResult> Get(int id, CancellationToken ct)
        => Ok(await _mediator.Send(new GetCarByIdQuery(id), ct));

    [HttpPost]
    public async Task<IActionResult> Create(CreateCarCommand command, CancellationToken ct)
        => Ok(await _mediator.Send(command, ct));
}`},

solution:`using System;
using System.Globalization;
using System.Net.Http;
using System.Threading;
using System.Threading.Tasks;
using Microsoft.Extensions.DependencyInjection;
using Microsoft.Extensions.Logging;
using Polly;
using Quartz;

// ---------- ACL ----------
public record RateDto(string CurrencyPair, string BidPrice, string AskPrice);

public record ExchangeRate(string Pair, decimal Bid, decimal Ask)
{
    public static ExchangeRate FromDto(RateDto dto) => new(
        Pair: dto.CurrencyPair,
        Bid:  decimal.Parse(dto.BidPrice, CultureInfo.InvariantCulture),
        Ask:  decimal.Parse(dto.AskPrice, CultureInfo.InvariantCulture));
}

// ---------- GATEWAY ----------
public interface IRatesGateway
{
    Task<ExchangeRate[]> FetchRatesAsync(CancellationToken ct);
}

public class RatesGateway : IRatesGateway
{
    private readonly HttpClient _client;

    public RatesGateway(HttpClient client) => _client = client;

    public async Task<ExchangeRate[]> FetchRatesAsync(CancellationToken ct)
    {
        var dtos = await _client.GetFromJsonAsync<RateDto[]>("/rates.json", ct);
        return Array.ConvertAll(dtos!, ExchangeRate.FromDto);
    }
}

// ---------- JOB ----------
public class DataFetchJob : IJob
{
    private readonly IRatesGateway _gateway;
    private readonly ILogger<DataFetchJob> _log;

    public DataFetchJob(IRatesGateway gateway, ILogger<DataFetchJob> log)
    {
        _gateway = gateway; _log = log;
    }

    public async Task Execute(IJobExecutionContext context)
    {
        try
        {
            var rates = await _gateway.FetchRatesAsync(context.CancellationToken);
            _log.LogInformation("DataFetchJob done: {Count} rates", rates.Length);
        }
        catch (Exception ex)
        {
            _log.LogError(ex, "DataFetchJob failed");

            var jex = new JobExecutionException(ex);
            jex.RefireImmediately = false;
            throw jex;
        }
    }
}

// ---------- COMPOSITION ROOT ----------
public static class Startup
{
    public static void Register(IServiceCollection services)
    {
        var retry = Policy
            .Handle<HttpRequestException>()
            .OrResult<HttpResponseMessage>(r => !r.IsSuccessStatusCode)
            .WaitAndRetryAsync(3, attempt => TimeSpan.FromSeconds(Math.Pow(2, attempt)));

        var breaker = Policy
            .Handle<HttpRequestException>()
            .CircuitBreakerAsync(5, TimeSpan.FromSeconds(30));

        var combined = Policy.WrapAsync(retry, breaker);

        services.AddHttpClient<IRatesGateway, RatesGateway>(c =>
                    c.BaseAddress = new Uri("https://api.example.com"))
                .AddPolicyHandler(combined);

        services.AddQuartz(q =>
        {
            var jobKey = new JobKey("DataFetchJob");
            q.AddJob<DataFetchJob>(o => o.WithIdentity(jobKey));

            q.AddTrigger(o => o
                .ForJob(jobKey)
                .WithIdentity("DataFetchJob-trigger")
                .StartAt(DateTimeOffset.UtcNow.AddSeconds(10))
                .WithCronSchedule("0 0/5 * * * ?"));
        });

        services.AddQuartzHostedService(q => q.WaitForJobsToComplete = true);
    }
}`},

    kw:/\b(?:SELECT|FROM|WHERE|INNER|LEFT|RIGHT|OUTER|JOIN|ON|GROUP|ORDER|BY|HAVING|INSERT|INTO|VALUES|UPDATE|SET|DELETE|CREATE|ALTER|DROP|TABLE|INDEX|CLUSTERED|NONCLUSTERED|PRIMARY|FOREIGN|KEY|REFERENCES|NOT|NULL|AS|AND|OR|BEGIN|END|TRY|CATCH|TRANSACTION|TRAN|COMMIT|ROLLBACK|MERGE|USING|MATCHED|WHEN|THEN|TARGET|SOURCE|DECLARE|DISTINCT|TOP|EXISTS|IN|LIKE|BETWEEN|CASE|ELSE|WITH)\b/i,
    num:/\b\d+(?:\.\d+)?\b/,
    type:/@[A-Za-z_][A-Za-z0-9_]*|\b(?:INT|VARCHAR|NVARCHAR|DECIMAL|BIT|DATETIME|DATE|UNIQUEIDENTIFIER|COUNT|SUM|AVG|MIN|MAX)\b/i
  },
  xml:{
    comment:/<!--[\s\S]*?-->/,
    string:/"[^"\n]*"|'[^'\n]*'/,
    kw:/<\/?[A-Za-z_][\w:.-]*|\/?>/,
    type:/[A-Za-z_][\w:.-]*(?==)/,
    num:/\b\d+\b/
  },
  bash:{
    comment:/#[^\n]*/,
    string:/"(?:[^"\\\n]|\\.)*"|'[^'\n]*'/,
    kw:/\b(?:git|dotnet|npm|cd|echo|export|Add-Migration|Update-Database|Script-Migration|Scaffold-DbContext)\b/,
    num:/\b\d+\b/,
    type:/(?:^|\s)-{1,2}[A-Za-z][\w-]*/
  },
  text:{}
};
function hl(src, lang){
  const sp = SPECS[lang] || SPECS.text;
  const keys = ["comment","string","at","kw","num","type"].filter(k=>sp[k]);
  if(!keys.length) return esc(src);
  let flags="g"; if(lang==="sql") flags="gi";
  const re = new RegExp(keys.map(k=>"("+sp[k].source+")").join("|"), flags);
  let out="", last=0, m;
  while((m = re.exec(src))!==null){
    if(m.index>last) out += esc(src.slice(last,m.index));
    let cls="op";
    for(let i=0;i<keys.length;i++){ if(m[i+1]!==undefined){ cls={comment:"c",string:"s",at:"at",kw:"k",num:"n",type:"t"}[keys[i]]; break; } }
    out += '<span class="'+cls+'">'+esc(m[0])+"</span>";
    last = m.index + m[0].length;
    if(m[0].length===0) re.lastIndex++;
  }
  out += esc(src.slice(last));
  return out;
}
function codeBlock(c){
  if(!c) return "";
  const cls = c.bad ? "codewrap badcode" : c.ok ? "codewrap okcode" : "codewrap";
  return '<div class="'+cls+'"><div class="codehead"><span>'+esc(c.label||c.lang)+
    '</span><span class="cp" onclick="cp(this)">copy</span></div><pre><code>'+hl(c.src,c.lang)+"</code></pre></div>";
}
function cp(b){
  const t = b.closest(".codewrap").querySelector("code").innerText;
  navigator.clipboard?.writeText(t);
  const o=b.textContent; b.textContent="✓ copied"; setTimeout(()=>b.textContent=o,1200);
}

}

function taskCode(n){ return S.code[n]!==undefined ? S.code[n] : (TASKS[n]?TASKS[n].starter:""); }
function taskResults(n){
  const t=TASKS[n]; if(!t) return [];
  const raw=taskCode(n);
  const c=raw.replace(/\/\*[\s\S]*?\*\//g," ").replace(/\/\/[^\n]*/g," ");
  return t.checks.map(ch=>{ let ok=false; try{ ok=new RegExp(ch.r,ch.f||"").test(ch.raw?raw:c); }catch(e){ ok=false; }
    return ch.not ? !ok : ok; });
}
function taskScore(n){ const r=taskResults(n); return {ok:r.filter(Boolean).length,tot:r.length}; }
const taskDone = n => { const s=taskScore(n); return s.tot>0 && s.ok===s.tot; };

function mkOpts(key,opts,ans,ex){
  const wrap=el("div"); const o=el("div","opts");
  const expl=el("div","expl",'<b>Εξήγηση.</b> '+ex);
  opts.forEach((txt,i)=>{
    const b=el("button","opt",'<span class="ltr">'+"ABCD"[i]+"</span><span>"+txt+"</span>");
    b.onclick=()=>{
      if(S.ans[key]!==undefined) return;
      S.ans[key]=i;
      [...o.children].forEach((c,j)=>{ c.classList.add("locked");
        if(j===ans) c.classList.add("right");
        else if(j===i) c.classList.add("wrong");
        else c.classList.add("dim"); });
      expl.classList.add("show"); syncNav();
    };
    o.appendChild(b);
  });
  if(S.ans[key]!==undefined){
    [...o.children].forEach((c,j)=>{ c.classList.add("locked");
      if(j===ans)c.classList.add("right"); else if(j===S.ans[key])c.classList.add("wrong"); else c.classList.add("dim"); });
    expl.classList.add("show");
  }
  wrap.appendChild(o); wrap.appendChild(expl); return wrap;
}

function mkFill(dn,idx,f){
  const key="d"+dn+"f"+idx;
  if(!S.fill[key]) S.fill[key]=f.answers.map(()=>null);
  const st=S.fill[key];
  const q=el("div","q");
  q.innerHTML='<div class="qh"><span class="qn">✎</span><span class="qt">'+f.t+"</span></div>"+
    '<div style="color:var(--tx2);font-size:14px;margin-bottom:4px">'+f.desc+"</div>";
  const parts=f.code.split(/§(\d)§/);
  let html="";
  for(let i=0;i<parts.length;i++){
    if(i%2===0) html+=hl(parts[i],"csharp");
    else{ const gi=+parts[i];
      const v=st[gi];
      const cls="gap"+(v===null?"":(v===f.answers[gi]?" filled":" err"));
      html+='<span class="'+cls+'" data-g="'+gi+'">'+(v===null?"?":esc(v))+"</span>"; }
  }
  const cw=el("div","codewrap");
  cw.innerHTML='<div class="codehead"><span>συμπλήρωσε τα κενά</span></div><pre><code>'+html+"</code></pre>";
  q.appendChild(cw);
  const toks=el("div","tokens");
  f.tokens.forEach(t=>{ const b=el("button","tok"+(st.includes(t)?" used":""),esc(t));
    b.onclick=()=>{ const gi=st.indexOf(null); if(gi<0) return; st[gi]=t; refresh(); };
    toks.appendChild(b); });
  q.appendChild(toks);
  const row=el("div"); row.style.cssText="display:flex;gap:9px;margin-top:12px;align-items:center";
  const reset=el("button","btn ghost","Καθαρισμός");
  reset.onclick=()=>{ S.fill[key]=f.answers.map(()=>null); refresh(); };
  row.appendChild(reset);
  const status=el("span"); status.style.cssText="font-size:13px;color:var(--tx2)";
  const allFilled=st.every(x=>x!==null);
  const allRight=allFilled&&st.every((x,i)=>x===f.answers[i]);
  status.innerHTML = !allFilled ? "Πάτα τα tokens για να γεμίσεις τα κενά με τη σειρά." :
    allRight ? '<span style="color:var(--ok)">✓ Σωστά και τα '+st.length+"!</span>" :
               '<span style="color:var(--bad)">Κάτι δεν πάει καλά — τα κόκκινα είναι λάθος.</span>';
  row.appendChild(status); q.appendChild(row);
  const expl=el("div","expl"+(allRight?" show":""),'<b>Εξήγηση.</b> '+f.ex); q.appendChild(expl);
  function refresh(){ const p=q.parentNode; const n=mkFill(dn,idx,f); p.replaceChild(n,q); }
  return q;
}

  // ---- hints & solution ----
  const btns=el("div","taskbtns");
  const bHint=el("button","btn ghost","💡 Υπόδειξη ("+S.hint[d.n]+"/"+t.hints.length+")");
  const bSol=el("button","btn ghost",S.sol[d.n]?"Κρύψε τη λύση":"Δες τη λύση");
  btns.appendChild(bHint); btns.appendChild(bSol);
  m.appendChild(btns);

  const hintHost=el("div"); m.appendChild(hintHost);
  const solHost=el("div");  m.appendChild(solHost);

  function paintHints(){
    hintHost.innerHTML=t.hints.slice(0,S.hint[d.n])
      .map((h,i)=>'<div class="hintbox"><b>Υπόδειξη '+(i+1)+".</b> "+h+"</div>").join("");
    bHint.textContent="💡 Υπόδειξη ("+S.hint[d.n]+"/"+t.hints.length+")";
    if(S.hint[d.n]>=t.hints.length) bHint.style.opacity=.5;
  }
  function paintSol(){
    solHost.innerHTML = S.sol[d.n]
      ? '<div style="margin-top:14px">'+codeBlock({lang:"csharp",label:"λύση αναφοράς — "+t.title,ok:true,src:t.solution})+"</div>"
      : "";
    bSol.textContent = S.sol[d.n] ? "Κρύψε τη λύση" : "Δες τη λύση";
  }
  bHint.onclick=()=>{ if(S.hint[d.n]<t.hints.length){ S.hint[d.n]++; paintHints(); } };
  bSol.onclick=()=>{
    if(!S.sol[d.n] && !taskDone(d.n) && !confirm("Σίγουρα; Μαθαίνεις πολύ περισσότερα αν παλέψεις λίγο ακόμα — δοκίμασε πρώτα μια υπόδειξη.")) return;
    S.sol[d.n]=!S.sol[d.n]; paintSol();
  };
  paintHints(); paintSol();
}

/* ---------- exam ---------- */
function buildExam(){
  const pool=[];
  DAYS.forEach(d=>d.quiz.forEach((q,i)=>pool.push({...q,d:d.n,i})));
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  S.exam=pool.slice(0,25); S.examAns={};
}
function renderExam(m){
  m.appendChild(el("div","hero",'<div class="kicker">Τελική αξιολόγηση</div><h1>Τελικό τεστ</h1>'+
    '<p class="lead">25 τυχαίες ερωτήσεις από όλες τις ενότητες. Οι εξηγήσεις εμφανίζονται στο τέλος, όχι σε κάθε ερώτηση — όπως στην πραγματικότητα.</p>'));
  if(!S.exam){
    const b=el("button","btn","Ξεκίνα το τεστ →"); b.onclick=()=>{buildExam();render();};
    const c=el("div","card","<h3>Έτοιμος;</h3><p style='color:var(--tx2)'>Στόχος: <b>80%+</b>. Κάτω από 60% σημαίνει ότι θέλεις ακόμα μία πέραση στις ενότητες που σε δυσκόλεψαν.</p>");
    c.appendChild(b); m.appendChild(c); return;
  }
  const answered=Object.keys(S.examAns).length;
  S.exam.forEach((x,i)=>{
    const q=el("div","q");
    q.innerHTML='<div class="qh"><span class="qn">'+(i+1)+'</span><span class="qt">'+x.q+
      ' <span class="chip" style="margin-left:6px">D'+String(x.d).padStart(2,"0")+"</span></span></div>";
    const o=el("div","opts");
    x.opts.forEach((txt,j)=>{
      const b=el("button","opt",'<span class="ltr">'+"ABCD"[j]+"</span><span>"+txt+"</span>");
      const picked=S.examAns[i];
      if(picked!==undefined){
        b.classList.add("locked");
        if(answered===S.exam.length){ if(j===x.a)b.classList.add("right"); else if(j===picked)b.classList.add("wrong"); else b.classList.add("dim"); }
        else if(j===picked) b.style.borderColor="var(--acc)";
      }
      b.onclick=()=>{ if(S.examAns[i]!==undefined) return; S.examAns[i]=j; render(); };
      o.appendChild(b);
    });
    q.appendChild(o);
    if(answered===S.exam.length){
      const ok=S.examAns[i]===x.a;
      q.insertAdjacentHTML("beforeend",'<div class="expl show"><b>'+(ok?"✓ Σωστό.":"✕ Λάθος.")+"</b> "+x.ex+"</div>");
    }
    m.appendChild(q);
  });
  if(answered<S.exam.length){
    const bar=el("div","scorebar");
    bar.innerHTML="<b>"+answered+" / "+S.exam.length+"</b><span style='color:var(--tx2);font-size:13.5px'>Συνέχισε — το αποτέλεσμα βγαίνει στο τέλος.</span>";
    m.appendChild(bar);
  } else {
    const ok=S.exam.filter((x,i)=>S.examAns[i]===x.a).length;
    const pct=Math.round(ok/S.exam.length*100);
    const weak={};
    S.exam.forEach((x,i)=>{ if(S.examAns[i]!==x.a) weak[x.d]=(weak[x.d]||0)+1; });
    const wk=Object.entries(weak).sort((a,b)=>b[1]-a[1]).slice(0,3);
    const r=el("div","res "+(pct>=70?"pass":"fail"));
    r.innerHTML='<div class="big" style="color:'+(pct>=70?"var(--ok)":"var(--acc)")+'">'+pct+"%</div>"+
      "<p style='margin-top:10px;font-size:16px'>"+ok+" σωστές από "+S.exam.length+"</p>"+
      "<p style='color:var(--tx2)'>"+(pct>=85?"Εξαιρετικά — είσαι έτοιμος.":pct>=70?"Καλά. Ρίξε μια ματιά στις ενότητες παρακάτω και ξαναδοκίμασε.":"Χρειάζεσαι ακόμα μία πέραση. Ξεκίνα από τις ενότητες παρακάτω.")+"</p>"+
      (wk.length?'<p style="margin-top:12px;font-size:13.5px;color:var(--tx2)">Αδύναμα σημεία: '+
        wk.map(([d,c])=>'<span class="chip acc" style="cursor:pointer" onclick="go({t:\'day\',n:'+d+'})">Day '+String(d).padStart(2,"0")+" · "+c+" λάθη</span>").join(" ")+"</p>":"");
    const b=el("button","btn","Νέο τεστ"); b.style.marginTop="16px";
    b.onclick=()=>{buildExam();render();}; r.appendChild(b);
    m.appendChild(r);
  }
}

  const strip=h=>String(h).replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();
  DAYS.forEach(d=>{
    d.concepts.forEach(c=>INDEX.push({d:d.n,tab:"c",k:"Θεωρία",t:strip(c.t),p:strip(c.html||"")+" "+(c.code?c.code.src:"")}));
    d.pitfalls.forEach(p=>INDEX.push({d:d.n,tab:"p",k:"Παγίδα",t:strip(p.t),p:strip(p.why)+" "+p.bad+" "+p.good}));
    d.quiz.forEach(q=>INDEX.push({d:d.n,tab:"q",k:"Quiz",t:strip(q.q),p:strip(q.ex)}));
    d.cards.forEach(([f,b])=>INDEX.push({d:d.n,tab:"f",k:"Flashcard",t:strip(f),p:strip(b)}));
    d.iv.forEach(([q,a])=>INDEX.push({d:d.n,tab:"i",k:"Interview",t:strip(q),p:strip(a)}));
    d.drills.forEach(x=>INDEX.push({d:d.n,tab:"e",k:"Άσκηση",t:strip(x.t)+" — "+strip(x.q),p:strip(x.ex)+" "+x.code}));
  });
}
function renderSearch(m){
  const q=(S.view.q||"").toLowerCase().trim();
  m.appendChild(el("div","hero",'<div class="kicker">Αναζήτηση</div><h1>«'+esc(S.view.q)+"»</h1>"));
  if(q.length<2){ m.appendChild(el("div","empty","Γράψε τουλάχιστον 2 χαρακτήρες.")); return; }
  if(!INDEX) buildIndex();
  const res=INDEX.filter(x=>(x.t+" "+x.p).toLowerCase().includes(q)).slice(0,40);
  if(!res.length){ m.appendChild(el("div","empty","Καμία αντιστοίχιση. Δοκίμασε αγγλικό όρο — π.χ. <code>Scoped</code>, <code>LINQ</code>, <code>decorator</code>.")); return; }
  m.appendChild(el("p","lead",res.length+" αποτελέσματα"));
  res.forEach(x=>{
    const idx=x.p.toLowerCase().indexOf(q);
    const prev=idx<0? x.p.slice(0,150) : x.p.slice(Math.max(0,idx-60),idx+110);
    const it=el("div","srch-item",
      '<div class="where">Day '+String(x.d).padStart(2,"0")+" · "+x.k+"</div>"+
      '<div class="what">'+esc(x.t)+"</div>"+
      '<div class="prev">…'+esc(prev)+"…</div>");
    it.onclick=()=>{ S.tab[x.d]=x.tab; go({t:"day",n:x.d}); };
    m.appendChild(it);
  });
}

/* ---------- boot ---------- */
buildNav(); render();
const si=$("#search");
let sT;
si.addEventListener("input",e=>{
  clearTimeout(sT);
  const v=e.target.value;
  sT=setTimeout(()=>{ if(v.trim().length===0){ if(S.view.t==="search") go({t:"home"}); return; } go({t:"search",q:v}); },220);
});
document.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){ e.preventDefault(); si.focus(); si.select(); }
  if(e.key==="Escape"&&document.activeElement===si){ si.blur(); }
  if(e.key!=="ArrowLeft" && e.key!=="ArrowRight") return;
  if(e.ctrlKey||e.metaKey||e.altKey||e.shiftKey) return;
  // Ποτέ πλοήγηση όσο γράφει ο χρήστης σε πεδίο κειμένου
  const ae=document.activeElement;
  if(ae && (ae.tagName==="INPUT" || ae.tagName==="TEXTAREA" || ae.isContentEditable)) return;
  // Ούτε στην καρτέλα Εργασία — εκεί τα βελάκια ανήκουν στον editor
  if(S.view.t!=="day" || S.tab[S.view.n]==="t") return;
  if(e.key==="ArrowRight"&&S.view.n<9) go({t:"day",n:S.view.n+1});
  if(e.key==="ArrowLeft"&&S.view.n>1)  go({t:"day",n:S.view.n-1});
});
</script>
