<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Novibet .NET Academy — Τεστ Ύλης (Days 1–9)</title>
<style>
  :root { --green:#16a34a; --red:#dc2626; --blue:#2563eb; --bg:#f8fafc; --card:#ffffff; --border:#e2e8f0; --text:#0f172a; --muted:#64748b; }
  * { box-sizing:border-box; }
  body { font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); margin:0; padding:24px; }
  .wrap { max-width:860px; margin:0 auto; }
  h1 { font-size:1.6rem; margin:0 0 4px; }
  .sub { color:var(--muted); margin-bottom:20px; }
  .day-header { background:var(--blue); color:#fff; padding:10px 16px; border-radius:10px; margin:32px 0 12px; font-weight:600; font-size:1.05rem; }
  .q { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px 18px; margin-bottom:12px; }
  .q-text { font-weight:600; margin-bottom:10px; }
  .def-tag { color:#1d4ed8; font-weight:900; font-size:.72rem; letter-spacing:.08em; background:#dbeafe; border:1px solid #93c5fd; padding:2px 7px; border-radius:6px; vertical-align:middle; }
  .q-text code, .opt code { background:#f1f5f9; padding:1px 5px; border-radius:4px; font-size:.9em; }
  .q-text pre { background:#0f172a; color:#e2e8f0; padding:12px 14px; border-radius:8px; overflow-x:auto; font-size:.85rem; font-weight:400; line-height:1.5; }
  .opt { display:block; padding:8px 12px; margin:6px 0; border:1px solid var(--border); border-radius:8px; cursor:pointer; transition:background .15s; }
  .opt:hover { background:#f1f5f9; }
  .opt input { margin-right:8px; }
  .q.correct { border-left:5px solid var(--green); }
  .q.wrong { border-left:5px solid var(--red); }
  .q.unanswered { border-left:5px solid #f59e0b; }
  .opt.right { background:#dcfce7; border-color:var(--green); }
  .opt.picked-wrong { background:#fee2e2; border-color:var(--red); }
  .exp { display:none; margin-top:10px; padding:10px 12px; background:#eff6ff; border-radius:8px; font-size:.92rem; color:#1e3a5f; }
  .graded .exp { display:block; }
  .toolbar { position:sticky; top:0; z-index:10; background:var(--bg); padding:10px 0; display:flex; gap:12px; align-items:center; border-bottom:1px solid var(--border); margin-bottom:10px; }
  button { background:var(--blue); color:#fff; border:none; padding:10px 22px; border-radius:8px; font-size:1rem; font-weight:600; cursor:pointer; }
  button:hover { opacity:.9; }
  button.secondary { background:#fff; color:var(--blue); border:1px solid var(--blue); }
  #progress { color:var(--muted); font-size:.9rem; margin-left:auto; }
  #result { display:none; background:var(--card); border:2px solid var(--blue); border-radius:12px; padding:20px; margin:20px 0; }
  #result h2 { margin:0 0 10px; }
  .daybar { display:flex; align-items:center; gap:10px; margin:4px 0; font-size:.9rem; }
  .daybar .label { width:200px; }
  .daybar .track { flex:1; background:#e2e8f0; border-radius:6px; height:12px; overflow:hidden; }
  .daybar .fill { height:100%; background:var(--green); }
  .big { font-size:2rem; font-weight:700; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Novibet .NET Academy — Τεστ Ύλης</h1>
  <div class="sub">Days 1–9 · Κάθε απάντηση βαθμολογείται αμέσως. &nbsp;🆘 = πολύ σημαντική ερώτηση &nbsp;·&nbsp; <span style="color:#dc2626;font-weight:800;">❗</span> = ερώτηση-παγίδα, διάβασέ την προσεκτικά &nbsp;·&nbsp; <span class="def-tag">ΟΡΙΣΜΟΣ</span> = ερώτηση ορισμού («τι είναι…»).</div>
  <div class="toolbar">
    <button id="gradeBtn" onclick="grade()">Βαθμολόγηση</button>
    <button class="secondary" onclick="resetQuiz()">Καθαρισμός</button>
    <select id="filter" onchange="setFilter(this.value)" style="padding:9px 10px;border-radius:8px;border:1px solid var(--border);font-size:.95rem;">
      <option value="all">Όλες οι ερωτήσεις</option>
      <option value="def">Μόνο ΟΡΙΣΜΟΙ</option>
      <option value="star">Μόνο 🆘 σημαντικές</option>
      <option value="trap">Μόνο ❗ παγίδες</option>
    </select>
    <span id="progress"></span>
  </div>
  <div id="result"></div>
  <div id="quiz"></div>
  <div style="text-align:center;margin:24px 0;"><button onclick="grade();window.scrollTo({top:0,behavior:'smooth'})">Βαθμολόγηση</button></div>
</div>
<script>
const DAY_NAMES = {
  1:"Day 01 — C# Basics", 2:"Day 02 — OOP, Collections, LINQ, Records, Tasks",
  3:"Day 03 — Error Handling, Logging & Debugging", 4:"Day 04 — Clean Architecture, DDD & Patterns",
  5:"Day 05 — SQL, Dapper & EF Core", 6:"Day 06 — HTTP, REST & Caching",
  7:"Day 07 — CQRS, MediatR, Autofac, Decorator, KISS/YAGNI", 8:"Day 08 — HTTP Clients, Polly, Quartz & External APIs",
  9:"Day 09 — Unit & Integration Testing"
};
const Q = [
// ---------- DAY 1 ----------
{d:1,s:1,q:"<code>int a = 5; int b = a; b = 10;</code> — ποια είναι η τιμή του <code>a</code>;",o:["10, γιατί b και a δείχνουν στο ίδιο σημείο","5, γιατί τα value types αντιγράφονται στο assignment","0, γιατί το a επανεκκινείται","Compile error"],a:1,e:"Τα value types αποθηκεύονται στο stack και στο assignment αντιγράφεται η τιμή — το a μένει 5."},
{d:1,q:"<code>var p2 = p1; p2.Name = \"Bob\";</code> όπου Player είναι class. Τι ισχύει για το <code>p1.Name</code>;",o:["Μένει ίδιο — έγινε αντίγραφο","Γίνεται null","Γίνεται επίσης \"Bob\" — ίδιο αντικείμενο στο heap","Εξαρτάται από τον constructor"],a:2,e:"Στα reference types το assignment αντιγράφει το reference — p1 και p2 δείχνουν στο ίδιο αντικείμενο."},
{d:1,q:"Ποιο από τα παρακάτω είναι value type;",o:["string","List<T>","delegate","DateTime"],a:3,e:"DateTime, Guid, int, struct, enum είναι value types. string, List<T>, delegate είναι reference types."},
{d:1,q:"Ποια types καθαρίζονται από τον Garbage Collector;",o:["Τα reference types στο heap","Τα value types στο stack","Όλα τα types","Μόνο τα structs"],a:0,e:"Ο GC διαχειρίζεται το heap — τα value types στο stack δεν τον αφορούν."},
{d:1,q:"Σε property <code>Score { get; private set; }</code>, ποιος μπορεί να θέσει τιμή;",o:["Οποιοσδήποτε έχει πρόσβαση στο αντικείμενο","Μόνο η ίδια η κλάση","Μόνο ο constructor","Κανείς — είναι read-only"],a:1,e:"private set = εγγραφή μόνο μέσα από την ίδια την κλάση. Το σκέτο { get; } τίθεται μόνο στον constructor."},
{d:1,q:"Ποιος είναι ο προτιμώμενος «μοντέρνος» τρόπος για πολλαπλές διακλαδώσεις βάσει τιμής (C# 8+);",o:["Αλυσίδα από if/else if","switch statement με break","switch expression με patterns (π.χ. < 1000 =>)","goto labels"],a:2,e:"Το switch expression είναι πιο εκφραστικό: score switch { 0 => ..., < 1000 => ..., _ => ... }."},
{d:1,q:"Ποια collection προσφέρει O(1) lookup με key;",o:["List<T>","Array","Queue<T>","Dictionary<TKey,TValue>"],a:3,e:"Το Dictionary κάνει O(1) lookup by key (TryGetValue). Η List θέλει διάσχιση."},
{d:1,q:"Τι κάνει ο τελεστής <code>??</code>;",o:["Null-coalescing: επιστρέφει τη δεξιά τιμή αν η αριστερή είναι null","Null-conditional: παρακάμπτει την κλήση αν είναι null","Ελέγχει ισότητα με null","Μετατρέπει value type σε nullable"],a:0,e:"int value = score ?? 0; — αν το score είναι null, χρησιμοποιείται το 0. Το ?. είναι το null-conditional."},
{d:1,q:"Γιατί το <code>==</code> σε reference types είναι συνηθισμένο λάθος;",o:["Δεν κάνει compile","Συγκρίνει references, όχι περιεχόμενο","Είναι πιο αργό από το Equals","Κάνει boxing"],a:1,e:"Συγκρίνει αν είναι το ίδιο αντικείμενο στη μνήμη — για σύγκριση τιμών χρειάζεται .Equals() ή override."},
{d:1,q:"Ποια είναι η σωστή Git πρακτική στο Academy;",o:["Commit απευθείας στο main για ταχύτητα","Feature branch → commit → push → Pull Request → review → merge","Ένα branch ανά ημέρα, merge χωρίς review","Force push στο main"],a:1,e:"Το main είναι το source of truth — ποτέ απευθείας commit. Δουλεύεις σε feature branch και ανοίγεις PR."},
{d:1,q:"Τι πρέπει να κάνεις με τους φακέλους <code>bin/</code> και <code>obj/</code>;",o:["Να τους κάνεις commit για backup","Να τους σβήνεις πριν από κάθε build","Να τους εξαιρέσεις με .gitignore — ποτέ commit build output","Να τους μετονομάσεις"],a:2,e:"Build output δεν μπαίνει ποτέ στο repo — χρησιμοποίησε το dotnet gitignore template."},
// ---------- DAY 2 ----------
{d:2,q:"Ο <code>protected</code> access modifier επιτρέπει πρόσβαση από:",o:["Οποιαδήποτε κλάση","Την ίδια κλάση και τις κληρονόμους της","Μόνο το ίδιο assembly","Μόνο την ίδια κλάση"],a:1,e:"protected = ίδια κλάση + derived classes. private = μόνο ίδια κλάση, internal = ίδιο assembly."},
{d:2,q:"Τι σημαίνει <code>sealed</code> σε μια κλάση;",o:["Δεν μπορεί να γίνει instantiate","Δεν μπορεί να κληρονομηθεί","Είναι immutable","Είναι static"],a:1,e:"sealed = απαγορεύεται η κληρονομικότητα από αυτή την κλάση."},
{d:2,q:"Επιτρέπεται multiple inheritance κλάσεων στη C#;",o:["Ναι, χωρίς περιορισμό","Ναι, μέχρι δύο βάσεις","Όχι — μία base class, αλλά πολλά interfaces","Όχι — ούτε interfaces"],a:2,e:"Κάθε κλάση κληρονομεί από ΜΙΑ μόνο κλάση· «πολλαπλή κληρονομικότητα» επιτυγχάνεται με πολλά interfaces."},
{d:2,s:1,q:"Πότε προτιμάς abstract class αντί για interface;",o:["Όταν θες μόνο ένα contract","Όταν θες κοινή βασική υλοποίηση / default implementations / shared data","Όταν θες multiple inheritance","Πάντα — είναι νεότερο feature"],a:1,e:"Abstract class = μερικό blueprint με κοινή υλοποίηση. Interface = καθαρό contract + στήριξη πολλαπλής υλοποίησης."},
{d:2,t:1,q:"Το <code>decimal? amount</code> (Nullable&lt;T&gt;) είναι:",o:["Reference type αφού δέχεται null","Struct — παραμένει value type με HasValue/Value","Boxed int","Alias του object"],a:1,e:"Το Nullable<T> είναι struct που τυλίγει την τιμή — παραμένει value type παρότι δέχεται null."},
{d:2,def:1,q:"Τι είναι το boxing;",o:["Μετατροπή reference type σε value type","Μετατροπή value type σε reference type (object)","Συμπίεση συλλογής","Το wrapping του Nullable"],a:1,e:"Boxing: value type → object. Οι παλιές non-generic collections (ArrayList, Hashtable) κάνουν boxing — γι' αυτό χρησιμοποιούμε τις generic."},
{d:2,t:1,q:"Τι επιστρέφει η <code>FirstOrDefault()</code> σε άδεια λίστα από ints;",o:["Πετάει InvalidOperationException","null","0 — το default(int)","-1"],a:2,e:"FirstOrDefault επιστρέφει default(T): 0 για int, null για reference types. Η First() θα πετούσε exception."},
{d:2,t:1,q:"Πότε πετάει exception η <code>Single()</code>;",o:["Μόνο σε άδεια ακολουθία","Μόνο αν υπάρχουν πολλά matches","Αν υπάρχουν 0 Ή περισσότερα από 1 matches","Ποτέ"],a:2,e:"Single = «ακριβώς ένα» — πετάει και για κανένα και για πολλαπλά matches."},
{d:2,q:"Ποια είναι η διαφορά <code>Select</code> και <code>SelectMany</code>;",o:["Καμία — synonyms","Select φιλτράρει, SelectMany μετασχηματίζει","Select κάνει projection 1-προς-1, SelectMany κάνει projection και «ισοπεδώνει» τις ακολουθίες σε μία","SelectMany είναι async"],a:2,e:"SelectMany: κάθε στοιχείο δίνει ακολουθία και όλες ενώνονται σε ένα flat stream. Το φιλτράρισμα το κάνει το Where."},
{d:2,q:"Τι επιστρέφει το <code>GroupBy</code>;",o:["Dictionary<TKey, List<T>>","IEnumerable<IGrouping<TKey,TElement>> — κάθε group έχει .Key και τα στοιχεία του","List<TKey>","Lookup μόνο με keys"],a:1,e:"Κάθε IGrouping είναι το ίδιο IEnumerable των στοιχείων του και κουβαλά και το .Key."},
{d:2,def:1,s:1,q:"Τι σημαίνει deferred execution στο LINQ;",o:["Το query τρέχει σε background thread","Το query τρέχει μόνο όταν γίνει enumerate (π.χ. ToList/foreach) — μέχρι τότε είναι σχέδιο","Το query κασάρεται αυτόματα","Τα αποτελέσματα έρχονται με delay"],a:1,e:"Η έκφραση χτίζει ένα πλάνο· τίποτα δεν αγγίζει τα δεδομένα μέχρι να ζητηθούν αποτελέσματα."},
{d:2,q:"Δύο records με ακριβώς ίδια περιεχόμενα είναι:",o:["Ίσα — τα records έχουν value equality","Άνισα — είναι διαφορετικά references","Ίσα μόνο αν κάνεις override Equals","Ίσα μόνο αν είναι structs"],a:0,e:"Αυτή είναι η μεγάλη διαφορά record vs class: ισότητα βάσει περιεχομένου. Κανόνας: record για data, class για behaviour."},
{d:2,q:"Τι πρόβλημα λύνει το Task με async/await;",o:["Κάνει τον κώδικα να τρέχει παράλληλα σε πολλά cores","Δεν κρατά «όμηρο» thread όσο περιμένουμε I/O — το thread επιστρέφει στο pool","Αποφεύγει τα exceptions","Επιταχύνει το I/O"],a:1,e:"Το async operation επιστρέφει Task αμέσως και απελευθερώνει το thread· η συνέχεια προγραμματίζεται όταν ολοκληρωθεί το I/O."},
// ---------- DAY 3 ----------
{d:3,def:1,q:"Τι είναι τα guard clauses;",o:["try/catch γύρω από κάθε γραμμή","Έλεγχοι που απορρίπτουν νωρίς, ώστε το happy path να μένει flat και τελευταίο","Nested if για κάθε συνθήκη","Validation μέσα στο catch"],a:1,e:"Αντί για «pyramid of doom» με nested ifs, κάνεις reject νωρίς με early returns."},
{d:3,q:"Ο χρήστης ζητά ανάληψη κάτω από το ελάχιστο όριο. Τι κάνεις;",o:["throw InvalidOperationException","throw custom DomainException","Επιστρέφεις validation result/μήνυμα — είναι αναμενόμενο & ανακτήσιμο","Log Error και συνεχίζεις"],a:2,e:"Validated path: αναμενόμενο λάθος input → return result. Exceptions για κοινό validation = control-flow abuse."},
{d:3,q:"Ανάληψη σε λογαριασμό που δεν υπάρχει καν στο σύστημα. Τι ταιριάζει;",o:["Return null σιωπηλά","throw — παραβιάστηκε invariant του συστήματος (π.χ. InvalidOperationException)","Console.WriteLine","Retry 3 φορές"],a:1,e:"Exceptional path: το πρόβλημα είναι στο σύστημα, όχι στο input του χρήστη — throw."},
{d:3,s:1,q:"Ποια η διαφορά <code>throw;</code> και <code>throw ex;</code> μέσα σε catch;",o:["Καμία","throw ex; είναι πιο σαφές","throw; διατηρεί το αρχικό stack trace, throw ex; το μηδενίζει","throw; ξαναεκτελεί το try"],a:2,e:"Πάντα throw; — το throw ex; χάνει το πραγματικό σημείο του σφάλματος."},
{d:3,q:"Γιατί το άδειο <code>catch (Exception) { }</code> είναι χειρότερο κι από crash;",o:["Είναι πιο αργό","Το bug «καταπίνεται» σιωπηλά — κανείς δεν μαθαίνει ότι κάτι χάλασε","Προκαλεί memory leak","Μπλοκάρει το thread"],a:1,e:"Το swallow κρύβει το πρόβλημα που θα σε ξυπνήσει στις 3 τα ξημερώματα — χωρίς κανένα ίχνος."},
{d:3,q:"Πολλά παράλληλα tasks απέτυχαν με <code>Task.WaitAll</code>. Πού βλέπεις ΟΛΑ τα σφάλματα;",o:["AggregateException.InnerException","AggregateException.InnerExceptions (πληθυντικός)","Task.Exception.Message","Στο console"],a:1,e:"InnerException = μόνο το πρώτο· InnerExceptions = συλλογή με όλα. Το await Task.WhenAll κάνει unwrap μόνο το πρώτο."},
{d:3,s:1,q:"Ποιο logging είναι σωστό structured logging;",o:["logger.LogInformation($\"Deposit {amount} for {id}\")","Console.WriteLine(amount)","logger.LogInformation(\"Deposit {Amount} for {AccountId}\", amount, id)","logger.LogInformation(amount + \" \" + id)"],a:2,e:"Named properties ({Amount}) γίνονται queryable πεδία στο Kibana. Το interpolated string είναι ένα αδιαφανές κείμενο."},
{d:3,q:"Ποια είναι η σωστή σειρά log levels (αύξουσα σοβαρότητα);",o:["Debug → Trace → Info → Error → Warning → Critical","Trace → Debug → Information → Warning → Error → Critical","Info → Debug → Trace → Warning → Critical → Error","Trace → Info → Debug → Error → Warning → Critical"],a:1,e:"Trace → Debug → Information → Warning → Error → Critical."},
{d:3,q:"Στο NLog, τι ορίζει το «target»;",o:["Το πού πάνε τα logs (console, file, Kibana...)","Το format κάθε γραμμής","Το ελάχιστο level","Το namespace"],a:0,e:"Target = προορισμός, Layout = μορφή γραμμής, Rules = ποιο level δρομολογείται πού. Ο κώδικας βλέπει μόνο ILogger<T>."},
{d:3,q:"Σε wrapped exception (π.χ. DepositFailedException με InnerException), τι διαβάζεις πρώτα;",o:["Το outer — δείχνει την αιτία","Το inner — το outer λέει το business operation, το inner το ΓΙΑΤΙ","Το stack trace του outer μόνο","Το message του logger"],a:1,e:"Πάντα inner πρώτα: εκεί είναι η πραγματική αιτία (π.χ. KeyNotFoundException για το BTC rate)."},
{d:3,q:"Θες breakpoint που σταματά μόνο όταν <code>fromCurrency == \"BTC\"</code>. Τι χρησιμοποιείς;",o:["Hit-count breakpoint","Conditional breakpoint","Step Into","Watch window"],a:1,e:"Conditional breakpoint = συνθήκη σε τιμή. Hit-count = σταματά στο Ν-οστό πέρασμα."},
// ---------- DAY 4 ----------
{d:4,s:1,q:"Ποιο layer πρέπει να έχει ΜΗΔΕΝ εξωτερικά dependencies (ούτε NuGet);",o:["Application","Infrastructure","Domain","API"],a:2,e:"Το Domain περιέχει entities, value objects, domain exceptions — κανένα framework dependency."},
{d:4,q:"Πού ζουν τα repository interfaces (π.χ. IWalletRepository);",o:["Domain","Application","Infrastructure","API"],a:1,e:"Τα interfaces στο Application· οι υλοποιήσεις τους (EfWalletRepository) στο Infrastructure."},
{d:4,q:"Πού ανήκει το <code>EfWalletRepository</code>;",o:["Infrastructure — υλοποιεί interface του Application με EF Core","Application","Domain","API"],a:0,e:"EF Core, HTTP clients, external APIs = Infrastructure concerns."},
{d:4,s:1,q:"Ποια είναι η #1 παραβίαση του Dependency Rule;",o:["API → Infrastructure","Application → Infrastructure","Infrastructure → Domain","API → Application"],a:1,e:"Το Application αναφέρεται ΜΟΝΟ στο Domain. Τα βέλη πάνε μόνο προς τα μέσα."},
{d:4,q:"Πού είναι το μόνο σημείο όπου επιτρέπεται το <code>new()</code> για services;",o:["Σε κάθε controller","Στο Composition Root (Program.cs)","Στα repositories","Στο Domain"],a:1,e:"Όλο το object graph συναρμολογείται σε ένα σημείο· κάθε άλλη κλάση δηλώνει τις ανάγκες της στον constructor."},
{d:4,def:1,q:"Τι χαρακτηρίζει ένα Value Object στο DDD;",o:["Έχει Id και είναι mutable","Δεν έχει identity, είναι immutable, ίσο αν όλα τα fields ίδια","Είναι πάντα database table","Είναι singleton"],a:1,e:"π.χ. Money(Amount, Currency). Το Entity αντίθετα έχει Id, είναι mutable, και ισότητα βάσει Id."},
{d:4,def:1,q:"Τι ρόλο έχει το aggregate root;",o:["Είναι το μεγαλύτερο entity","Επιβάλλει τα invariants και όλα τα children αλλάζουν ΜΟΝΟ μέσω αυτού","Κρατά το connection string","Είναι το base class όλων"],a:1,e:"π.χ. το Wallet (root) φυλάει το Balance — ποτέ δεν αλλάζεις child entity απευθείας."},
{d:4,s:1,q:"Με ποιο lifetime κάνεις register τον DbContext;",o:["Singleton — για performance","Transient — για ασφάλεια","Scoped — ένα ανά HTTP request","Static"],a:2,e:"Ο change tracker ΔΕΝ είναι thread-safe· ως Singleton δύο users μοιράζονται context και διαρρέουν δεδομένα."},
{d:4,def:1,s:1,q:"Τι είναι το «captive dependency»;",o:["Dependency σε κυκλική αναφορά","Singleton που κρατά Scoped dependency — την παγώνει για όλη τη ζωή της εφαρμογής","Transient μέσα σε Transient","Interface χωρίς υλοποίηση"],a:1,e:"Μεγαλύτερης διάρκειας service δεν πρέπει ΠΟΤΕ να κρατά μικρότερης — π.χ. Singleton Reporter με Scoped DbContext."},
{d:4,s:1,q:"Ο Polly circuit breaker κάνει register ως:",o:["Transient","Scoped","Singleton — το state (failures) πρέπει να μοιράζεται","Οποιοδήποτε"],a:2,e:"Ως Transient αναδημιουργείται σε κάθε κλήση, ξεχνά τα failures και δεν ανοίγει ποτέ το κύκλωμα."},
{d:4,q:"Στο Strategy pattern, πού ζει το guard που εμποδίζει αρνητικό balance;",o:["Μέσα στο strategy","Στο domain method (π.χ. Wallet.SubtractFunds)","Στον controller","Στο DI container"],a:1,e:"Το strategy απλώς επιλέγει ΠΟΙΟ domain method καλείται — τα invariants ζουν στο domain."},
{d:4,q:"Προσθέτεις νέο strategy (π.χ. BonusMultiplier). Τι αλλάζει στον υπάρχοντα κώδικα;",o:["Ο service και το menu","Μόνο μία νέα κλάση + μία γραμμή wiring — τίποτα άλλο (Open/Closed)","Το interface","Ο controller και το service"],a:1,e:"Open/Closed Principle: ανοιχτό σε επέκταση, κλειστό σε τροποποίηση — ο service βλέπει μόνο IFundsStrategy."},
{d:4,q:"Τι πρόβλημα έχει το Service Locator (π.χ. <code>ServiceLocator.Get&lt;IRepo&gt;()</code>);",o:["Είναι αργό","Κρύβει το dependency και αποτυγχάνει στο runtime αντί στο compile time","Δεν δουλεύει με interfaces","Θέλει Autofac"],a:1,e:"Οι εξαρτήσεις πρέπει να είναι ρητές στον constructor — όχι κρυμμένες κλήσεις σε global locator."},
{d:4,def:1,q:"Τι λέει το Interface Segregation Principle;",o:["Κάθε interface σε δικό του αρχείο","Μικρά, focused interfaces — καμία κλάση δεν εξαρτάται από methods που δεν καλεί","Ένα interface ανά project","Interfaces μόνο στο Domain"],a:1,e:"Το «I» του SOLID: σπας το fat interface (π.χ. σε IPlayerReader / IPlayerWriter)."},
// ---------- DAY 5 ----------
{d:5,def:1,q:"Τι ισχύει για το clustered index;",o:["Μπορείς να έχεις πολλά ανά table","Ορίζει τη φυσική σειρά αποθήκευσης — ένα ανά table, συνήθως το PK","Είναι πάντα πιο αργό από non-clustered","Δεν επιτρέπει duplicates στις άλλες στήλες"],a:1,e:"Clustered: το table ΕΙΝΑΙ το index. Non-clustered: ξεχωριστή δομή + pointer, πολλά ανά table."},
{d:5,q:"Ποιο είναι το κόστος των indexes;",o:["Πιο αργά SELECT","Πιο αργά INSERT/UPDATE/DELETE — κάθε index πρέπει να ενημερωθεί","Περισσότερα locks","Κανένα"],a:1,e:"Index στα read-heavy paths, προσοχή στα write-heavy — κάθε γράψιμο ενημερώνει και τα indexes."},
{d:5,s:1,q:"Εταιρεία χωρίς κανένα αυτοκίνητο. Με ποιο JOIN εμφανίζεται στο αποτέλεσμα;",o:["INNER JOIN","LEFT JOIN — με NULL στο Model","Και με τα δύο","Με κανένα"],a:1,e:"INNER = μόνο matches (η εταιρεία εξαφανίζεται). LEFT = όλα τα αριστερά + NULL όπου δεν υπάρχει match."},
{d:5,s:1,q:"Ποια η διαφορά WHERE και HAVING;",o:["Καμία","WHERE φιλτράρει γραμμές ΠΡΙΝ το grouping, HAVING φιλτράρει groups ΜΕΤΑ το aggregation","HAVING είναι πιο γρήγορο","WHERE δουλεύει μόνο με indexes"],a:1,e:"π.χ. HAVING COUNT(*) > 1 φιλτράρει βάσει aggregate — αδύνατο με WHERE."},
{d:5,q:"Τι κάνει το <code>UPDATE Companies SET Name='X'</code> ΧΩΡΙΣ WHERE;",o:["Σφάλμα σύνταξης","Ενημερώνει την πρώτη γραμμή","Μετονομάζει ΟΛΕΣ τις εταιρείες","Τίποτα"],a:2,e:"UPDATE/DELETE χωρίς WHERE αγγίζουν κάθε γραμμή — τρέξε πρώτα SELECT με το ίδιο WHERE για preview."},
{d:5,q:"Τι κάνει το MERGE;",o:["Ενώνει δύο tables μόνιμα","Atomic upsert: WHEN MATCHED → UPDATE, WHEN NOT MATCHED → INSERT, σε ένα statement","Συγχωνεύει transactions","Κάνει backup"],a:1,e:"Ένα statement, δύο μονοπάτια — το χρησιμοποιεί και το periodic job του capstone."},
{d:5,q:"Σε transaction με TRY/CATCH, τι κάνει το ROLLBACK;",o:["Αναιρεί ΟΛΕΣ τις αλλαγές του transaction","Αναιρεί μόνο την τελευταία εντολή","Κλείνει το connection","Επανεκκινεί το transaction"],a:0,e:"Atomicity: όλα γίνονται commit μαζί ή τίποτα."},
{d:5,def:1,q:"Ποιο περιγράφει σωστά το Dapper;",o:["Full ORM — γράφει το SQL για σένα","Micro-ORM — γράφεις εσύ το SQL, κάνει το mapping σε objects","Database engine","LINQ provider"],a:1,e:"Λεπτό, γρήγορο στρώμα πάνω από το ADO.NET — πλήρης έλεγχος του query, χωρίς change tracking."},
{d:5,s:1,q:"Πότε προτιμάς Dapper έναντι EF Core;",o:["Σε CRUD-heavy domain models","Σε hot paths, complex queries και reports όπου θες έλεγχο & ταχύτητα","Όταν θες migrations","Όταν θες change tracking"],a:1,e:"EF Core για το domain model & CRUD, Dapper για hot paths — στην πράξη και τα δύο."},
{d:5,q:"Τι κάνει το <code>AsNoTracking()</code>;",o:["Απενεργοποιεί το logging","Παρακάμπτει τον change tracker σε read-only queries — ταχύτερο","Αποτρέπει SQL injection","Κάνει το query synchronous"],a:1,e:"Για αναγνώσεις που δεν θα αποθηκευτούν, δεν χρειάζεται tracking."},
{d:5,q:"Πότε τρέχει το SQL σε ένα IQueryable pipeline;",o:["Μόλις γράψεις το Where","Στο ToListAsync/ToArrayAsync — στο materialisation","Στο compile","Σε κάθε γραμμή ξεχωριστά"],a:1,e:"Το IQueryable χτίζει expression tree (deferred)· μπορείς να προσθέτεις φίλτρα υπό συνθήκη πριν τρέξει — ένα SQL query στο τέλος."},
{d:5,q:"Πολλές αλλαγές σε entities και ΕΝΑ SaveChanges. Τι ισχύει;",o:["Κάθε αλλαγή σε δικό της transaction","Όλες σε ένα transaction — όλες ή καμία","Μόνο η πρώτη σώζεται","Χρειάζεται χειροκίνητο BEGIN TRAN"],a:1,e:"Ένα SaveChanges = ένα transaction. Ο tracker κάνει diff (Added/Modified/Deleted) και παράγει το SQL."},
{d:5,s:1,q:"Πώς προστατεύεσαι από SQL injection;",o:["Escaping με replace","Parameterized queries (@param) — ποτέ string concatenation","Μόνο stored procedures","Validation στο UI"],a:1,e:"Τα parameters δεσμεύονται ξεχωριστά από το SQL — ισχύει σε raw SQL, Dapper και παντού."},
{d:5,def:1,q:"Τι είναι ένα EF Core migration;",o:["Μεταφορά δεδομένων μεταξύ servers","Versioned diff του μοντέλου — Up()/Down() που εφαρμόζονται στη βάση","Backup της βάσης","Το scaffolding"],a:1,e:"Add-Migration δημιουργεί το diff, Update-Database το εφαρμόζει, Script-Migration βγάζει SQL για review."},
// ---------- DAY 6 ----------
{d:6,def:1,s:1,q:"Ποια HTTP verbs είναι idempotent;",o:["GET, POST, PUT","GET, PUT, DELETE","POST, PATCH","Όλα"],a:1,e:"Idempotent = N κλήσεις έχουν το ίδιο αποτέλεσμα με 1. POST και PATCH δεν είναι."},
{d:6,def:1,t:1,q:"Τι σημαίνει «safe» HTTP verb;",o:["Χρησιμοποιεί HTTPS","Δεν έχει side effects στον server — μόνο το GET","Δεν επιστρέφει errors","Έχει authentication"],a:1,e:"Safe = καμία αλλαγή στον server. Μόνο το GET από τα βασικά verbs."},
{d:6,q:"Επιτυχές POST που δημιουργεί resource επιστρέφει:",o:["200 OK","201 Created + Location header","204 No Content","202 Accepted"],a:1,e:"201 με Location header που δείχνει το νέο resource (CreatedAtAction)."},
{d:6,q:"Επιτυχές DELETE χωρίς περιεχόμενο απάντησης επιστρέφει:",o:["200","201","204 No Content","404"],a:2,e:"204 = επιτυχία, τίποτα να επιστραφεί."},
{d:6,s:1,q:"Ποια η διαφορά 401 και 403;",o:["Καμία","401 = λείπει/άκυρο authentication token, 403 = authenticated αλλά χωρίς δικαίωμα","401 = server error","403 = λάθος route"],a:1,e:"401 Unauthorized = «ποιος είσαι;»· 403 Forbidden = «ξέρω ποιος είσαι, αλλά δεν επιτρέπεται»."},
{d:6,q:"Duplicate create ή concurrency failure επιστρέφει:",o:["400","404","409 Conflict","500"],a:2,e:"409 = state conflict."},
{d:6,q:"Το <code>?tier=Gold&top=10</code> δένεται με:",o:["[FromRoute]","[FromBody]","[FromQuery]","[FromHeader]"],a:2,e:"Route: /players/{id} → FromRoute. Query string → FromQuery. JSON body → FromBody."},
{d:6,q:"Γιατί δεν επιστρέφεις ποτέ το domain entity απευθείας από το API;",o:["Είναι αργό","Δένει το API contract με το εσωτερικό μοντέλο — χρησιμοποιείς ξεχωριστά Request/Response DTOs","Δεν σειριοποιείται","Το απαγορεύει το ASP.NET"],a:1,e:"DTOs: μόνο ό,τι στέλνει/χρειάζεται ο client. Tip: records — immutable και concise."},
{d:6,q:"Τι συμβαίνει όταν η εκτέλεση φτάσει σε <code>await</code> για I/O;",o:["Το thread μπλοκάρει μέχρι να τελειώσει","Το thread απελευθερώνεται στο pool· η συνέχεια τρέχει όταν ολοκληρωθεί το I/O","Ανοίγει background thread","Το request ακυρώνεται"],a:1,e:"async ≠ background thread. Σημαίνει «δεν μπλοκάρει το τρέχον thread» — waiter analogy."},
{d:6,s:1,q:"Γιατί απαγορεύεται το <code>async void</code>;",o:["Δεν κάνει compile","Το exception δεν μπορεί να παρακολουθηθεί και κρασάρει όλη τη διεργασία — επίστρεφε πάντα Task","Είναι πιο αργό","Δεν δουλεύει με LINQ"],a:1,e:"Task επιτρέπει tracking/await. async void = untracked, μοιραίο σε exception."},
{d:6,s:1,q:"Τι προκαλεί το <code>.Result</code> / <code>.Wait()</code> σε async κώδικα;",o:["Καλύτερη απόδοση","Συγχρονισμένο μπλοκάρισμα του thread → κίνδυνος deadlock· χρησιμοποίησε await","Αυτόματο retry","Cancellation"],a:1,e:"«Async all the way» — από τον controller μέχρι τη DB, όλα async/await."},
{d:6,def:1,s:1,q:"Τι κάνει το CancellationToken;",o:["Ακυρώνει το transaction","«Stop sign» που περνάς σε όλη την αλυσίδα — αν φύγει ο client, σταματούν DB/HTTP κλήσεις","Timeout στο HTTP","Retry policy"],a:1,e:"Πάντα πέρνα το token στην επόμενη μέθοδο — DB και HttpClients το σέβονται."},
{d:6,def:1,s:1,q:"Περιέγραψε το cache-aside pattern:",o:["Γράφεις πρώτα στο cache, μετά στη DB","Έλεγχος cache → miss → φέρνεις από DB → γράφεις στο cache → επιστρέφεις","Το cache ενημερώνεται με job","DB και cache γράφονται ταυτόχρονα"],a:1,e:"Το πιο κοινό pattern για Web APIs. Το «γράφονται ταυτόχρονα» είναι το write-through."},
{d:6,s:1,q:"Ο παίκτης άλλαξε πόντους αλλά το GET /rankings δείχνει παλιά δεδομένα. Ποια η σωστή λύση;",o:["Μικρότερο TTL","cache.Remove(key) αμέσως μετά το write — invalidation on write","Restart του app","Sliding expiration"],a:1,e:"Read → γεμίζει το cache στο miss. Write → σβήνει το entry αμέσως."},
{d:6,q:"Για user sessions / active carts ταιριάζει:",o:["Absolute expiration","Sliding expiration — ανανεώνεται σε κάθε access","Καμία λήξη","Manual μόνο"],a:1,e:"Absolute = σταθερή λήξη (τιμές, headlines). Sliding = παρατείνεται όσο χρησιμοποιείται."},
{d:6,q:"Τι κίνδυνο έχει το <code>cache.Set(key, data)</code> χωρίς TTL;",o:["Stale data για 1 ώρα","Το cache μεγαλώνει απεριόριστα → out of memory","Cache miss πάντα","Τίποτα"],a:1,e:"Πάντα όρισε AbsoluteExpirationRelativeToNow."},
{d:6,s:1,q:"Τρέχεις 3 instances πίσω από load balancer. Ποιο cache;",o:["IMemoryCache σε κάθε instance","IDistributedCache (Redis) — κοινό, επιβιώνει restarts","Static dictionary","Session state"],a:1,e:"Το IMemoryCache είναι per-process — κάθε instance θα σέρβιρε διαφορετικά stale data."},
{d:6,q:"Χειρισμός unhandled exceptions στο API — τι είναι σωστό;",o:["return StatusCode(500, ex.Message)","try/catch σε κάθε action","UseExceptionHandler + Problem Details — ποτέ raw 500 με internals","Κανένα handling"],a:2,e:"Το ex.Message διαρρέει internals. Το Problem Details middleware μορφοποιεί ασφαλώς την απάντηση."},
// ---------- DAY 7 ----------
{d:7,def:1,s:1,q:"Τι επιστρέφει ένα Command στο CQRS;",o:["Το πλήρες entity","void ή απλώς το Id — ποτέ hydrated entity","DTO με όλα τα δεδομένα","Λίστα αποτελεσμάτων"],a:1,e:"Commands αλλάζουν state· τα δεδομένα τα φέρνεις με Query."},
{d:7,def:1,q:"Τι χαρακτηρίζει ένα Query στο CQRS;",o:["Αλλάζει state με έλεγχο","Διαβάζει μόνο — κανένα side effect, συνήθως ούτε validator","Στέλνει notifications","Απαιτεί transaction"],a:1,e:"Ένα type ανά intent: Query = read, Command = write. Το MediatR στέλνει το καθένα σε ακριβώς έναν handler."},
{d:7,q:"Πού ανήκει ο έλεγχος «υπάρχει η εταιρεία με αυτό το Id;» για το CreateCarCommand;",o:["Στον FluentValidation validator","Στον handler — cross-entity checks δεν ανήκουν στο validation rule","Στον controller","Στο Domain entity"],a:1,e:"Ο validator ελέγχει το σχήμα του input (NotEmpty, GreaterThan)· lookups σε repositories γίνονται στον handler."},
{d:7,def:1,s:1,q:"Τι είναι ένα MediatR pipeline behavior;",o:["Middleware του ASP.NET","Wrapper που τυλίγει ΚΑΘΕ command/query (π.χ. logging, validation) — μία εγγραφή, μηδέν αλλαγές σε handlers","Ένας ειδικός handler ανά request","Job scheduler"],a:1,e:"cfg.AddOpenBehavior(typeof(LoggingBehavior<,>)) — open generics καλύπτουν και τους αυριανούς handlers."},
{d:7,q:"Τι κάνει το ValidationBehavior με FluentValidation;",o:["Λογάρει τα σφάλματα","Τρέχει κάθε IValidator του request και πετάει ΠΡΙΝ τρέξει ο handler — κακό input δεν φτάνει στο business logic","Επιστρέφει 400 από τον controller","Ακυρώνει το request σιωπηλά"],a:1,e:"Ο handler τρέχει μόνο με έγκυρο input."},
{d:7,q:"Notifications στο MediatR (INotification):",o:["Ένα event → ένας handler","Ένα event → πολλοί ανεξάρτητοι handlers που δεν γνωρίζουν ο ένας τον άλλο (Publish)","Στέλνουν email","Αντικαθιστούν τα commands"],a:1,e:"π.χ. CarTransferredEvent με AuditLog + RecipientNotification handlers. Τρίτος handler αύριο = μηδέν αλλαγές αλλού."},
{d:7,q:"Τι κάνει inject ένας controller σε CQRS αρχιτεκτονική;",o:["Τα repositories","Τον DbContext","Μόνο το IMediator","Τους handlers"],a:2,e:"Controller = μία γραμμή ανά action: στέλνει το command/query μέσω IMediator. Repository πίσω από handler."},
{d:7,q:"Το Autofac <code>InstancePerLifetimeScope</code> αντιστοιχεί σε:",o:["Singleton","Scoped (ένα ανά HTTP request)","Transient","Static"],a:1,e:"SingleInstance = Singleton, InstancePerLifetimeScope = Scoped, InstancePerDependency = Transient (και default)."},
{d:7,q:"Γιατί χρειάστηκε το Autofac αντί για τον built-in container;",o:["Είναι πιο γρήγορο","Ο built-in δεν υποστηρίζει decorators σε open generics — το RegisterGenericDecorator τυλίγει κάθε handler με μία γραμμή","Ο built-in δεν έχει Scoped","Θέλαμε XML config"],a:1,e:"Μία εγγραφή καλύπτει κάθε IRequestHandler<,> — και τον 11ο handler που θα γραφτεί αύριο."},
{d:7,def:1,s:1,q:"Ποιοι είναι οι 3 κανόνες ενός σωστού Decorator;",o:["Singleton, sealed, generic","Ίδιο interface με το wrapped, κρατά reference στο inner, κάνει delegate στο inner (+ δικό του behaviour)","Κληρονομεί από το wrapped, override, base call","Interface, abstract class, factory"],a:1,e:"Ο caller δεν βλέπει διαφορά — προσθέτεις concern (logging, caching) χωρίς να αγγίξεις τον handler. Open/Closed."},
{d:7,def:1,q:"Τι λέει το YAGNI;",o:["Γράφε generic κώδικα από την αρχή","Μη χτίζεις ό,τι δεν χρειάζεσαι ακόμα — γενίκευσε στο ΔΕΥΤΕΡΟ πραγματικό use case","Κάθε interface θέλει δύο υλοποιήσεις","Μην γράφεις tests νωρίς"],a:1,e:"Κόστος να προσθέσεις option αργότερα: 30 λεπτά. Κόστος να συντηρείς ένα που κανείς δεν χρησιμοποιεί: για πάντα."},
{d:7,q:"Ποιο είναι παράδειγμα KISS από το μάθημα;",o:["HandlerFactory με switch ανά concern","Χωρίς factory/switch — ο container κάνει compose τους decorators με μία εγγραφή","Generic BaseRepository για όλα","CacheOptions με 12 properties"],a:1,e:"Λύσε το πρόβλημα μπροστά σου — τα άλλα τρία είναι τα αντιπαραδείγματα (YAGNI violations)."},
{d:7,q:"Ποιο από τα παρακάτω είναι λάθος σε CQRS κώδικα;",o:["Handler που κάνει validation + business logic + response mapping μαζί","Command που επιστρέφει Id","Query χωρίς validator","Κεντρικός exception handler"],a:0,e:"Ένας handler = μία δουλειά. Επίσης λάθη: MediatR reference στο Domain, validator με repository lookups."},
// ---------- DAY 8 ----------
{d:8,s:1,q:"Γιατί το <code>new HttpClient()</code> σε κάθε κλήση είναι επικίνδυνο υπό load;",o:["Είναι αργό στο construction","Κάθε socket μένει σε TIME_WAIT ~4 λεπτά → μετά ~64k sockets έρχεται SocketException (socket exhaustion)","Δεν υποστηρίζει HTTPS","Κάνει memory leak στο GC"],a:1,e:"Το OS κρατά τα released sockets σε TIME_WAIT — υπό 1000 calls/sec εξαντλούνται."},
{d:8,q:"Πώς λύνει το πρόβλημα το IHttpClientFactory;",o:["Κρατά ένα global HttpClient","Κάνει pool/reuse τα HttpMessageHandlers (sockets) — φρέσκο HttpClient shell, reused handler","Ανοίγει περισσότερα sockets","Κάνει τα requests synchronous"],a:1,e:"services.AddHttpClient<IRatesGateway, RatesGateway>(...) — typed client με injected HttpClient."},
{d:8,q:"Retry με exponential backoff 3 προσπαθειών σημαίνει αναμονές:",o:["1s, 1s, 1s","2s, 4s, 8s","10s, 20s, 30s","0s, 1s, 2s"],a:1,e:"TimeSpan.FromSeconds(Math.Pow(2, attempt)) → 2, 4, 8 δευτερόλεπτα."},
{d:8,q:"Τι κάνει το circuit breaker <code>CircuitBreakerAsync(5, 30s)</code>;",o:["Retry 5 φορές με 30s delay","Ανοίγει το κύκλωμα μετά από 5 συνεχόμενα failures και ξαναδοκιμάζει μετά από 30s","Timeout 30s ανά κλήση","Κλείνει το connection μετά 5 λεπτά"],a:1,e:"Όσο είναι ανοιχτό, οι κλήσεις αποτυγχάνουν αμέσως — προστατεύει το downstream σύστημα."},
{d:8,q:"Πώς συνδυάζεις retry + circuit breaker + timeout στο Polly;",o:["Με τρία ξεχωριστά HttpClients","Policy.WrapAsync(retry, circuitBreaker, timeout) → .AddPolicyHandler(combined)","Μόνο ένα policy επιτρέπεται","Με middleware"],a:1,e:"Outermost πρώτο, innermost πιο κοντά στην εκτέλεση."},
{d:8,def:1,q:"Τι είναι το Anti-Corruption Layer (ACL);",o:["Firewall για το API","Mapper (π.χ. ExchangeRate.FromDto) που κρατά το εξωτερικό contract έξω από το domain — αλλαγή στο external API αγγίζει μόνο DTO+mapper","Authentication layer","Το validation του request"],a:1,e:"External DTO με τα ονόματα του API ≠ domain model. Handlers/domain μένουν ανέγγιχτα."},
{d:8,s:1,q:"Τι ιδιαιτερότητα έχει το CRON του Quartz;",o:["5 πεδία όπως το Unix cron","6 πεδία — τα SECONDS είναι το πρώτο πεδίο","Μόνο λεπτά και ώρες","Δεν υποστηρίζει ranges"],a:1,e:"Seconds, Minutes, Hours, DayOfMonth, Month, DayOfWeek (+προαιρετικό Year)."},
{d:8,t:1,q:"Τι σημαίνει το <code>0 0/5 * * * ?</code> στο Quartz;",o:["Κάθε 5 δευτερόλεπτα","Κάθε 5 λεπτά","Στις 5:00 κάθε μέρα","Κάθε 5 ώρες"],a:1,e:"Δευτερόλεπτο 0, κάθε 5 λεπτά. Το 0 0 9 ? * MON-FRI = 9πμ καθημερινές."},
{d:8,q:"Πώς χειρίζεσαι exception μέσα σε IJob.Execute;",o:["Το αφήνεις να σκάσει","Log + wrap σε JobExecutionException (π.χ. RefireImmediately=false) — αλλιώς το Quartz μπορεί να μην κάνει retry σωστά","try/catch χωρίς rethrow","Restart το scheduler"],a:1,e:"Το JobExecutionException ελέγχει το retry behaviour."},
{d:8,def:1,q:"Τι είναι το misfire και τι κάνει η πολιτική FireNow;",o:["Λάθος CRON syntax· διορθώνεται αυτόματα","Trigger που έπρεπε να πυροδοτήσει όσο ο scheduler ήταν down· FireNow = τρέχει μία φορά αμέσως και επιστρέφει στο κανονικό πρόγραμμα","Exception στο job· FireNow = retry","Διπλή εκτέλεση· FireNow την ακυρώνει"],a:1,e:"DoNothing = προσπερνά τα χαμένα, IgnoreMisfirePolicy = catch-up για όλα."},
{d:8,t:1,q:"Ποιο από τα παρακάτω είναι λάθος του Day 08;",o:["Typed client μέσω factory","Circuit breaker ως Singleton","XML queries χωρίς το σωστό XNamespace","Polly retry με backoff"],a:2,e:"Πολλά APIs έχουν default namespace — queries χωρίς XNamespace επιστρέφουν τίποτα. (Το breaker ΠΡΕΠΕΙ να είναι Singleton — αυτό είναι σωστό.)"},
// ---------- DAY 9 ----------
{d:9,q:"Πότε χρησιμοποιείς [Theory] αντί για [Fact];",o:["Για async tests","Για data-driven tests: ίδιο body, πολλά inputs με [InlineData] — ιδανικό για edge cases","Για integration tests","Όταν το test έχει πολλά asserts"],a:1,e:"[Fact] = ένα σταθερό σενάριο. [Theory]+[InlineData(0)],[InlineData(-1)] = ένα run ανά data row."},
{d:9,def:1,q:"Ποια είναι η σωστή δομή ενός unit test;",o:["Setup / Run / Check","Arrange / Act / Assert","Given / Then / When","Init / Test / Cleanup"],a:1,e:"AAA: προετοιμάζεις, εκτελείς, επιβεβαιώνεις. Naming: MethodName_Scenario_ExpectedResult."},
{d:9,s:1,q:"Γιατί κάνεις mock interfaces και όχι concrete classes με το Moq;",o:["Τα interfaces είναι πιο γρήγορα","Το Moq δεν μπορεί να κάνει mock non-virtual methods","Οι κλάσεις θέλουν license","Είναι θέμα στυλ"],a:1,e:"Πάντα mock interfaces — ένας ακόμα λόγος που το DI με interfaces κάνει τον κώδικα testable."},
{d:9,q:"Τι κάνει το <code>.Verify(m => m.AddAsync(player, It.IsAny&lt;CancellationToken&gt;()), Times.Once)</code>;",o:["Ορίζει τι επιστρέφει το mock","Επιβεβαιώνει ότι η μέθοδος κλήθηκε ακριβώς μία φορά — ουσιώδες για handlers χωρίς return value","Τρέχει το test δύο φορές","Καθαρίζει το mock"],a:1,e:"Setup = τι επιστρέφει το fake· Verify = επιβεβαίωση interaction."},
{d:9,t:1,q:"Ποιο από τα παρακάτω ΔΕΝ τεστάρεις;",o:["Domain business rules","Edge cases (0, αρνητικά, null)","EF Core / MediatR / Autofac — framework code","Exception paths"],a:2,e:"Framework code είναι ήδη tested. Επίσης όχι: DTOs χωρίς logic, private methods (μέσω public behaviour), third-party libs."},
{d:9,def:1,s:1,q:"Στο test pyramid, ποια είναι η σωστή αναλογία;",o:["Πολλά E2E, λίγα unit","Πολλά unit (γρήγορα, isolated) → λιγότερα integration → ελάχιστα E2E","Ίσα από όλα","Μόνο integration"],a:1,e:"Unit: ms, όλα mocked, exact failure. Integration: δευτερόλεπτα, real deps, system-level."},
{d:9,def:1,q:"Τι κάνει το WebApplicationFactory&lt;Program&gt;;",o:["Deploy σε test server","Σηκώνει όλο το ASP.NET Core pipeline in-process — real middleware/DI, χωρίς δίκτυο","Δημιουργεί mock controllers","Τρέχει το app σε Docker"],a:1,e:"Το HttpClient στέλνει requests απευθείας στο app. ConfigureTestServices αντικαθιστά registrations (π.χ. test DB, αφαίρεση Quartz)."},
{d:9,q:"Γιατί Testcontainers (MsSqlContainer) αντί για in-memory provider;",o:["Είναι πιο γρήγορο","Πραγματικός SQL Server (ίδιο engine με production) — όχι quirks/false negatives του fake provider","Δεν θέλει Docker","Έχει έτοιμα δεδομένα"],a:1,e:"Κάθε test class παίρνει φρέσκο container με random port και άδειο schema."},
{d:9,q:"Πού κάνεις start/stop το container στο xUnit;",o:["Στον constructor και στο Dispose","Στο IAsyncLifetime: InitializeAsync (start + migrate) και DisposeAsync (teardown)","Σε static constructor","Στο [Fact]"],a:1,e:"Ποτέ από constructor/Dispose — τα async lifecycle methods είναι το σωστό σημείο. Χωρίς DisposeAsync τα containers κάνουν leak."},
{d:9,q:"Ποιο από τα παρακάτω είναι σωστή πρακτική στα tests;",o:["Thread.Sleep για συγχρονισμό σε async tests","Tests που βασίζονται στη σειρά εκτέλεσης","Assert σε παρατηρήσιμα outcomes, όχι σε implementation details","Μόνο happy path"],a:2,e:"Verify observable behaviour — τα υπόλοιπα τρία είναι στα common mistakes: fragile/flaky tests και κρυμμένα bugs στα edge cases."},
{d:9,q:"«Ο κώδικας δεν τεστάρεται εύκολα.» Τι σημαίνει αυτό κατά το μάθημα;",o:["Χρειάζεσαι καλύτερο testing framework","Είναι design smell — η μέθοδος κάνει πολλά· ο σχεδιασμός φταίει, όχι τα tests","Χρειάζεσαι περισσότερα mocks","Είναι φυσιολογικό"],a:1,e:"Untestable code = poorly designed code. Τα tests αναγκάζουν καλό design (DI, interfaces, μικρές μέθοδοι)."},
// ---------- DAY 1 (extra) ----------
{d:1,q:"Σε reference type, τι κρατά πραγματικά η μεταβλητή;",o:["Την ίδια την τιμή","Τη διεύθυνση μνήμης (pointer) προς το αντικείμενο στο heap","Ένα αντίγραφο του αντικειμένου","Το hash του αντικειμένου"],a:1,e:"Η μεταβλητή κρατά το «κλειδί» (reference) — γι' αυτό το assignment μοιράζεται το ίδιο αντικείμενο."},
{d:1,t:1,q:"Το <code>string</code> είναι:",o:["Value type στο stack","Reference type","struct","enum"],a:1,e:"Παρότι συμπεριφέρεται «σαν τιμή» λόγω immutability, το string είναι reference type στο heap."},
{d:1,q:"Στον constructor του Player, το όνομα είναι κενό. Τι κάνεις;",o:["Θέτεις default όνομα σιωπηλά","throw new ArgumentException με nameof(name)","Return null","Log warning και συνεχίζεις"],a:1,e:"Validation στον constructor: required properties επιβάλλονται στη δημιουργία — ποτέ αντικείμενο σε invalid state."},
{d:1,q:"Ποια η διαφορά <code>while</code> και <code>do/while</code>;",o:["Καμία","Το do/while εκτελεί το σώμα τουλάχιστον μία φορά πριν ελέγξει τη συνθήκη","Το while είναι πιο γρήγορο","Το do/while δεν δέχεται break"],a:1,e:"do { ... } while(cond); — χρήσιμο π.χ. για input prompt που πρέπει να τρέξει τουλάχιστον μία φορά."},
{d:1,q:"Τι κάνει το <code>continue</code> μέσα σε loop;",o:["Τερματίζει το loop","Παρακάμπτει την τρέχουσα επανάληψη και συνεχίζει στην επόμενη","Επανεκκινεί το loop","Επιστρέφει από τη μέθοδο"],a:1,e:"break = έξοδος από το loop· continue = skip της τρέχουσας επανάληψης."},
{d:1,q:"Ποια collection ΔΕΝ επιτρέπει duplicates;",o:["List<T>","Queue<T>","HashSet<T>","LinkedList<T>"],a:2,e:"Το HashSet<T> κρατά μοναδικά στοιχεία (και το Dictionary μοναδικά keys)."},
{d:1,q:"Ποια collection έχει σταθερό (μη δυναμικό) μέγεθος;",o:["Array","List<T>","Dictionary<K,V>","Queue<T>"],a:0,e:"Ο πίνακας έχει fixed size· η List<T> είναι ο dynamically resized «αντικαταστάτης» του."},
{d:1,q:"Με ποια εντολή δημιουργείς νέο console app;",o:["dotnet build console","dotnet new console -n MyApp","dotnet run --new","git init console"],a:1,e:"dotnet new console -n PlayerRegistry — έτσι ξεκίνησε και το lab της Day 01."},
{d:1,q:"Ποια είναι η σωστή χρήση του <code>var</code>;",o:["Παντού — πάντα var","Πουθενά — πάντα ρητός τύπος","Όταν ο τύπος είναι προφανής από τη δεξιά πλευρά· απόφυγέ το για primitives","Μόνο σε loops"],a:2,e:"var p = new Player(...) ✓ — αλλά var x = Get() όπου δεν φαίνεται ο τύπος μειώνει την αναγνωσιμότητα."},
{d:1,q:"Με nullable reference types ενεργά, τι δηλώνει το <code>string name</code> (χωρίς ;);",o:["Μπορεί να είναι null ελεύθερα","Ο compiler το επιβάλλει ως non-null· το string? δηλώνει ρητά ότι επιτρέπεται null","Είναι πάντα κενό string","Compile error"],a:1,e:".NET 6+: string = non-nullable κατά τον compiler, string? = ρητά nullable."},
// ---------- DAY 2 (extra) ----------
{d:2,t:1,q:"Ποιο ΔΕΝ είναι πλεονέκτημα του OOP έναντι procedural;",o:["Καθαρότερη δομή προγραμμάτων","Ευκολότερο testing & debugging","DRY — λιγότερη επανάληψη κώδικα","Εγγυημένα ταχύτερη εκτέλεση"],a:3,e:"Το OOP δίνει δομή, συντηρησιμότητα, DRY — όχι ταχύτητα εκτέλεσης."},
{d:2,q:"Πότε απελευθερώνεται ο χώρος ενός instance κλάσης στο heap;",o:["Στο τέλος της μεθόδου","Όταν ο Garbage Collector τον ελευθερώσει","Αμέσως μόλις γίνει null","Στο dispose του thread"],a:1,e:"Το new δεσμεύει χώρο στο heap μέχρι ο GC να διαπιστώσει ότι δεν υπάρχουν references."},
{d:2,def:1,q:"Πώς λέγεται η κλάση που κληρονομεί και αυτή που κληρονομείται;",o:["Parent / Child","Derived (child) / Base (parent)","Sub / Super μόνο","Slave / Master"],a:1,e:"Derived class κληρονομεί από τη Base class με το σύμβολο «:»."},
{d:2,q:"Τι ισχύει για ένα abstract member σε abstract class;",o:["Έχει default υλοποίηση","Κάθε concrete υποκλάση ΥΠΟΧΡΕΟΥΤΑΙ να το υλοποιήσει","Είναι προαιρετικό","Είναι private"],a:1,e:"π.χ. public abstract void Pay(); — κάθε CardPayment/CashPayment δίνει τη δική του υλοποίηση."},
{d:2,q:"Τι default τιμή έχει ένα αρχικοποίητο <code>int x;</code>",o:["null","0 — τα value types έχουν πάντα τιμή","-1","Απροσδιόριστη"],a:1,e:"Γι' αυτό υπάρχει το Nullable<T>: στη βάση δεδομένων το «no value» είναι διαφορετικό state από το 0."},
{d:2,q:"Ποιες είναι non-generic collections (παλιές);",o:["List<T>, Dictionary<K,V>","ArrayList, Hashtable","HashSet<T>, Queue<T>","IEnumerable<T>, IList<T>"],a:1,e:"Οι παλιές (System.Collections) αποθηκεύουν object και κάνουν boxing — στην πράξη πάντα τις generic."},
{d:2,def:1,q:"Ποια είναι η ιδέα του Try* pattern;",o:["try/catch παντού","«Δοκίμασε· πες μου επιτυχία/αποτυχία με bool και δώσε το αποτέλεσμα με out» — χωρίς exception","Retry 3 φορές","Async try"],a:1,e:"TryAdd/TryGetValue: χειρίζεσαι την αποτυχία χωρίς το κόστος και τον θόρυβο ενός exception."},
{d:2,q:"Από ποιο namespace παρέχεται το LINQ;",o:["System.Collections","System.Linq","System.Query","Microsoft.Linq"],a:1,e:"LINQ = Language-Integrated Query, από το System.Linq."},
{d:2,q:"Σε λίστα 1|2|3|4|5|6|7|8|9, τι επιστρέφει το <code>Skip(2).Take(4)</code>;",o:["1,2,3,4","3,4,5,6","2,3,4,5","5,6,7,8"],a:1,e:"Skip(2) προσπερνά τα 1,2 — Take(4) παίρνει τα επόμενα τέσσερα: 3,4,5,6."},
{d:2,q:"Τι κάνει το <code>payments.ToDictionary(p => p.Id)</code>;",o:["Ομαδοποιεί κατά Id","Εκτελεί το query και χτίζει Dictionary με key selector το Id","Ταξινομεί κατά Id","Φιλτράρει duplicates"],a:1,e:"Εκτέλεση + Dictionary<TKey,TValue> — προαιρετικά και value selector."},
{d:2,def:1,q:"Τι κάνει το <code>init</code> σε property ενός record;",o:["Το αρχικοποιεί σε 0","Επιτρέπει set μόνο κατά τη δημιουργία του αντικειμένου (immutability)","Το κάνει static","Το κάνει nullable"],a:1,e:"public decimal Amount { get; init; } — τιμή μόνο στο object initializer/constructor, μετά αμετάβλητο."},
// ---------- DAY 3 (extra) ----------
{d:3,q:"Γιατί το Console.WriteLine ΔΕΝ είναι production logging;",o:["Είναι αργό","Δεν έχει levels, timestamp, category, filtering, structure — και πάει μόνο σε stdout","Δεν δουλεύει σε Linux","Θέλει license"],a:1,e:"ΟΚ για πεντάλεπτο script — όχι για το πώς ένα service μιλά στους operators του."},
{d:3,q:"Το <code>ArgumentOutOfRangeException</code> σημαίνει:",o:["Ο caller έδωσε λάθος όρισμα στο API (π.χ. αρνητικό ποσό)","Το αντικείμενο είναι σε λάθος state","Παραβιάστηκε business rule","Έπεσε η βάση"],a:0,e:"Caller misuse → ArgumentOutOfRange. Λάθος state → InvalidOperation. Business rule → custom exception."},
{d:3,q:"Τι πλεονέκτημα έχουν τα custom exceptions με typed data (π.χ. ex.Balance);",o:["Καλύτερο μήνυμα","Οι callers μπορούν να αντιδράσουν προγραμματιστικά, όχι μόνο να διαβάσουν string","Μικρότερο stack trace","Ταχύτητα"],a:1,e:"π.χ. InsufficientBalanceException(AccountId, Balance, RequestedAmount) — δεδομένα, όχι μόνο κείμενο."},
{d:3,q:"Πώς οργανώνεται σωστά ένα exception hierarchy;",o:["Όλα κληρονομούν Exception απευθείας","Ένα abstract base (DomainException) + business-meaningful leaves","Ένα exception για όλα","Ένα ανά μέθοδο"],a:1,e:"DomainException → InsufficientBalance/AccountLocked/UnsupportedCurrency/DepositFailed."},
{d:3,q:"Έχεις catch για Exception ΚΑΙ για KeyNotFoundException. Ποια σειρά;",o:["Το γενικό πρώτα","Το ειδικό (KeyNotFound) πριν το γενικό — το CLR παίρνει το πρώτο match","Δεν έχει σημασία","Δεν επιτρέπονται δύο catch"],a:1,e:"Catch specific before general — αλλιώς το γενικό «κλέβει» όλα τα exceptions."},
{d:3,t:1,q:"Ποια η διαφορά <code>await Task.WhenAll</code> και <code>Task.WaitAll</code> στα exceptions;",o:["Καμία","Το await WhenAll κάνει unwrap μόνο το πρώτο exception· το WaitAll πετάει AggregateException με όλα","Το WaitAll δεν πετάει ποτέ","Το WhenAll κάνει retry"],a:1,e:"Για να δεις ΟΛΑ τα failures μαζεμένα, το WaitAll/.Wait() δίνει το AggregateException απευθείας."},
{d:3,q:"Ανεβάζεις το minlevel του NLog από Trace σε Information. Τι αλλάζει στον C# κώδικα;",o:["Πρέπει να αλλάξουν όλα τα logger calls","Τίποτα — μόνο το nlog.config· Trace/Debug γραμμές εξαφανίζονται από τα targets","Πρέπει rebuild με flag","Αλλάζει το ILogger σε ILoggerFactory"],a:1,e:"Ο κώδικας βλέπει μόνο ILogger<T> — συμπεριφορά logging αλλάζει από config, όχι από C#."},
{d:3,q:"Σε τι χρησιμεύει το correlationId στα logs της Novibet;",o:["Κρυπτογράφηση","Ιχνηλάτηση ΕΝΟΣ request μέσα από πολλά microservices — προωθείται και ως X-Correlation-ID header","Μέτρηση απόδοσης","Ομαδοποίηση ανά χρήστη"],a:1,e:"Κάθε γραμμή log κουβαλά το id· ο CorrelatedLoggingDelegatedHandler το προωθεί στις εξερχόμενες HTTP κλήσεις."},
{d:3,q:"Τι βλέπεις στο Call Stack window όταν κάνεις debug async κώδικα;",o:["Καθαρές μεθόδους όπως στο sync","Compiler-generated MoveNext() frames του state machine","Τίποτα — δεν υποστηρίζεται","Μόνο το Main"],a:1,e:"Ο compiler μετατρέπει τα async σε state machines· στο printed trace βλέπεις και «End of stack trace from previous location»."},
// ---------- DAY 4 (extra) ----------
{d:4,q:"Τι περιέχει το API layer;",o:["Entities και value objects","Use-cases και interfaces","Controllers, middleware, DI wiring — το Composition Root","EF Core και HTTP clients"],a:2,e:"Το API είναι το εξωτερικό layer και το μόνο σημείο όπου επιτρέπεται το new()."},
{d:4,t:1,q:"Ποιο ΔΕΝ είναι σύμπτωμα του «big ball of mud» (όλα σε ένα project);",o:["Δεν τεστάρεις τίποτα σε απομόνωση","Δεν αλλάζεις DB χωρίς να αγγίξεις business logic","Δεν βρίσκεις πού ζει ένας κανόνας","Ο compiler επιβάλλει τα boundaries"],a:3,e:"Ακριβώς το αντίθετο: χωρίς layers δεν υπάρχουν boundaries — με Clean Architecture ο compiler τα επιβάλλει μέσω project references."},
{d:4,q:"Τι σου «αγοράζει» το Clean Architecture στο testing;",o:["Τίποτα — θέλει πάντα DB","Business rules πίσω από interfaces → tests με fake repositories, χωρίς DB/HTTP, σε milliseconds","Αυτόματα generated tests","Λιγότερα tests συνολικά"],a:1,e:"«Test without the world» — τα rules εξαρτώνται από abstractions που αντικαθιστάς με fakes."},
{d:4,q:"Πότε είναι ίσα δύο Entities στο DDD;",o:["Όταν όλα τα fields ταιριάζουν","Όταν τα Ids ταιριάζουν — ακόμα κι αν άλλα fields διαφέρουν","Ποτέ","Όταν είναι το ίδιο reference"],a:1,e:"Entity = identity (Id), mutable. Το Value Object είναι που συγκρίνεται με όλα τα fields."},
{d:4,def:1,q:"Τι είναι το Bounded Context;",o:["Το μέγεθος του aggregate","Όριο μέσα στο οποίο ένα μοντέλο είναι συνεπές — η ίδια λέξη μπορεί να σημαίνει άλλο πράγμα αλλού","Το scope του DI","Ένα database schema"],a:1,e:"π.χ. «Wallet» στο wallet context ≠ «Wallet» στο player profile context."},
{d:4,q:"Πού ανήκει το <code>WalletsController</code>;",o:["Domain","Application","Infrastructure","API"],a:3,e:"Controllers = API layer. Wallet → Domain, IWalletRepository → Application, EfWalletRepository → Infrastructure."},
{d:4,q:"Πού ανήκει το <code>InsufficientFundsException</code>;",o:["Domain — μαζί με τα entities και τα invariants τους","Application","Infrastructure","API"],a:0,e:"Τα domain exceptions εκφράζουν παραβιάσεις business κανόνων — ζουν στο Domain."},
{d:4,q:"Ποια αναφορά είναι ΕΠΙΤΡΕΠΤΗ κατά το Dependency Rule;",o:["Domain → Application","Application → Infrastructure","Infrastructure → Domain","Domain → EF Core"],a:2,e:"Επιτρεπτά: API→Infra/App/Domain, Infra→App/Domain, App→Domain. Το Domain δεν αναφέρεται πουθενά."},
{d:4,q:"Για ποιο service ταιριάζει το Transient lifetime;",o:["DbContext","Polly circuit breaker","Ελαφριά stateless helpers: validators, mappers, μικρά strategies","Memory cache"],a:2,e:"Φθηνά στη δημιουργία, χωρίς state — νέο instance σε κάθε injection."},
{d:4,q:"Πότε προτιμάς χειροκίνητο Composition Root αντί για container;",o:["Ποτέ","Όταν το object graph είναι μικρό και σταθερό (console app, demo) — explicit και ιχνηλατήσιμο με το μάτι","Σε web apps με decorators","Όταν θες lifetimes"],a:1,e:"Ίδια αρχή, άλλη κλίμακα: container όταν το graph μεγαλώσει ή γίνει lifetime-driven."},
// ---------- DAY 5 (extra) ----------
{d:5,def:1,q:"Τι εγγυάται ένα FOREIGN KEY;",o:["Μοναδικότητα γραμμής","Ότι κάθε Car δείχνει σε υπαρκτή Company — referential integrity","Ταχύτερα queries","Αυτόματο index"],a:1,e:"PRIMARY KEY = μοναδική ταυτότητα γραμμής· FOREIGN KEY = έγκυρη αναφορά στη σχετιζόμενη table (1:N)."},
{d:5,q:"Τι πετυχαίνει το index σε στήλη που φιλτράρεις/κάνεις join;",o:["Τίποτα","Το table scan γίνεται index seek","Λιγότερο χώρο στον δίσκο","Ταχύτερα inserts"],a:1,e:"Γι' αυτό κάνουμε index το FK (IX_Cars_CompanyId) — αλλά με κόστος στα writes."},
{d:5,q:"Γιατί αποφεύγεις το <code>SELECT *</code> στον κώδικα εφαρμογής;",o:["Δεν δουλεύει με JOIN","Φέρνεις άχρηστα δεδομένα — project μόνο τις στήλες που χρειάζεσαι","Είναι συντακτικό λάθος","Κλειδώνει το table"],a:1,e:"ΟΚ για εξερεύνηση στο SSMS, όχι στην εφαρμογή — λιγότερα δεδομένα στο δίκτυο."},
{d:5,q:"Ποια είναι aggregate functions του GROUP BY;",o:["JOIN, ON, WHERE","COUNT, SUM, AVG, MIN, MAX","SELECT, FROM","MERGE, UPSERT"],a:1,e:"Το GROUP BY «διπλώνει» γραμμές σε groups και υπολογίζεις aggregates ανά group."},
{d:5,def:1,q:"Τι είναι ένα TABLE variable (<code>DECLARE @source TABLE (...)</code>);",o:["Μόνιμος πίνακας","Γραμμές στη μνήμη, σαν mini temp table — π.χ. ως source του MERGE","View","Index"],a:1,e:"Τοπική μεταβλητή του batch που κρατά rows — τη δώσαμε ως source στο MERGE."},
{d:5,def:1,q:"Τι χαρακτηρίζει το raw ADO.NET;",o:["Γράφει το SQL για σένα","Πλήρης έλεγχος αλλά ο περισσότερος κώδικας — χειροκίνητο mapping από τον DataReader","Έχει change tracking","Δεν υποστηρίζει parameters"],a:1,e:"connection → command → parameters → reader → mapping στο χέρι. Τα ORMs υπάρχουν για να κόψουν αυτό το boilerplate."},
{d:5,q:"Ποια Dapper μέθοδος ταιριάζει για «0 ή 1 γραμμή»;",o:["QueryAsync<T>","QuerySingleOrDefaultAsync<T>","ExecuteAsync","QueryMultiple"],a:1,e:"QueryAsync = πολλές γραμμές· QuerySingleOrDefault = μία ή default."},
{d:5,q:"Τι επιστρέφει το <code>ExecuteAsync</code> του Dapper;",o:["Το inserted entity","Τον αριθμό των affected rows","bool","Το νέο Id πάντα"],a:1,e:"Για INSERT/UPDATE/DELETE — επιστρέφει πόσες γραμμές επηρεάστηκαν."},
{d:5,q:"Στο Dapper multi-mapping, τι κάνει το <code>splitOn</code>;",o:["Χωρίζει το SQL σε δύο queries","Δείχνει από ποια στήλη ξεκινούν τα columns του δεύτερου object (π.χ. Company)","Κόβει τα αποτελέσματα σε σελίδες","Ορίζει το transaction"],a:1,e:"Ένα JOIN, ένα round trip — το lambda «ράβει» Car+Company. Έτσι αποφεύγεις το N+1."},
{d:5,q:"Πότε επιλέγεις scaffolding (DB-first) αντί για code-first;",o:["Πάντα","Όταν η βάση ήδη υπάρχει — generate entities+context από το live schema","Όταν το app είναι ο ιδιοκτήτης του schema","Ποτέ"],a:1,e:"Code-first: γράφεις κλάσεις + migrations, το app κατέχει το schema. Scaffold-DbContext: η DB προϋπάρχει."},
// ---------- DAY 6 (extra) ----------
{d:6,def:1,q:"Τι σημαίνει ότι το HTTP είναι stateless;",o:["Δεν κρατά δεδομένα ποτέ","Κάθε request-response κύκλος είναι ανεξάρτητος — ο server δεν θυμάται προηγούμενα requests","Δεν έχει errors","Δεν θέλει TCP"],a:1,e:"Stateless request-response πάνω από TCP/IP — ό,τι state χρειάζεσαι το κουβαλάς (tokens, session stores)."},
{d:6,def:1,q:"Ποια η διαφορά PUT και PATCH;",o:["Καμία","PUT = πλήρης αντικατάσταση resource (idempotent), PATCH = μερική ενημέρωση (όχι idempotent)","PATCH = πλήρης, PUT = μερική","PUT μόνο για create"],a:1,e:"Full replace vs partial update — και μόνο το PUT είναι idempotent από τα δύο."},
{d:6,q:"Πότε επιστρέφεις σκόπιμα 500 Internal Server Error;",o:["Σε κάθε exception","Ποτέ — το 500 είναι unhandled exception, όχι σχεδιασμένη απάντηση","Σε validation errors","Όταν λείπει το token"],a:1,e:"Αν το επιστρέφεις εσκεμμένα, κάτι σχεδίασες λάθος. Το 503 είναι για πεσμένο downstream dependency."},
{d:6,q:"Το downstream dependency (π.χ. η βάση) είναι down. Τι επιστρέφει το API;",o:["500","404","503 Service Unavailable","409"],a:2,e:"503 = προσωρινά μη διαθέσιμο λόγω εξάρτησης — διαφορετικό από το 500 (unhandled bug)."},
{d:6,q:"Τι δίνει «δωρεάν» το <code>[ApiController]</code> attribute;",o:["Authentication","Αυτόματο 400 Bad Request όταν αποτύχει το model binding — χωρίς χειροκίνητο ModelState check","Caching","Swagger"],a:1,e:"Μαζί με attribute routing/binding conventions — λιγότερος boilerplate στους controllers."},
{d:6,q:"Πού «πιάνονται» τα λάθη σύνταξης input (format, length, κενά) κατά το μάθημα;",o:["Στο Domain layer","Στο Request layer με FluentValidation — άμεσα στην πύλη της εφαρμογής","Στο service layer","Στη βάση"],a:1,e:"Request: syntax (400) → Service: business rules → Domain: core invariants. Τρία στρώματα validation."},
{d:6,t:1,q:"Ποιο ΔΕΝ είναι όφελος του caching;",o:["Μικρότερο latency (RAM αντί DB)","Απορρόφηση traffic spikes","Λιγότερο DB load και κόστος","Εγγυημένα πάντα φρέσκα δεδομένα"],a:3,e:"Το αντίθετο — ο κίνδυνος του caching είναι τα stale data (data drift)· γι' αυτό υπάρχουν TTL και invalidation."},
{d:6,def:1,q:"Τι είναι το write-through caching;",o:["Γράφεις μόνο στο cache","Ενημερώνεις cache και DB ταυτόχρονα — μέγιστη συνέπεια, με κόστος latency στα writes","Γράφεις μόνο στη DB","Async γράψιμο αργότερα"],a:1,e:"Το cache-aside (πιο κοινό) γεμίζει το cache στο read miss· το write-through στα writes."},
{d:6,q:"Για τιμές προϊόντων ή daily stats ταιριάζει:",o:["Sliding expiration","Absolute expiration — λήγει σε συγκεκριμένο χρόνο","Καμία λήξη","Invalidation μόνο"],a:1,e:"Absolute = σταθερή λήξη· sliding = ανανεώνεται στη χρήση (sessions, carts)."},
{d:6,t:1,q:"Ποιο χαρακτηριστικό ΕΧΕΙ το IMemoryCache;",o:["Επιβιώνει restart","Μοιράζεται μεταξύ instances","Δεν χρειάζεται serialisation — αντικείμενα στη RAM της διεργασίας","Θέλει Redis"],a:2,e:"In-process: χωρίς serialisation, αλλά χάνεται στο restart και κάθε instance έχει το δικό του."},
// ---------- DAY 7 (extra) ----------
{d:7,q:"Τι πρόβλημα έχει το παραδοσιακό «ένα repository για όλα» κατά το CQRS;",o:["Είναι αργό","Μπλέκει reads και writes σε ένα contract — κάθε caller εξαρτάται από όλα","Δεν δουλεύει με EF","Θέλει περισσότερα αρχεία"],a:1,e:"CQRS: ένα type ανά intent (GetCarByIdQuery, CreateCarCommand) — κάθε request στον δικό του handler."},
{d:7,q:"Πώς οργανώνονται Query και Handler στα αρχεία;",o:["Στο ίδιο αρχείο πάντα","Ξεχωριστά αρχεία με κοινό prefix: GetCompanyByIdQuery.cs / GetCompanyByIdQuery.Handler.cs","Ο handler στο Domain","Ένα αρχείο ανά feature"],a:1,e:"One file per type — το IDE file-nesting τα ομαδοποιεί από το κοινό prefix."},
{d:7,q:"Τι κάνει το <code>AddMediatR(cfg => cfg.RegisterServicesFromAssembly(...))</code>;",o:["Καταχωρεί χειροκίνητα κάθε handler","Σκανάρει το assembly και βρίσκει αυτόματα κάθε IRequestHandler","Δημιουργεί τους handlers","Ρυθμίζει το routing"],a:1,e:"Το Program.cs μένει one-liner (AddApplication) — δεν αναφέρει ποτέ το MediatR."},
{d:7,q:"Ποια η διαφορά <code>Send</code> και <code>Publish</code> στο IMediator;",o:["Καμία","Send = request σε ΕΝΑΝ handler (command/query)· Publish = notification σε ΠΟΛΛΟΥΣ handlers","Publish είναι sync","Send είναι για events"],a:1,e:"Requests έχουν ακριβώς έναν handler· notifications όσους θέλεις — ανεξάρτητους μεταξύ τους."},
{d:7,q:"Πώς γίνεται το mapping exceptions → status codes στο Day 07;",o:["try/catch σε κάθε action","Ένα κεντρικό UseExceptionHandler στο Program.cs: ValidationException→400, NotFoundException→404, άγνωστο→500","Attributes στους controllers","Middleware ανά controller"],a:1,e:"Μία φορά, ένα κοινό shape απάντησης — οι actions ξαναέγιναν μία γραμμή."},
{d:7,def:1,q:"Τι είναι ένα Autofac Module;",o:["NuGet package","Μονάδα composition — override Load() και καταχωρείς τα registrations του project σου","Ένα assembly","Middleware"],a:1,e:"ApplicationModule (MediatR+decorator) και InfrastructureModule (persistence+cache) — καθένα project καταχωρεί τα δικά του."},
{d:7,q:"Τι κάνει το <code>RegisterAssemblyTypes(...).AsClosedTypesOf(typeof(IAggregatePersistence&lt;&gt;))</code>;",o:["Καταχωρεί έναν τύπο","Σκανάρει και καταχωρεί ΟΛΕΣ τις υλοποιήσεις του open generic — χωρίς χειροκίνητη λίστα","Δημιουργεί proxies","Κάνει validate τα registrations"],a:1,e:"Νέα υλοποίηση αύριο = μηδέν νέες γραμμές wiring."},
{d:7,q:"Πώς δείχνει το persistence chain με caching decorator στο runtime;",o:["Handler → EF Core → Cache","Handler → CachingDecorator (hit: return / miss: συνεχίζει) → CarAggregatePersistence → EF Core → SQL","Cache → Handler → EF","EF → Cache → Handler"],a:1,e:"Ίδιο σχήμα με το request pipeline: decorator → next → ... → πραγματική υλοποίηση."},
{d:7,def:1,q:"Τι είναι τα MediatR pipeline behaviours σε σχέση με το Decorator pattern;",o:["Άσχετα concepts","Η «ενσωματωμένη» εκδοχή του decorator για requests","Αντικατάσταση του DI","Ένα είδος notification"],a:1,e:"Ίδια ιδέα: τυλίγεις behaviour γύρω από τον handler χωρίς να τον αγγίξεις."},
{d:7,q:"Ποιο είναι YAGNI violation;",o:["Flat σταθερά 10-min SlidingExpiration στο cache","ICacheProvider abstraction χωρίς δεύτερη υλοποίηση","Decorators μόνο για Logging+Caching που όντως χρειάζονται","Generics αντί για BaseRepository"],a:1,e:"Abstraction χωρίς δεύτερη υλοποίηση = κόστος συντήρησης για πάντα, όφελος κανένα — γενίκευσε στο δεύτερο πραγματικό use case."},
// ---------- DAY 8 (extra) ----------
{d:8,q:"Πώς καταχωρείς typed HTTP client;",o:["services.AddSingleton<HttpClient>()","services.AddHttpClient<IRatesGateway, RatesGateway>(c => c.BaseAddress = new Uri(...))","new HttpClient() στον constructor","AddScoped<HttpClient>"],a:1,e:"Το factory κάνει inject έτοιμο HttpClient στο gateway — με pooled handler από πίσω."},
{d:8,q:"Το Polly retry <code>.Handle&lt;HttpRequestException&gt;().OrResult(r => !r.IsSuccessStatusCode)</code> κάνει retry όταν:",o:["Μόνο σε exception","Μόνο σε 500","Είτε πεταχτεί HttpRequestException είτε έρθει μη-επιτυχές status code","Μόνο σε timeout"],a:2,e:"Καλύπτει και τα δύο failure modes: exceptions δικτύου και HTTP error responses."},
{d:8,q:"Τι κάνει το Timeout policy του Polly;",o:["Καθυστερεί τα requests","Αποτυγχάνει την κλήση μετά από Χ δευτερόλεπτα ό,τι κι αν συμβαίνει","Κάνει retry","Κλείνει το socket"],a:1,e:"Policy.TimeoutAsync(TimeSpan.FromSeconds(10)) — συνδυάζεται με retry+breaker στο WrapAsync."},
{d:8,def:1,q:"Ποιος ο ρόλος του Scheduler στο Quartz;",o:["Εκτελεί SQL","Ενορχηστρώνει jobs & triggers — singleton service που ξεκινά στο startup","Κάνει HTTP κλήσεις","Είναι το logging"],a:1,e:"Scheduler = ενορχήστρωση, IJob = η δουλειά, JobDetail = περιγραφή, Trigger = πότε, JobStore = persistence."},
{d:8,def:1,q:"Ποια η διαφορά JobDetail και Trigger;",o:["Καμία","JobDetail περιγράφει ΤΙ (type, identity, data map)· Trigger ορίζει ΠΟΤΕ (CRON, interval, one-shot)","Trigger περιγράφει το job","JobDetail είναι το schedule"],a:1,e:"Ένα job μπορεί να έχει πολλά triggers."},
{d:8,def:1,q:"RAMJobStore vs AdoJobStore:",o:["RAM = in-memory state (χάνεται)· Ado = persistence σε βάση","Ado = in-memory","Είναι το ίδιο","RAM = μόνο για tests"],a:0,e:"Το JobStore κρατά το state των jobs — in-memory ή σε DB για durability."},
{d:8,q:"Τι σημαίνει το CRON <code>0 0 9 ? * MON-FRI</code>;",o:["Κάθε 9 λεπτά","09:00 κάθε καθημερινή","9 το βράδυ καθημερινά","Κάθε Δευτέρα μόνο"],a:1,e:"sec=0, min=0, hour=9, day-of-week=MON-FRI. Θυμήσου: 6 πεδία, seconds πρώτα."},
{d:8,q:"Τι κάνει το <code>WaitForJobsToComplete = true</code> στο AddQuartzHostedService;",o:["Καθυστερεί το startup","Στο shutdown δεν σκοτώνει την εφαρμογή όσο τρέχει ακόμα job","Σειριακή εκτέλεση jobs","Retry στα failures"],a:1,e:"Graceful shutdown — το τρέχον job ολοκληρώνεται πρώτα."},
{d:8,q:"Το job πυροδοτεί αμέσως στο startup ενώ δεν θες. Ποια η λύση;",o:["Thread.Sleep στο Execute","StartAt(DateTimeOffset.UtcNow.AddSeconds(10)) — καθυστέρηση έναρξης στο trigger","Μικρότερο CRON","Restart"],a:1,e:"Ένα από τα common mistakes της Day 08 — λείπει το start-time delay."},
{d:8,q:"Γιατί πρέπει να γίνεται dispose το HttpResponseMessage;",o:["Για ταχύτητα","Αλλιώς memory leak υπό load — χρησιμοποίησε using ή απευθείας ReadFromJsonAsync()","Για το caching","Δεν χρειάζεται ποτέ"],a:1,e:"Επίσης από τα common mistakes — τα response streams κρατούν πόρους."},
// ---------- DAY 9 (extra) ----------
{d:9,t:1,q:"Ποιο ΔΕΝ είναι λόγος που γράφουμε tests;",o:["Τεκμηριώνουν την πρόθεση (καλύτερο spec)","Safety net για refactoring","Αναγκάζουν καλό design","Αντικαθιστούν το code review"],a:3,e:"Tests: intent, ασφαλές refactoring, design pressure, άμεσα regressions — το review παραμένει ξεχωριστό."},
{d:9,def:1,q:"Τι χαρακτηρίζει ένα <code>[Fact]</code> test;",o:["Πολλά inputs","Parameterless και deterministic — ένα σενάριο, ένα αναμενόμενο αποτέλεσμα","Πάντα async","Τρέχει μόνο σε CI"],a:1,e:"Ίδιες σταθερές συνθήκες σε κάθε run. Για πολλά inputs → [Theory]."},
{d:9,q:"Τι όφελος έχει το naming <code>MethodName_Scenario_ExpectedResult</code>;",o:["Συντομία","Ένα failing test σου λέει ΤΙ ακριβώς χάλασε χωρίς να διαβάσεις κώδικα","Το απαιτεί το xUnit","Ταχύτερη εκτέλεση"],a:1,e:"π.χ. UpdateScore_NegativeScore_ThrowsArgumentOutOfRangeException — αυτοτεκμηριωμένο."},
{d:9,q:"Πώς τεστάρεις ότι μια μέθοδος πετάει exception;",o:["try/catch με bool","Assert.Throws<ArgumentOutOfRangeException>(() => player.UpdateScore(-1))","Το exception περνάει το test αυτόματα","Δεν τεστάρονται exceptions"],a:1,e:"Στο [Theory] παράδειγμα: Act = local function, Assert.Throws το εκτελεί και επιβεβαιώνει τον τύπο."},
{d:9,def:1,q:"Τι κάνει το <code>.Setup()</code> στο Moq;",o:["Καθαρίζει το mock","Ορίζει τι επιστρέφει το fake για συγκεκριμένα inputs — deterministic, χωρίς DB/δίκτυο","Τρέχει το test","Κάνει verify"],a:1,e:"Setup = συμπεριφορά του fake· Verify = επιβεβαίωση ότι κλήθηκε."},
{d:9,def:1,q:"Τι σημαίνει test isolation;",o:["Tests σε ξεχωριστό project","Κάθε test με δικά του mocks/state — καμία κοινή μεταβλητή, τα failures δείχνουν το ακριβές test","Ένα test τη φορά","Tests χωρίς asserts"],a:1,e:"Shared mutable static state = tests που εξαρτώνται από σειρά εκτέλεσης (common mistake)."},
{d:9,q:"Τι κάνει το <code>IClassFixture&lt;TestApiFactory&gt;</code>;",o:["Νέο factory ανά test","Μοιράζεται ΕΝΑ factory σε όλα τα tests της κλάσης — το pipeline σηκώνεται μία φορά","Παραλληλοποιεί τα tests","Κάνει mock το factory"],a:1,e:"Το boot του pipeline είναι ακριβό — μία φορά ανά class, όχι ανά test."},
{d:9,q:"Πώς αφαιρείς το Quartz hosted service στα integration tests;",o:["Σβήνεις το package","Στο ConfigureTestServices: βρίσκεις τα IHostedService του Quartz και τα κάνεις Remove","Με attribute","Δεν γίνεται"],a:1,e:"Το ConfigureTestServices αντικαθιστά/αφαιρεί οποιοδήποτε registration — και βάζει τη test DB."},
{d:9,q:"Πού «ταΐζεις» το connection string του MsSqlContainer;",o:["Στο appsettings.json","GetConnectionString() μετά το StartAsync → στα DbContext options (UseSqlServer)","Σε environment variable πάντα","Δεν χρειάζεται"],a:1,e:"Το container παίρνει random port — το mapped host:port είναι διαθέσιμο αφού ξεκινήσει."},
// ---------- CODE QUESTIONS & GAP FILLERS ----------
{d:1,q:"Τι τυπώνει ο κώδικας;<pre>var a = new List&lt;int&gt; { 1, 2, 3 };\nvar b = a;\nb.Add(4);\nConsole.WriteLine(a.Count);</pre>",o:["3 — το b είναι αντίγραφο","4 — a και b δείχνουν στην ίδια λίστα στο heap","Compile error","Exception"],a:1,e:"Η List<T> είναι reference type — το assignment αντιγράφει το reference, όχι τη λίστα."},
{d:1,q:"Τι τυπώνει ο κώδικας;<pre>Player? p = null;\nConsole.WriteLine(p?.Name ?? \"none\");</pre>",o:["NullReferenceException","null","none","Κενή γραμμή"],a:2,e:"Το p?.Name επιστρέφει null (χωρίς exception) και το ?? δίνει το fallback \"none\"."},
{d:1,q:"Τι τιμή παίρνει το label για score = 500;<pre>string label = score switch\n{\n    0       =&gt; \"New player\",\n    &lt; 1000  =&gt; \"Beginner\",\n    &lt; 10000 =&gt; \"Intermediate\",\n    _       =&gt; \"Expert\",\n};</pre>",o:["New player","Beginner","Intermediate","Expert"],a:1,e:"Τα patterns ελέγχονται με τη σειρά: δεν είναι 0, είναι < 1000 → Beginner."},
{d:1,q:"Τι επιστρέφει το <code>string.IsNullOrWhiteSpace(\"   \")</code>;",o:["false — έχει χαρακτήρες","true — μόνο κενά μετράνε ως «άδειο»","Exception","null"],a:1,e:"Ελέγχει null, κενό ΚΑΙ whitespace-only — γι' αυτό το χρησιμοποιούμε στο input validation του lab."},
{d:1,q:"Τι συμβαίνει εδώ;<pre>public int Score { get; private set; }\n// ...σε άλλη κλάση:\nplayer.Score = 100;</pre>",o:["Δουλεύει κανονικά","Compile error — το set είναι private, μόνο η Player μπορεί να γράψει","Runtime exception","Το Score γίνεται 100 σιωπηλά"],a:1,e:"Encapsulation στην πράξη: ο compiler απαγορεύει την εγγραφή έξω από την κλάση."},
{d:2,q:"Τι τυπώνει ο κώδικας; (polymorphism)<pre>Payment cardPayment = new CardPayment(10.00, \"4111...\");\ncardPayment.Pay();</pre>",o:["Ό,τι ορίζει η Payment.Pay()","Την υλοποίηση της CardPayment — μετράει το runtime type","Compile error — η μεταβλητή είναι Payment","Τίποτα"],a:1,e:"Η μεταβλητή έχει τύπο Payment αλλά το αντικείμενο είναι CardPayment — καλείται η override υλοποίηση."},
{d:2,q:"Τι τυπώνει ο κώδικας;<pre>var r1 = new PaymentRecord { Amount = 10m, CustomerId = 123 };\nvar r2 = new PaymentRecord { Amount = 10m, CustomerId = 123 };\nConsole.WriteLine(r1 == r2);</pre>",o:["False — διαφορετικά references","True — τα records συγκρίνονται με βάση τα περιεχόμενα","Compile error","Εξαρτάται από το GetHashCode"],a:1,e:"Value equality: ίδια περιεχόμενα = ίσα records. Με class θα ήταν False."},
{d:2,q:"Τι κάνει ο κώδικας;<pre>var values = new List&lt;int&gt; { 1, 2 };\nint x = values.First(v =&gt; v == 10);</pre>",o:["x = 0","x = 10","Πετάει InvalidOperationException — κανένα στοιχείο δεν ταιριάζει","x = null"],a:2,e:"First χωρίς match = exception. Το FirstOrDefault θα επέστρεφε 0 (default int)."},
{d:2,q:"Πότε εκτελείται το query στη βάση/συλλογή;<pre>var q = payments.Where(p =&gt; p.CustomerId == 146)\n                .OrderByDescending(p =&gt; p.CreatedAt);\n// ...αργότερα:\nforeach (var p in q) { ... }</pre>",o:["Στη γραμμή του Where","Στη γραμμή του OrderByDescending","Στο foreach — εκεί γίνεται το enumeration","Ποτέ"],a:2,e:"Deferred execution: μέχρι το foreach (ή ToList) υπάρχει μόνο το «σχέδιο» του query."},
{d:2,q:"Τι συμβαίνει εδώ;<pre>dictionary.Add(1, \"one\");\ndictionary.Add(1, \"another\");</pre>",o:["Αντικαθίσταται η τιμή","Πετάει ArgumentException — το key υπάρχει ήδη· το TryAdd θα επέστρεφε false χωρίς exception","Προστίθεται δεύτερη εγγραφή","Τίποτα"],a:1,e:"Add με υπάρχον key = exception. Το dictionary[1] = \"another\" θα έκανε overwrite· το TryAdd χειρίζεται την αποτυχία ήπια."},
{d:3,q:"Τι είναι λάθος σε αυτόν τον κώδικα;<pre>catch (Exception ex)\n{\n    throw ex;\n}</pre>",o:["Τίποτα — είναι σωστός","Το throw ex; μηδενίζει το stack trace — το σωστό είναι σκέτο throw;","Λείπει το finally","Πρέπει να είναι catch(Exception e)"],a:1,e:"Με throw ex; χάνεις το πραγματικό σημείο του σφάλματος — debugging στα τυφλά."},
{d:3,q:"Με τα guards της Day 3, τι επιστρέφει η μέθοδος για amount = 3;<pre>if (amount &lt;= 0) return \"Rejected: must be positive\";\nif (amount &lt; 5m) return \"Rejected: below minimum\";\nif (currency is not (\"EUR\" or \"USD\" or \"GBP\"))\n    return \"Rejected: bad currency\";\nreturn \"OK\";</pre>",o:["Rejected: must be positive","Rejected: below minimum","Rejected: bad currency","OK"],a:1,e:"3 > 0 περνά το πρώτο guard, αλλά 3 < 5 → κόβεται στο δεύτερο. Το happy path είναι flat και τελευταίο."},
{d:3,q:"Τι πρόβλημα έχει αυτό το log;<pre>logger.LogInformation($\"Deposit {amount} for {accountId}\");</pre>",o:["Δεν κάνει compile","Το interpolation παράγει ένα αδιαφανές string — χάνονται τα named properties, δεν γίνεται query στο Kibana","Είναι λάθος level","Λείπει το await"],a:1,e:"Σωστό: LogInformation(\"Deposit {Amount} for {AccountId}\", amount, accountId) — τα placeholders γίνονται πεδία."},
{d:3,q:"Τι τυπώνει αυτός ο κώδικας όταν αποτύχουν 2 από τα 3 tasks;<pre>try { Task.WaitAll(taskA, taskB, taskC); }\ncatch (AggregateException agg)\n{\n    foreach (var inner in agg.InnerExceptions)\n        Console.WriteLine(inner.GetType().Name);\n}</pre>",o:["Τίποτα","Μόνο το πρώτο exception","Και τα 2 exceptions — το InnerExceptions έχει όλα τα faulted tasks","3 γραμμές πάντα"],a:2,e:"InnerExceptions (πληθυντικός) = κάθε faulted task. Το await Task.WhenAll θα έδινε μόνο το πρώτο."},
{d:4,q:"Τι είναι λάθος εδώ;<pre>public class WalletService : IWalletService\n{\n    private IWalletRepository _repo = new EfWalletRepository();\n}</pre>",o:["Το interface είναι περιττό","Κρυφό dependency με new() — «κολλημένο» στο EF, δεν μπορείς να βάλεις fake σε test· inject μέσω constructor","Λάθος access modifier","Πρέπει να είναι static"],a:1,e:"Constructor injection: public WalletService(IWalletRepository repo) — η κλάση δηλώνει τις ανάγκες της, δεν τις χτίζει."},
{d:4,q:"Τι πρόβλημα δημιουργεί αυτό το wiring;<pre>services.AddSingleton&lt;Reporter&gt;();\n// όπου Reporter παίρνει AppDbContext (Scoped) στον constructor</pre>",o:["Κανένα","Captive dependency — ο singleton «αιχμαλωτίζει» το πρώτο DbContext για όλη τη ζωή της εφαρμογής","Compile error","Το DbContext γίνεται αυτόματα Singleton"],a:1,e:"Μεγαλύτερης διάρκειας service δεν κρατά μικρότερης. Εμφανίζεται μόνο υπό load — δύσκολο debug."},
{d:4,q:"Χρειάζεσαι chargeback που μπορεί να πάει το balance αρνητικά. Ποιο strategy;",o:["AddFundsStrategy","SubtractFundsStrategy — με το guard","ForceSubtractFundsStrategy — παρακάμπτει το guard εσκεμμένα, είναι business rule","Κανένα — απαγορεύεται"],a:2,e:"Το force-subtract δεν είναι προχειρότητα: chargebacks, admin corrections, penalties — πραγματικός κανόνας."},
{d:4,q:"Το Program.cs περιέχει υπολογισμό προμήθειας μέσα στο wiring. Τι ισχύει;",o:["ΟΚ, είναι βολικό","Λάθος — το Program.cs είναι Composition Root: ΜΟΝΟ wiring, καθόλου business logic","Σωστό αν είναι λίγες γραμμές","Το απαιτεί το DI"],a:1,e:"Business logic ζει στο Domain/Application — το Composition Root μόνο συναρμολογεί το object graph."},
{d:5,q:"Τι ορίζει αυτό το configuration;<pre>b.Entity&lt;Car&gt;(e =&gt;\n{\n    e.HasOne(c =&gt; c.Company)\n     .WithMany(co =&gt; co.Cars)\n     .HasForeignKey(c =&gt; c.CompanyId);\n});</pre>",o:["Ένα index","Τη σχέση 1:N — κάθε Car ανήκει σε μία Company μέσω FK CompanyId","Το primary key","Ένα JOIN query"],a:1,e:"OnModelCreating: HasOne/WithMany/HasForeignKey = το FK relationship. HasKey = PK, HasIndex = index."},
{d:5,q:"Τι κάνει το <code>e.HasKey(c => c.Id)</code> στο OnModelCreating;",o:["Δημιουργεί foreign key","Ορίζει το primary key της οντότητας","Κάνει την Id required","Δημιουργεί unique index μόνο"],a:1,e:"HasKey = PK. Το ValueGeneratedNever() δίπλα σημαίνει ότι δεν το παράγει η βάση."},
{d:5,q:"Ποια εντολή ΕΦΑΡΜΟΖΕΙ τα pending migrations στη βάση;",o:["Add-Migration","Update-Database","Script-Migration","Scaffold-DbContext"],a:1,e:"Add-Migration δημιουργεί το migration, Update-Database το τρέχει, Script-Migration βγάζει SQL, Scaffold-DbContext κάνει DB-first generation."},
{d:5,q:"Σε τι χρησιμεύει το <code>Script-Migration</code>;",o:["Τρέχει τα migrations","Παράγει SQL script για review από DBA — σημαντικό σε regulated environments","Σβήνει migrations","Κάνει backup"],a:1,e:"Από την Day 05: «script → SQL for review (regulated envs!)» — δεν αγγίζεις παραγωγική βάση χωρίς έλεγχο."},
{d:5,q:"Πόσα SQL queries τρέχει αυτός ο κώδικας;<pre>var query = _db.Cars.AsNoTracking()\n    .Include(c =&gt; c.Company).AsQueryable();\nif (companyName is not null)\n    query = query.Where(c =&gt; c.Company.Name == companyName);\nreturn await query.ToArrayAsync();</pre>",o:["Ένα ανά Where","Δύο — ένα για Cars, ένα για Companies","Ένα — όλα συντίθενται στο expression tree και τρέχουν στο ToArrayAsync","Κανένα"],a:2,e:"IQueryable deferred: προσθέτεις φίλτρα υπό συνθήκη και ΕΝΑ SQL (με JOIN λόγω Include) τρέχει στο materialisation."},
{d:5,q:"Τι γράφεται στη βάση;<pre>_db.Cars.Add(car);\n// τέλος μεθόδου — χωρίς SaveChangesAsync</pre>",o:["Το INSERT εκτελείται αμέσως στο Add","Τίποτα — το entity είναι απλώς σε state Added· χωρίς SaveChanges δεν παράγεται SQL","Γράφεται στο commit του request","Μισό row"],a:1,e:"Load → mutate → save: ο change tracker παράγει SQL μόνο στο SaveChanges."},
{d:5,q:"Τι πρόβλημα έχει αυτό;<pre>var sql = \"SELECT * FROM Cars WHERE Model = '\" + model + \"'\";</pre>",o:["Αργό parsing","SQL injection — το input μπαίνει αυτούσιο στο SQL· χρησιμοποίησε @Model parameter","Λείπει το ORDER BY","Το SELECT * είναι το μόνο θέμα"],a:1,e:"Ποτέ string concatenation με user input — parameters παντού (και στο Dapper: new { Model = m })."},
{d:5,q:"Τι επιστρέφει το query;<pre>SELECT CompanyId, COUNT(*) AS Cars\nFROM Cars\nGROUP BY CompanyId\nHAVING COUNT(*) &gt; 1;</pre>",o:["Όλες τις εταιρείες","Τα CompanyId που έχουν ΠΑΝΩ από ένα αυτοκίνητο, με το πλήθος τους","Τα αυτοκίνητα χωρίς εταιρεία","Ένα σύνολο για όλο τον πίνακα"],a:1,e:"GROUP BY ανά CompanyId → COUNT ανά group → HAVING κρατά μόνο τα groups με >1."},
{d:6,q:"Τι επιστρέφει αυτό το action για ανύπαρκτο id;<pre>[HttpGet(\"{id:int}\")]\npublic async Task&lt;IActionResult&gt; GetById([FromRoute] int id)\n{\n    var player = await _playerService.GetByIdAsync(id);\n    return player is null ? NotFound() : Ok(player);\n}</pre>",o:["200 με null body","404 Not Found","400","500"],a:1,e:"Το pattern του μαθήματος: null από το service → NotFound(), αλλιώς Ok(player)."},
{d:6,q:"Τι είναι επικίνδυνο εδώ;<pre>public async void HandleRequest()\n{\n    await _db.SaveChangesAsync();\n}</pre>",o:["Το await","Το async void — ένα exception εδώ δεν μπορεί να παρακολουθηθεί και ρίχνει όλη τη διεργασία· επίστρεψε Task","Το SaveChanges","Τίποτα"],a:1,e:"Golden rule: ποτέ async void (εκτός από event handlers) — πάντα Task."},
{d:6,q:"Τι κίνδυνο έχει αυτή η γραμμή σε web app;<pre>var data = GetDataAsync().Result;</pre>",o:["Κανέναν — είναι συντομογραφία","Μπλοκάρει το thread συγχρονισμένα → κίνδυνος deadlock· χρησιμοποίησε await","Τρέχει δύο φορές","Χάνει τα δεδομένα"],a:1,e:".Result/.Wait() σε async κώδικα = deadlock recipe. Async all the way."},
{d:6,q:"Τι λείπει από αυτόν τον κώδικα;<pre>cache.Set(CacheKey, rankings);</pre>",o:["Το await","Το TTL (π.χ. AbsoluteExpirationRelativeToNow) — χωρίς αυτό το entry ζει για πάντα → memory exhaustion","Το lock","Το serialization"],a:1,e:"Από τα common mistakes της Day 6: unbounded cache μεγαλώνει μέχρι OOM."},
{d:6,def:1,q:"Τι πρόβλημα λύνει το stampede protection;",o:["Stale data","Όταν λήξει ένα δημοφιλές entry, ΠΟΛΛΑ ταυτόχρονα requests βλέπουν miss και χτυπούν όλα μαζί τη DB","Το cache γεμίζει","Λάθος keys"],a:1,e:"Ταυτόχρονα misses = «ποδοπάτημα» της βάσης — μία ανανέωση πρέπει να γίνει, οι υπόλοιποι περιμένουν/παίρνουν το παλιό."},
{d:6,q:"Τι πετυχαίνει το <code>CreatedAtAction(nameof(GetById), new { id }, new { id })</code>;",o:["Redirect στο GetById","201 Created με Location header που δείχνει στο νέο resource (route του GetById)","200 με το id","Καλεί το GetById εσωτερικά"],a:1,e:"Το σωστό response για POST create: 201 + Location — ο client ξέρει πού ζει το νέο resource."},
{d:6,q:"Τι κάνει το <code>AddValidatorsFromAssemblyContaining&lt;Program&gt;()</code>;",o:["Τρέχει τα validators χειροκίνητα","Καταχωρεί αυτόματα όλους τους FluentValidation validators του assembly — τρέχουν πριν το action","Δημιουργεί validators","Κάνει validate το Program.cs"],a:1,e:"Μία εγγραφή στο Program.cs — syntax errors κόβονται στο 400 gate πριν φτάσουν στο business logic."},
{d:7,q:"Ποια είναι η σωστή υπογραφή handler για <code>record CreateCarCommand(...) : IRequest&lt;int&gt;</code>;",o:["void Handle(CreateCarCommand cmd)","Task&lt;int&gt; Handle(CreateCarCommand request, CancellationToken ct) — επιστρέφει το Id","Task&lt;Car&gt; Handle(...) — το entity","int Handle(...)"],a:1,e:"IRequestHandler<CreateCarCommand, int> → Task<int>. Το command επιστρέφει Id, ποτέ entity."},
