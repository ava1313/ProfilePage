{d:7,q:"Τι είναι λάθος σε αυτόν τον decorator;<pre>public Task&lt;TResponse&gt; Handle(TRequest request, CancellationToken ct)\n{\n    _logger.LogInformation(\"{Name}\", typeof(TRequest).Name);\n    return Task.FromResult(default(TResponse));\n}</pre>",o:["Το logging","ΔΕΝ κάνει delegate στο _inner.Handle() — ο πραγματικός handler δεν θα τρέξει ποτέ","Το CancellationToken","Το generic constraint"],a:1,e:"Κανόνας 3 του decorator: πάντα delegation στο inner (πριν/μετά το δικό σου behaviour)."},
{d:7,q:"Τι είναι λάθος εδώ;<pre>public CreateCarCommandValidator(ICarRepository repo)\n{\n    RuleFor(x =&gt; x.CompanyId)\n        .Must(id =&gt; repo.GetById(id) != null);\n}</pre>",o:["Το Must","Repository lookup μέσα σε validator — τα cross-entity checks ανήκουν στον handler","Λείπει το NotEmpty","Το DI στον validator"],a:1,e:"Ο validator ελέγχει το ΣΧΗΜΑ του input (NotEmpty, GreaterThan)· το «υπάρχει η εταιρεία;» είναι δουλειά του handler."},
{d:7,q:"Τι συμβαίνει με αυτή την κλήση;<pre>await _mediator.Publish(new CarTransferredEvent(carId, fromId, toId), ct);</pre>",o:["Τρέχει ένας μόνο handler","Τρέχουν ΟΛΟΙ οι INotificationHandler&lt;CarTransferredEvent&gt; (π.χ. audit log + recipient notification) — ανεξάρτητα","Επιστρέφει το event","Στέλνεται στο queue"],a:1,e:"Publish = notification σε πολλούς handlers· Send = request σε ακριβώς έναν."},
{d:8,q:"Στο <code>Policy.WrapAsync(retry, circuitBreaker, timeout)</code>, ποια πολιτική είναι η ΕΞΩΤΕΡΙΚΗ;",o:["timeout","circuitBreaker","retry — outermost πρώτο, innermost πιο κοντά στην εκτέλεση","Καμία — τρέχουν παράλληλα"],a:2,e:"Η σειρά στο WrapAsync: πρώτο όρισμα = εξωτερικό στρώμα. Το timeout είναι πιο κοντά στην πραγματική κλήση."},
{d:8,q:"Τι σημαίνει το CRON <code>0 0 8,18 * * ?</code>;",o:["Κάθε 8 και 18 λεπτά","Στις 08:00 και στις 18:00 κάθε μέρα","Από τις 8 έως τις 18","18 φορές στις 8"],a:1,e:"sec=0, min=0, hours=8,18 — το κόμμα δίνει λίστα τιμών."},
{d:8,q:"Το API έχει default namespace αλλά γράφεις:<pre>var rates = doc.Descendants(\"Rate\");</pre>Τι θα πάρεις;",o:["Όλα τα Rate elements","Κενό αποτέλεσμα — χωρίς το XNamespace τα queries δεν ταιριάζουν με namespaced elements","Exception","Τα μισά"],a:1,e:"Σωστό: doc.Descendants(ns + \"Rate\") όπου ns = XNamespace.Get(...). Κλασικό λάθος της Day 08."},
{d:8,q:"Τι πετυχαίνει το <code>jex.RefireImmediately = false;</code> στο JobExecutionException;",o:["Ακυρώνει το job μόνιμα","Το Quartz ΔΕΝ ξανατρέχει το job αμέσως μετά το failure — περιμένει το επόμενο κανονικό trigger","Retry κάθε δευτερόλεπτο","Σβήνει το trigger"],a:1,e:"Το JobExecutionException σου δίνει έλεγχο του retry behaviour μετά από αποτυχία."},
{d:8,q:"Γιατί το IJob παίρνει τα dependencies του από constructor;",o:["Δεν τα παίρνει — χρησιμοποιεί static","Το job factory (π.χ. AutofacJobFactory / AddJob με DI) φτιάχνει το instance μέσω του container — κανονικό constructor injection","Μέσω του JobDataMap μόνο","Με reflection στο Execute"],a:1,e:"q.AddJob<DataFetchJob>(...) — το DI container κάνει resolve gateway/repo/logger όπως σε κάθε άλλη κλάση."},
{d:9,q:"Πόσες φορές τρέχει αυτό το test;<pre>[Theory]\n[InlineData(0)]\n[InlineData(-1)]\npublic void UpdateScore_NonPositive_Throws(int newScore) { ... }</pre>",o:["Μία με και τα δύο inputs","Δύο ανεξάρτητα runs — ένα ανά InlineData","Καμία — θέλει [Fact]","Τρεις"],a:1,e:"Κάθε data row = ξεχωριστό, ανεξάρτητο test run με το δικό του αποτέλεσμα."},
{d:9,q:"Πότε ΑΠΟΤΥΓΧΑΝΕΙ αυτό το assert;<pre>_repoMock.Verify(m =&gt; m.AddAsync(player, It.IsAny&lt;CancellationToken&gt;()), Times.Once);</pre>",o:["Αν κλήθηκε ακριβώς μία φορά","Αν κλήθηκε 0 ή 2+ φορές — το Times.Once απαιτεί ακριβώς μία κλήση","Μόνο αν πετάξει exception","Ποτέ"],a:1,e:"Verify + Times = επιβεβαίωση interaction — ουσιώδες για handlers χωρίς return value."},
{d:9,q:"Τι θα συμβεί εδώ;<pre>var mock = new Mock&lt;PlayerService&gt;(); // concrete class\nmock.Setup(s =&gt; s.CreateAsync(...)); // non-virtual μέθοδος</pre>",o:["Δουλεύει κανονικά","Το Moq θα αποτύχει — δεν κάνει mock non-virtual methods· κάνε mock το IPlayerService","Γίνεται αυτόματα virtual","Το test περνάει πάντα"],a:1,e:"Πάντα mock interfaces — ένας ακόμα λόγος που το DI με interfaces είναι προαπαιτούμενο για testable κώδικα."},
{d:9,q:"Τι πετυχαίνει αυτό στο TestApiFactory;<pre>services.RemoveAll&lt;DbContextOptions&lt;AppDbContext&gt;&gt;();\nservices.AddDbContext&lt;AppDbContext&gt;(o =&gt;\n    o.UseInMemoryDatabase(_dbName));</pre>",o:["Σβήνει τη βάση παραγωγής","Αντικαθιστά το πραγματικό DB registration με in-memory για τα tests — το υπόλοιπο pipeline μένει αληθινό","Κάνει mock το DbContext","Δημιουργεί migration"],a:1,e:"ConfigureTestServices: αφαιρείς το πραγματικό registration, βάζεις test double — real middleware/DI, ελεγχόμενη βάση."},
{d:9,q:"Σε ποια μετρική υπερτερούν τα unit tests έναντι των integration;",o:["Ρεαλισμός dependencies","Ταχύτητα (ms) και ακριβής εντοπισμός του failure σε μία κλάση","Κάλυψη πολλών layers","System-level feedback"],a:1,e:"Unit: γρήγορα, isolated, exact failure. Integration: πραγματικές εξαρτήσεις, system-level — πιο αργά και ακριβά."},
// ---------- TRAP QUESTIONS ----------
{d:1,t:1,q:"Τι τυπώνει ο κώδικας;<pre>string s1 = \"novibet\";\nstring s2 = \"novibet\";\nConsole.WriteLine(s1 == s2);</pre>",o:["False — reference types, διαφορετικά references","True — το string κάνει override τον == και συγκρίνει ΠΕΡΙΕΧΟΜΕΝΟ (η μεγάλη εξαίρεση)","Compile error","True — το string είναι value type"],a:1,e:"ΠΑΓΙΔΑ: το string είναι reference type, αλλά ο == του είναι overloaded για σύγκριση τιμών. Στις ΔΙΚΕΣ σου κλάσεις ο == συγκρίνει references."},
{d:1,t:1,q:"Το Point είναι <code>struct</code>. Τι τυπώνει;<pre>Point p1 = new Point { X = 1 };\nPoint p2 = p1;\np2.X = 99;\nConsole.WriteLine(p1.X);</pre>",o:["99 — ίδιο αντικείμενο","1 — τα structs είναι value types, το p2 είναι ΑΝΤΙΓΡΑΦΟ","0","NullReferenceException"],a:1,e:"ΠΑΓΙΔΑ: μοιάζει με το παράδειγμα της κλάσης Player, αλλά το struct αντιγράφεται στο assignment — όπως το int."},
{d:2,t:1,q:"Το <code>record</code> είναι value type ή reference type;",o:["Value type — αφού έχει value equality","Reference type — ζει στο heap, απλώς ΣΥΓΚΡΙΝΕΤΑΙ με value equality","Struct πάντα","Εξαρτάται από τα properties"],a:1,e:"ΠΑΓΙΔΑ: value equality ≠ value type. Το record (χωρίς struct keyword) είναι reference type στο heap — μόνο η ισότητά του συμπεριφέρεται «σαν τιμή»."},
{d:4,t:1,q:"Transient service γίνεται inject σε ΔΥΟ κλάσεις μέσα στο ΙΔΙΟ HTTP request. Πόσα instances δημιουργούνται;",o:["Ένα — είναι το ίδιο request","Δύο — Transient σημαίνει νέο instance σε ΚΑΘΕ injection· το «ένα ανά request» είναι το Scoped","Κανένα","Εξαρτάται από το thread"],a:1,e:"ΠΑΓΙΔΑ: πολλοί μπερδεύουν Transient με Scoped. Scoped = ίδιο instance μέσα στο request· Transient = φρέσκο κάθε φορά."},
{d:5,t:1,q:"Πόσες φορές τρέχει το SQL;<pre>var q = db.Cars.Where(c =&gt; c.Model == \"Ka\");\nvar a = await q.ToListAsync();\nvar b = await q.ToListAsync();</pre>",o:["Μία — το αποτέλεσμα κασάρεται","Δύο — ΚΑΘΕ materialisation ξανατρέχει το query στη βάση","Καμία","Μία, η δεύτερη διαβάζει από τον change tracker"],a:1,e:"ΠΑΓΙΔΑ: το IQueryable είναι σχέδιο, όχι αποτέλεσμα — κάθε ToListAsync = νέο round trip. Αν το θες μία φορά, κράτα τη λίστα."},
{d:5,t:1,q:"Τι θα σωθεί στη βάση;<pre>var car = await _db.Cars.AsNoTracking()\n    .FirstAsync(c =&gt; c.Id == 1);\ncar.Model = \"Focus\";\nawait _db.SaveChangesAsync();</pre>",o:["Το νέο Model","ΤΙΠΟΤΑ — το AsNoTracking σημαίνει ότι το entity δεν παρακολουθείται· ο tracker δεν βλέπει την αλλαγή","Όλο το entity ξαναγράφεται","Exception"],a:1,e:"ΠΑΓΙΔΑ: AsNoTracking είναι για read-only. Για update: load ΧΩΡΙΣ AsNoTracking, ή Attach + IsModified."},
{d:6,t:1,q:"Καλείς <code>POST /api/players</code> δύο φορές με ΑΚΡΙΒΩΣ το ίδιο body. Τι συμβαίνει;",o:["Η δεύτερη αγνοείται","Δημιουργούνται ΔΥΟ resources — το POST δεν είναι idempotent","409 πάντα","Η δεύτερη κάνει update"],a:1,e:"ΠΑΓΙΔΑ: ίδιο body ≠ ίδιο αποτέλεσμα. Το POST δημιουργεί νέο resource κάθε φορά — γι' αυτό δεν είναι idempotent (αντίθετα με το PUT)."},
{d:6,t:1,q:"DELETE σε resource: η 1η κλήση επιστρέφει 204, η 2η 404. Είναι το DELETE idempotent;",o:["Όχι — διαφορετικά responses","Ναι — το idempotency αφορά το STATE του server (το resource παραμένει διαγραμμένο), όχι το ίδιο response","Όχι — μόνο το GET είναι","Μόνο αν επιστρέφει 204 και τις δύο φορές"],a:1,e:"ΠΑΓΙΔΑ: N κλήσεις = ίδιο αποτέλεσμα στον server. Το status code μπορεί να διαφέρει — το state όχι."},
{d:8,t:1,q:"Τι σημαίνει το Quartz CRON <code>0/5 * * * * ?</code>;",o:["Κάθε 5 λεπτά","Κάθε 5 ΔΕΥΤΕΡΟΛΕΠΤΑ — το πρώτο πεδίο στο Quartz είναι τα seconds","Στις 5:00","Κάθε 5 ώρες"],a:1,e:"ΠΑΓΙΔΑ: σύγκρινε με το 0 0/5 * * * ? (κάθε 5 λεπτά). Στο Unix cron το πρώτο πεδίο είναι λεπτά — στο Quartz είναι ΔΕΥΤΕΡΟΛΕΠΤΑ."},
{d:9,t:1,q:"Τι θα συμβεί εδώ;<pre>[Fact]\npublic void UpdateScore_Works(int score) { ... }</pre>",o:["Τρέχει με score = 0","Σφάλμα — το [Fact] είναι PARAMETERLESS· με παραμέτρους χρειάζεσαι [Theory] + [InlineData]","Τρέχει μία φορά ανά int","Τρέχει με random τιμή"],a:1,e:"ΠΑΓΙΔΑ: [Fact] = χωρίς inputs, ένα σταθερό σενάριο. Data-driven = [Theory]."},
// ---------- ΟΡΙΣΜΟΙ · DAY 1 ----------
{d:1,def:1,s:1,q:"Τι είναι ένα <b>value type</b>;",o:["Τύπος που κρατά την ΙΔΙΑ ΤΗΝ ΤΙΜΗ — στο assignment αντιγράφεται και ζει συνήθως στο stack","Τύπος που κρατά διεύθυνση μνήμης","Τύπος που δεν αλλάζει ποτέ","Τύπος που διαχειρίζεται ο GC"],a:0,e:"int, double, bool, char, decimal, DateTime, Guid, struct, enum. Κάθε μεταβλητή έχει το δικό της αντίγραφο."},
{d:1,def:1,s:1,q:"Τι είναι ένα <b>reference type</b>;",o:["Τύπος με σταθερό μέγεθος","Τύπος που η μεταβλητή κρατά ΑΝΑΦΟΡΑ (διεύθυνση) προς αντικείμενο στο heap — το assignment μοιράζεται το ίδιο αντικείμενο","Τύπος μόνο για strings","Τύπος που δεν δέχεται null"],a:1,e:"class, string, array, List&lt;T&gt;, delegate, interface. Δύο μεταβλητές μπορούν να δείχνουν στο ίδιο αντικείμενο."},
{d:1,def:1,q:"Τι είναι το <b>stack</b> και τι το <b>heap</b>;",o:["Δύο ονόματα για το ίδιο πράγμα","Stack = γρήγορη, οργανωμένη μνήμη με αυτόματο καθάρισμα ανά μέθοδο· Heap = ελεύθερη περιοχή για αντικείμενα, την καθαρίζει ο GC","Stack = δίσκος, Heap = RAM","Heap = για τοπικές μεταβλητές, Stack = για αντικείμενα"],a:1,e:"Value types → stack (τοπικά), reference types → το αντικείμενο στο heap και η αναφορά στο stack."},
{d:1,def:1,q:"Τι είναι ο <b>Garbage Collector (GC)</b>;",o:["Εργαλείο που σβήνει αρχεία build","Αυτόματος διαχειριστής μνήμης του .NET που ελευθερώνει αντικείμενα του heap χωρίς εκκρεμείς αναφορές","Ο compiler","Debugger για memory leaks"],a:1,e:"Δεν χρειάζεσαι manual free/delete — αλλά ο GC δεν σε γλιτώνει από leaks λόγω αναφορών που κρατάς ζωντανές."},
{d:1,def:1,s:1,q:"Τι είναι το <b>encapsulation</b> (ενθυλάκωση);",o:["Η ομαδοποίηση αρχείων σε φακέλους","Το «κλείσιμο» δεδομένων + συμπεριφοράς σε μία μονάδα, με ελεγχόμενη πρόσβαση από έξω (private fields, public API)","Η κληρονομικότητα","Το wrapping ενός exception"],a:1,e:"π.χ. Score { get; private set; } — η κλάση προστατεύει την εσωτερική της κατάσταση από αυθαίρετες αλλαγές."},
{d:1,def:1,q:"Τι είναι ένα <b>property</b> στη C#;",o:["Δημόσιο field","«Έξυπνο» μέλος με get/set accessors που ελέγχει την πρόσβαση σε υποκείμενα δεδομένα","Μέθοδος χωρίς παραμέτρους","Attribute της κλάσης"],a:1,e:"Δίνει το API ενός field με τον έλεγχο μιας μεθόδου — γι' αυτό δεν εκθέτουμε ποτέ public fields."},
{d:1,def:1,q:"Τι είναι ένας <b>constructor</b>;",o:["Μέθοδος που καλείται στο τέλος ζωής του αντικειμένου","Ειδική μέθοδος που τρέχει στη δημιουργία του αντικειμένου και το φέρνει σε έγκυρη αρχική κατάσταση","Το κύριο entry point του προγράμματος","Ο GC finaliser"],a:1,e:"Εκεί μπαίνει το validation των required properties — ποτέ αντικείμενο σε invalid state."},
{d:1,def:1,q:"Τι είναι ένα <b>namespace</b>;",o:["Ένας φάκελος στον δίσκο","Λογικό «όνομα-χώρος» που ομαδοποιεί σχετικούς τύπους και αποτρέπει συγκρούσεις ονομάτων","Ένα NuGet package","Το assembly"],a:1,e:"π.χ. System.Linq, System.Collections.Generic. Με using φέρνεις το namespace στο αρχείο σου."},
{d:1,def:1,q:"Τι είναι το <b>CLR</b>;",o:["Το IDE της Microsoft","Το Common Language Runtime — η εικονική μηχανή που εκτελεί τον .NET κώδικα (JIT, memory management, GC, exceptions)","Ένας compiler C#","Ένα NuGet feed"],a:1,e:"Ο C# κώδικας γίνεται IL και το CLR τον μεταφράζει (JIT) σε machine code κατά την εκτέλεση."},
{d:1,def:1,q:"Ποια η διαφορά <b>.NET SDK</b> και <b>.NET Runtime</b>;",o:["Καμία","SDK = εργαλεία ανάπτυξης (compiler, dotnet CLI, templates)· Runtime = ό,τι χρειάζεται μόνο για να ΤΡΕΞΕΙ μια εφαρμογή","SDK για Windows, Runtime για Linux","Runtime περιέχει το SDK"],a:1,e:"Στον dev υπολογιστή SDK· στον production server συνήθως αρκεί το runtime."},
{d:1,def:1,q:"Τι είναι τα <b>nullable reference types</b> (.NET 6+);",o:["Νέος τύπος δεδομένων","Compiler feature: το <code>string</code> θεωρείται non-null και το <code>string?</code> ρητά nullable — προειδοποιήσεις πριν το NullReferenceException","Runtime έλεγχος null","Το Nullable&lt;T&gt;"],a:1,e:"Καθαρά compile-time βοήθεια για να κάνεις ρητή την πρόθεσή σου γύρω από το null."},
{d:1,def:1,q:"Τι είναι μια <b>collection</b>;",o:["Ένας τύπος δεδομένων μιας τιμής","Δομή που κρατά και διαχειρίζεται πολλά στοιχεία (List, Dictionary, HashSet, Queue, Stack, Array)","Ένα namespace","Μια βάση δεδομένων"],a:1,e:"Διαλέγεις με βάση την πρόσβαση που θες: index (List), key (Dictionary), μοναδικότητα (HashSet), FIFO (Queue), LIFO (Stack)."},
{d:1,def:1,q:"Τι είναι ένα <b>branch</b> στο Git;",o:["Αντίγραφο του repository σε άλλον server","Ανεξάρτητη γραμμή ανάπτυξης — δουλεύεις χωρίς να αγγίζεις το main μέχρι να γίνει merge","Ένα commit","Ένα tag έκδοσης"],a:1,e:"feature branch → commits → push → Pull Request → review → merge στο main."},
{d:1,def:1,q:"Τι είναι ένα <b>Pull Request</b>;",o:["Εντολή που κατεβάζει αλλαγές","Αίτημα να ενσωματωθεί το branch σου στο main — το σημείο όπου γίνεται code review και τρέχουν τα checks","Ένα force push","Το git pull"],a:1,e:"Το main είναι source of truth: κάθε αλλαγή περνά από PR και review, ποτέ απευθείας commit."},
{d:1,def:1,q:"Τι είναι το <b>.gitignore</b>;",o:["Λίστα με τα αρχεία που θα γίνουν commit","Αρχείο που ορίζει ποια paths αγνοεί το Git (π.χ. bin/, obj/, secrets)","Ρύθμιση του compiler","Backup των αλλαγών"],a:1,e:"Build output και μυστικά δεν μπαίνουν ΠΟΤΕ στο repo — dotnet new gitignore."},
// ---------- ΟΡΙΣΜΟΙ · DAY 2 ----------
{d:2,def:1,s:1,q:"Τι είναι ο <b>αντικειμενοστρεφής προγραμματισμός (OOP)</b>;",o:["Τρόπος γραφής κώδικα σε ένα μεγάλο αρχείο","Παράδειγμα προγραμματισμού που οργανώνει τον κώδικα σε αντικείμενα — δεδομένα + συμπεριφορά μαζί — με τέσσερις πυλώνες: encapsulation, inheritance, polymorphism, abstraction","Βιβλιοθήκη της .NET","Σχεδιαστικό pattern"],a:1,e:"Έναντι του procedural: δομή, επαναχρησιμοποίηση (DRY), ευκολότερο testing και συντήρηση."},
{d:2,def:1,q:"Τι είναι μια <b>class</b>;",o:["Ένα αντικείμενο στη μνήμη","Το «καλούπι»/blueprint που περιγράφει τι δεδομένα και τι συμπεριφορά θα έχουν τα αντικείμενά της","Ένα namespace","Ένα interface με υλοποίηση"],a:1,e:"Η κλάση είναι ο ορισμός· το αντικείμενο (instance) είναι το συγκεκριμένο «αντίτυπο» στη μνήμη."},
{d:2,def:1,q:"Τι είναι ένα <b>object (instance)</b>;",o:["Ο ορισμός του τύπου","Συγκεκριμένο «αντίτυπο» μιας κλάσης στη μνήμη, με δικές του τιμές — δημιουργείται με <code>new</code>","Ένα static μέλος","Ένα struct μόνο"],a:1,e:"Μία κλάση Player → χιλιάδες Player objects, καθένα με δικό του Name/Score."},
{d:2,def:1,s:1,q:"Τι είναι η <b>κληρονομικότητα (inheritance)</b>;",o:["Η αντιγραφή κώδικα από κλάση σε κλάση","Μηχανισμός όπου μια derived class παίρνει δεδομένα/συμπεριφορά μιας base class και μπορεί να τα επεκτείνει","Η υλοποίηση interface","Η σύνθεση αντικειμένων"],a:1,e:"public class CardPayment : Payment. Στη C# μία μόνο base class, αλλά πολλά interfaces."},
{d:2,def:1,s:1,q:"Τι είναι ο <b>πολυμορφισμός (polymorphism)</b>;",o:["Πολλές κλάσεις στο ίδιο αρχείο","Η ικανότητα ο ίδιος κώδικας να καλεί διαφορετική υλοποίηση ανάλογα με τον ΠΡΑΓΜΑΤΙΚΟ (runtime) τύπο του αντικειμένου","Η υπερφόρτωση τελεστών μόνο","Το generics"],a:1,e:"Payment p = new CardPayment(); p.Pay(); → τρέχει η υλοποίηση της CardPayment (virtual/override)."},
{d:2,def:1,q:"Τι είναι η <b>αφαίρεση (abstraction)</b>;",o:["Η απόκρυψη αρχείων","Η έκθεση μόνο του «τι κάνει» κάτι, κρύβοντας το «πώς» — προγραμματίζεις σε abstractions (interfaces/abstract classes), όχι σε λεπτομέρειες","Η διαγραφή κώδικα","Το inheritance"],a:1,e:"Ο caller ξέρει IPaymentProcessor.Process() — δεν τον νοιάζει αν από κάτω είναι Stripe ή PayPal."},
{d:2,def:1,s:1,q:"Τι είναι ένα <b>interface</b>;",o:["Κλάση με μερική υλοποίηση","Καθαρό συμβόλαιο (contract): δηλώνει ΤΙ μέλη πρέπει να έχει ένας τύπος, χωρίς state — μια κλάση μπορεί να υλοποιεί πολλά","Ένα abstract class synonym","Ένα UI layer"],a:1,e:"Βάση για DI και testability: εξαρτάσαι από το IWalletRepository, όχι από τη συγκεκριμένη υλοποίηση."},
{d:2,def:1,q:"Τι είναι μια <b>abstract class</b>;",o:["Κλάση που δεν έχει μέλη","Μερικό blueprint: ΔΕΝ γίνεται instantiate, μπορεί να έχει κοινή υλοποίηση + abstract members που οι υποκλάσεις υποχρεούνται να υλοποιήσουν","Ένα interface","Sealed κλάση"],a:1,e:"Abstract class όταν θες κοινή βάση/shared data· interface όταν θες μόνο contract."},
{d:2,def:1,q:"Τι είναι το ζευγάρι <b>virtual / override</b>;",o:["Access modifiers","virtual = η base επιτρέπει αντικατάσταση της μεθόδου· override = η derived δίνει τη δική της υλοποίηση","Τα ίδια με abstract","Generics constraints"],a:1,e:"Χωρίς virtual δεν υπάρχει runtime polymorphism — γι' αυτό και το Moq δεν κάνει mock non-virtual methods."},
{d:2,def:1,q:"Τι είναι ένα <b>static</b> μέλος;",o:["Μέλος που δεν αλλάζει τιμή","Μέλος που ανήκει στον ΤΥΠΟ και όχι σε κάποιο instance — κοινό για όλους, χωρίς new","Μέλος μόνο για read","private μέλος"],a:1,e:"Χρήσιμο για helpers/σταθερές· επικίνδυνο ως shared mutable state (σπάει το test isolation)."},
{d:2,def:1,s:1,q:"Τι είναι τα <b>generics</b>;",o:["Κλάσεις χωρίς όνομα","Παραμετροποίηση τύπου: γράφεις κώδικα μία φορά για οποιονδήποτε T, με type safety και χωρίς boxing","Δυναμικοί τύποι (dynamic)","Interfaces με πολλές υλοποιήσεις"],a:1,e:"List&lt;int&gt; vs ArrayList: οι generic collections αποφεύγουν boxing και λάθος τύπους στο runtime."},
{d:2,def:1,s:1,q:"Τι είναι το <b>LINQ</b>;",o:["Βάση δεδομένων της Microsoft","Language-Integrated Query — ενιαία σύνταξη ερωτημάτων (Where/Select/GroupBy...) πάνω σε collections, DB, XML","ORM","Ένα NuGet για SQL"],a:1,e:"System.Linq. Πάνω σε IEnumerable&lt;T&gt; εκτελείται στη μνήμη· πάνω σε IQueryable&lt;T&gt; μεταφράζεται σε SQL."},
{d:2,def:1,q:"Τι είναι μια <b>lambda expression</b>;",o:["Ένα async method","Ανώνυμη συνάρτηση σε συμπαγή μορφή <code>x =&gt; x.Score &gt; 100</code>, που περνιέται ως όρισμα","Ένα delegate type","Ένα LINQ operator"],a:1,e:"Είναι το «σώμα» των LINQ operators, των Moq setups και των configuration callbacks."},
{d:2,def:1,q:"Τι είναι το <b>IEnumerable&lt;T&gt;</b>;",o:["Λίστα με index","Το βασικό interface για ακολουθία στοιχείων που μπορείς να διατρέξεις (foreach) — χωρίς εγγύηση για μέγεθος ή τυχαία πρόσβαση","Ένα Dictionary","Ένα IQueryable"],a:1,e:"Το πιο «φτωχό» αλλά πιο ευέλικτο contract — γι' αυτό το επιστρέφουν τα LINQ queries (deferred)."},
{d:2,def:1,s:1,q:"Τι είναι ένα <b>record</b>;",o:["Μια γραμμή βάσης δεδομένων","Reference type σχεδιασμένος για ΔΕΔΟΜΕΝΑ: value equality, concise σύνταξη, immutability με init — αντί για class σε DTOs/messages","Ένα struct","Ένα interface"],a:1,e:"Κανόνας: record για data (DTOs, commands, value objects), class για behaviour."},
{d:2,def:1,s:1,q:"Τι είναι ένα <b>Task</b>;",o:["Ένα thread","Η αναπαράσταση μιας ασύγχρονης εργασίας που θα ολοκληρωθεί στο μέλλον (με ή χωρίς αποτέλεσμα)","Ένα background job","Ένα process"],a:1,e:"Task ≠ thread. Το Task μπορεί να είναι απλώς «περιμένω I/O» χωρίς κανένα thread δεσμευμένο."},
{d:2,def:1,s:1,q:"Τι είναι το <b>async/await</b>;",o:["Τρόπος να τρέξεις κώδικα σε πολλά cores","Συντακτικό που επιτρέπει σε μια μέθοδο να «παύσει» περιμένοντας I/O ΧΩΡΙΣ να μπλοκάρει το thread — ο compiler φτιάχνει state machine","Ένα thread pool","Ένα pattern για retry"],a:1,e:"async = concurrency χωρίς σπατάλη threads· parallelism (πολλά cores) είναι άλλο πράγμα."},
{d:2,def:1,q:"Τι είναι μια <b>extension method</b>;",o:["Μέθοδος σε partial class","Static μέθοδος (με <code>this</code> στην πρώτη παράμετρο) που «προσκολλάται» σε υπάρχοντα τύπο χωρίς να τον τροποποιήσεις","Override μέθοδος","Ένα generic constraint"],a:1,e:"Έτσι δουλεύουν όλοι οι LINQ operators πάνω στο IEnumerable&lt;T&gt;."},
{d:2,def:1,q:"Τι λέει η αρχή <b>DRY</b>;",o:["Don't Repeat Yourself — μία πηγή αλήθειας για κάθε γνώση/κανόνα, χωρίς αντιγραμμένη λογική","Do Refactor Yearly","Design, Run, Yield","Data Repository Yield"],a:0,e:"Η επανάληψη λογικής σημαίνει πολλαπλά σημεία αλλαγής — και σίγουρα ένα που θα ξεχαστεί."},
// ---------- ΟΡΙΣΜΟΙ · DAY 3 ----------
{d:3,def:1,s:1,q:"Τι είναι ένα <b>exception</b>;",o:["Κάθε λάθος τιμή που δίνει ο χρήστης","Αντικείμενο που σηματοδοτεί ΕΞΑΙΡΕΤΙΚΗ κατάσταση την οποία η μέθοδος δεν μπορεί να χειριστεί — διακόπτει τη ροή μέχρι να το πιάσει κάποιος catch","Μήνυμα στο log","Ένα return code"],a:1,e:"Αναμενόμενο λάθος input → validation result. Παραβίαση invariant / απρόβλεπτη αποτυχία → exception."},
{d:3,def:1,s:1,q:"Τι είναι το <b>stack trace</b>;",o:["Η λίστα των μεταβλητών","Η καταγραφή της αλυσίδας κλήσεων μέχρι το σημείο που προέκυψε το exception — δείχνει ΠΟΥ έσπασε","Το μήνυμα του exception","Το log level"],a:1,e:"Γι' αυτό γράφουμε σκέτο <code>throw;</code> — το <code>throw ex;</code> το μηδενίζει και χάνεις το σημείο του σφάλματος."},
{d:3,def:1,q:"Τι είναι το <b>inner exception</b>;",o:["Exception μέσα σε loop","Το αρχικό exception που «τυλίχθηκε» μέσα σε ένα πιο high-level exception — λέει το ΓΙΑΤΙ, ενώ το outer λέει το ΤΙ απέτυχε","Το πρώτο exception του AggregateException","Ένα private exception"],a:1,e:"DepositFailedException (τι) → InnerException: KeyNotFoundException (γιατί). Πάντα διάβασε πρώτα το inner."},
{d:3,def:1,q:"Τι είναι το <b>AggregateException</b>;",o:["Exception από aggregate root","Exception-«δοχείο» που περιέχει ΠΟΛΛΑ exceptions (InnerExceptions) — τυπικά από παράλληλα tasks","Το base όλων των exceptions","Ένα custom domain exception"],a:1,e:"Task.WaitAll → AggregateException με όλα· await Task.WhenAll → κάνει unwrap μόνο το πρώτο."},
{d:3,def:1,s:1,q:"Τι είναι ένα <b>custom (domain) exception</b>;",o:["Exception με πιο ωραίο μήνυμα","Δικός σου τύπος exception που εκφράζει παραβίαση συγκεκριμένου business κανόνα και κουβαλά typed δεδομένα (π.χ. Balance, RequestedAmount)","Exception που δεν πιάνεται","Wrapper του Exception"],a:1,e:"InsufficientBalanceException : DomainException — οι callers αντιδρούν προγραμματιστικά, όχι διαβάζοντας string."},
{d:3,def:1,s:1,q:"Τι είναι το <b>structured logging</b>;",o:["Logging με ωραία στοίχιση","Logging όπου το μήνυμα έχει named properties ({Amount}, {AccountId}) που αποθηκεύονται ως ΠΕΔΙΑ, άρα γίνονται queryable (π.χ. Kibana)","Logging σε αρχείο αντί για console","Logging ανά layer"],a:1,e:"logger.LogInformation(\"Deposit {Amount} for {AccountId}\", amount, id) — όχι interpolated string."},
{d:3,def:1,q:"Τι είναι το <b>log level</b>;",o:["Το βάθος του stack trace","Η σοβαρότητα/λεπτομέρεια μιας εγγραφής, που επιτρέπει φιλτράρισμα ανά περιβάλλον: Trace → Debug → Information → Warning → Error → Critical","Ο αριθμός των logs","Το μέγεθος του αρχείου"],a:1,e:"Αλλάζεις minlevel από config (nlog.config) — ο C# κώδικας μένει ίδιος."},
{d:3,def:1,q:"Τι είναι το <b>ILogger&lt;T&gt;</b>;",o:["Υλοποίηση του NLog","Η αφαίρεση logging της .NET που κάνεις inject — ο κώδικάς σου δεν γνωρίζει ποιο logging framework υπάρχει από κάτω","Ένα static helper","Ένα NLog target"],a:1,e:"Αλλάζεις NLog → Serilog χωρίς να αγγίξεις τις κλάσεις σου. Το T δίνει και την κατηγορία (category)."},
{d:3,def:1,q:"Τι είναι στο NLog το <b>target</b>, το <b>layout</b> και ο <b>rule</b>;",o:["Τρία ονόματα του ίδιου πράγματος","Target = ΠΟΥ πάνε τα logs, Layout = ΠΩΣ μορφοποιείται η γραμμή, Rule = ΠΟΙΟ level/logger δρομολογείται σε ποιο target","Target = level, Layout = αρχείο, Rule = φίλτρο","Είναι C# κλάσεις που γράφεις εσύ"],a:1,e:"Όλα σε nlog.config — ο κώδικας βλέπει μόνο ILogger&lt;T&gt;."},
{d:3,def:1,q:"Τι είναι το <b>correlation ID</b>;",o:["Το id του χρήστη","Μοναδικό αναγνωριστικό που ακολουθεί ΕΝΑ request σε όλη τη διαδρομή του (και μεταξύ microservices) ώστε να ενώνεις τα logs του","Το id του log entry","Το session token"],a:1,e:"Προωθείται και ως X-Correlation-ID header στις εξερχόμενες HTTP κλήσεις."},
{d:3,def:1,q:"Τι είναι το <b>happy path</b>;",o:["Το path του αρχείου","Η κανονική ροή εκτέλεσης όταν όλα πάνε καλά — με guard clauses μένει flat και τελευταία στη μέθοδο","Το catch block","Το retry"],a:1,e:"Guards πρώτα (early return), happy path στο τέλος χωρίς nesting."},
{d:3,def:1,q:"Τι είναι ένα <b>conditional breakpoint</b>;",o:["Breakpoint που σταματά μόνο σε exception","Breakpoint που ενεργοποιείται μόνο όταν ισχύει μια συνθήκη (π.χ. fromCurrency == \"BTC\")","Breakpoint που σταματά στο Ν-οστό πέρασμα","Breakpoint σε άλλο thread"],a:1,e:"Το «Ν-οστό πέρασμα» είναι το hit-count breakpoint — άλλο εργαλείο, άλλη χρήση."},
// ---------- ΟΡΙΣΜΟΙ · DAY 4 ----------
{d:4,def:1,s:1,q:"Τι είναι το <b>Clean Architecture</b>;",o:["Ένα project template της Microsoft","Οργάνωση σε ομόκεντρα layers (Domain → Application → Infrastructure/API) όπου οι εξαρτήσεις δείχνουν ΜΟΝΟ προς τα μέσα","Το MVC pattern","Μια μεθοδολογία code review"],a:1,e:"Ο compiler επιβάλλει τα boundaries μέσω project references — τα business rules μένουν ανεξάρτητα από frameworks."},
{d:4,def:1,s:1,q:"Τι είναι το <b>Dependency Rule</b>;",o:["Κάθε κλάση έχει το πολύ 3 dependencies","Ο κανόνας ότι ο κώδικας ενός εσωτερικού layer δεν γνωρίζει ΤΙΠΟΤΑ για τα εξωτερικά — τα βέλη πάνε μόνο προς τα μέσα","Τα NuGet πρέπει να είναι στην ίδια έκδοση","Ένα DI lifetime"],a:1,e:"Επιτρεπτά: API→Infra/App/Domain, Infra→App/Domain, App→Domain. Το Domain δεν αναφέρεται πουθενά."},
{d:4,def:1,q:"Τι περιέχει το <b>Domain layer</b>;",o:["Controllers και middleware","Entities, value objects, domain exceptions και τα invariants — μηδέν εξωτερικά dependencies","EF Core configurations","Use cases και interfaces"],a:1,e:"Η καρδιά του συστήματος: καθαροί business κανόνες, κανένα framework."},
{d:4,def:1,q:"Τι περιέχει το <b>Application layer</b>;",o:["Τα entities","Τα use cases (services/handlers) και τα interfaces των εξαρτήσεων (π.χ. IWalletRepository) — ορχηστρώνει το Domain","Τις υλοποιήσεις των repositories","Το DI wiring"],a:1,e:"Ξέρει ΤΙ πρέπει να γίνει· δεν ξέρει ΠΩΣ αποθηκεύεται ή στέλνεται."},
{d:4,def:1,q:"Τι περιέχει το <b>Infrastructure layer</b>;",o:["Business rules","Τις τεχνικές υλοποιήσεις των interfaces του Application: EF Core, Dapper, HTTP clients, cache, file system","Controllers","DTOs του API"],a:1,e:"Αντικαθίσταται χωρίς να αγγίξεις business logic — αυτό είναι το κέρδος."},
{d:4,def:1,s:1,q:"Τι είναι το <b>DDD (Domain-Driven Design)</b>;",o:["Ένα database design pattern","Προσέγγιση σχεδίασης που βάζει στο κέντρο το μοντέλο του επιχειρησιακού πεδίου και την κοινή γλώσσα με τους domain experts (entities, value objects, aggregates, bounded contexts)","Ένα testing framework","Συνώνυμο του Clean Architecture"],a:1,e:"Ο κώδικας μιλά τη γλώσσα της επιχείρησης — όχι τη γλώσσα της βάσης."},
{d:4,def:1,q:"Τι είναι ένα <b>Entity</b> στο DDD;",o:["Μια γραμμή πίνακα","Αντικείμενο με ΤΑΥΤΟΤΗΤΑ (Id) που διαρκεί στον χρόνο — δύο entities είναι ίσα αν έχουν το ίδιο Id, ακόμα κι αν διαφέρουν τα υπόλοιπα πεδία","Immutable αντικείμενο χωρίς Id","Το aggregate root μόνο"],a:1,e:"Entity = identity + mutable state. Value Object = χωρίς identity, immutable, ισότητα με όλα τα πεδία."},
{d:4,def:1,s:1,q:"Τι είναι ένα <b>Aggregate</b> και το <b>Aggregate Root</b>;",o:["Μια LINQ aggregate function","Σύμπλεγμα entities/value objects που αντιμετωπίζεται ως ΜΙΑ μονάδα συνέπειας· το root είναι η μοναδική είσοδος και επιβάλλει τα invariants","Ένα table με FK","Το σύνολο των repositories"],a:1,e:"π.χ. Wallet (root) + Transactions: ποτέ δεν αλλάζεις child απευθείας, πάντα μέσω του root."},
{d:4,def:1,s:1,q:"Τι είναι το <b>Repository pattern</b>;",o:["Το git repository","Αφαίρεση που κρύβει την αποθήκευση πίσω από contract σαν collection (Add/GetById/Save) — το Application δεν ξέρει αν από κάτω είναι SQL, Mongo ή fake","Ένα DTO","Ένα DbContext"],a:1,e:"Interface στο Application, υλοποίηση στο Infrastructure — και fake υλοποίηση στα tests."},
{d:4,def:1,s:1,q:"Τι είναι το <b>Dependency Injection (DI)</b>;",o:["Το να δημιουργείς αντικείμενα με new όπου τα χρειάζεσαι","Το να ΔΙΝΟΝΤΑΙ οι εξαρτήσεις μιας κλάσης από έξω (συνήθως στον constructor) αντί να τις κατασκευάζει η ίδια","Ένα NuGet package","Το singleton pattern"],a:1,e:"Ρητές εξαρτήσεις = testable κώδικας: βάζεις fake repository χωρίς DB."},
{d:4,def:1,q:"Τι είναι το <b>Inversion of Control (IoC)</b>;",o:["Το να ελέγχει η κλάση τις εξαρτήσεις της","Η αντιστροφή της ευθύνης δημιουργίας/σύνδεσης: το πλαίσιο (container) αποφασίζει ποια υλοποίηση δίνεται, όχι η κλάση","Το try/catch","Το reverse engineering"],a:1,e:"Το DI είναι η πιο κοινή μορφή IoC· ο container (built-in ή Autofac) κάνει τη σύνδεση."},
{d:4,def:1,s:1,q:"Τι είναι το <b>Composition Root</b>;",o:["Το root entity του domain","Το ΕΝΑ σημείο της εφαρμογής (Program.cs) όπου συναρμολογείται όλο το object graph — το μόνο μέρος όπου επιτρέπεται new()/registrations","Το base class όλων των services","Ο φάκελος του solution"],a:1,e:"Μόνο wiring — καθόλου business logic εκεί μέσα."},
{d:4,def:1,s:1,q:"Τι είναι το <b>service lifetime</b> στο DI;",o:["Ο χρόνος εκτέλεσης μιας μεθόδου","Ο κανόνας για το πόσο ζει ένα instance: Singleton (ένα για όλη την εφαρμογή), Scoped (ένα ανά request), Transient (νέο σε κάθε injection)","Το timeout του service","Το GC generation"],a:1,e:"DbContext → Scoped, circuit breaker → Singleton, validators/mappers → Transient."},
{d:4,def:1,q:"Τι είναι το <b>Strategy pattern</b>;",o:["Ένα σχέδιο refactoring","Ορίζεις οικογένεια εναλλάξιμων αλγορίθμων πίσω από κοινό interface και επιλέγεις τον κατάλληλο στο runtime — νέα συμπεριφορά = νέα κλάση, χωρίς αλλαγή στον caller","Ένα caching pattern","Το DI"],a:1,e:"IFundsStrategy: Add/Subtract/ForceSubtract. Ο service βλέπει μόνο το interface — Open/Closed."},
{d:4,def:1,s:1,q:"Τι είναι το <b>SOLID</b>;",o:["Ένα testing framework","Πέντε αρχές σχεδίασης: Single Responsibility, Open/Closed, Liskov Substitution, Interface Segregation, Dependency Inversion","Ένα coding style guide","Οι πυλώνες του OOP"],a:1,e:"Στόχος: κώδικας που αλλάζει και επεκτείνεται χωρίς να σπάει."},
{d:4,def:1,q:"Τι λέει το <b>Single Responsibility Principle</b>;",o:["Κάθε κλάση μία μέθοδο","Κάθε κλάση έχει έναν και μόνο λόγο να αλλάξει — μία ευθύνη","Κάθε project ένα interface","Κάθε μέθοδος έναν παράμετρο"],a:1,e:"Handler που κάνει validation + business logic + mapping παραβιάζει το SRP."},
{d:4,def:1,q:"Τι λέει το <b>Open/Closed Principle</b>;",o:["Ο κώδικας ανοιχτός σε επέκταση, κλειστός σε τροποποίηση — νέα συμπεριφορά με νέα κλάση, όχι με πείραγμα της παλιάς","Τα αρχεία ανοίγουν και κλείνουν με using","Τα interfaces είναι open, οι κλάσεις sealed","Ό,τι είναι public δεν αλλάζει ποτέ"],a:0,e:"Νέο strategy/decorator = μία νέα κλάση + μία γραμμή wiring, μηδέν αλλαγές αλλού."},
{d:4,def:1,q:"Τι λέει το <b>Liskov Substitution Principle</b>;",o:["Οι υποκλάσεις πρέπει να είναι sealed","Κάθε αντικείμενο υποκλάσης πρέπει να μπορεί να αντικαταστήσει το αντικείμενο της βάσης χωρίς να σπάσει η ορθότητα του προγράμματος","Μία base class ανά interface","Οι κλάσεις δεν κληρονομούν"],a:1,e:"Αν η derived «σπάει» τη συμπεριφορά που υπόσχεται η base (π.χ. πετάει NotSupportedException), το LSP παραβιάζεται."},
{d:4,def:1,s:1,q:"Τι λέει το <b>Dependency Inversion Principle</b>;",o:["Τα modules υψηλού επιπέδου δεν εξαρτώνται από λεπτομέρειες: και τα δύο εξαρτώνται από abstractions (interfaces)","Οι εξαρτήσεις γράφονται ανάποδα στο csproj","Το DI container αντιστρέφει τα lifetimes","Κάθε κλάση εξαρτάται από όλες"],a:0,e:"Γι' αυτό το IWalletRepository ζει στο Application και η EF υλοποίηση στο Infrastructure."},
{d:4,def:1,q:"Τι είναι το <b>Service Locator</b> και γιατί θεωρείται anti-pattern;",o:["Εργαλείο εύρεσης microservices","Global σημείο απ' όπου ζητάς εξαρτήσεις (<code>ServiceLocator.Get&lt;IRepo&gt;()</code>) — κρύβει τις πραγματικές εξαρτήσεις και αποτυγχάνει στο runtime αντί στο compile time","Το DI container","Ένα Autofac module"],a:1,e:"Οι εξαρτήσεις πρέπει να είναι ρητές στον constructor — τότε ο compiler σε προστατεύει."},
// ---------- ΟΡΙΣΜΟΙ · DAY 5 ----------
{d:5,def:1,q:"Τι είναι η <b>SQL</b>;",o:["Μια βάση δεδομένων","Declarative γλώσσα για ερωτήματα και χειρισμό δεδομένων σε σχεσιακή βάση — δηλώνεις ΤΙ θες, ο query optimizer αποφασίζει το ΠΩΣ","Ένα ORM","Ένα πρωτόκολλο δικτύου"],a:1,e:"Ο SQL Server είναι το RDBMS· η SQL είναι η γλώσσα με την οποία του μιλάς."},
{d:5,def:1,q:"Τι είναι το <b>PRIMARY KEY</b>;",o:["Το πρώτο column του πίνακα","Η στήλη (ή συνδυασμός) που ταυτοποιεί μοναδικά κάθε γραμμή — unique και όχι NULL","Ένα index στο FK","Το πιο γρήγορο column"],a:1,e:"Συνήθως δημιουργεί και το clustered index, δηλαδή τη φυσική σειρά αποθήκευσης."},
{d:5,def:1,s:1,q:"Τι είναι ένα <b>index</b> σε βάση δεδομένων;",o:["Ένα αντίγραφο του πίνακα","Βοηθητική δομή (B-tree) που επιτρέπει στη μηχανή να βρίσκει γραμμές με seek αντί για πλήρη σάρωση — με κόστος στα writes","Το πρωτεύον κλειδί","Ένα view"],a:1,e:"Index στις στήλες που φιλτράρεις/κάνεις join (π.χ. FK) — κάθε INSERT/UPDATE ενημερώνει και τα indexes."},
{d:5,def:1,q:"Τι είναι ένα <b>JOIN</b>;",o:["Η ένωση δύο βάσεων","Πράξη που συνδυάζει γραμμές δύο (ή περισσότερων) πινάκων με βάση μια συνθήκη — INNER κρατά μόνο τα matches, LEFT κρατά όλα τα αριστερά","Η συγχώνευση δύο queries με UNION","Το GROUP BY"],a:1,e:"Η εταιρεία χωρίς αυτοκίνητα εμφανίζεται μόνο με LEFT JOIN (με NULL στη στήλη του Car)."},
{d:5,def:1,q:"Τι κάνει το <b>GROUP BY</b>;",o:["Ταξινομεί τα αποτελέσματα","«Διπλώνει» γραμμές σε ομάδες βάσει κοινών τιμών, ώστε να υπολογιστούν aggregates (COUNT, SUM, AVG, MIN, MAX) ανά ομάδα","Φιλτράρει γραμμές","Ενώνει πίνακες"],a:1,e:"WHERE φιλτράρει ΠΡΙΝ το grouping, HAVING φιλτράρει τα groups ΜΕΤΑ το aggregation."},
{d:5,def:1,s:1,q:"Τι είναι ένα <b>transaction</b>;",o:["Μία εντολή SQL","Ομάδα λειτουργιών που εκτελούνται ως ΜΙΑ αδιαίρετη μονάδα: ή γίνονται όλες commit ή καμία (rollback)","Μια σύνδεση στη βάση","Ένα stored procedure"],a:1,e:"Ένα SaveChanges() του EF Core = ένα transaction για όλες τις παρακολουθούμενες αλλαγές."},
{d:5,def:1,q:"Τι σημαίνει <b>ACID</b>;",o:["Atomicity, Consistency, Isolation, Durability — οι εγγυήσεις ενός transaction","Access, Control, Identity, Domain","Async, Cached, Indexed, Distributed","Add, Commit, Insert, Delete"],a:0,e:"Atomicity = όλα ή τίποτα, Consistency = έγκυρη κατάσταση, Isolation = μη παρεμβολή, Durability = μόνιμη εγγραφή."},
{d:5,def:1,q:"Τι είναι ένα <b>ORM</b>;",o:["Object-Relational Mapper: στρώμα που αντιστοιχίζει γραμμές πινάκων σε αντικείμενα και αντίστροφα, γλιτώνοντας χειροκίνητο mapping","Ένα query optimizer","Ένα connection pool","Ένα σύστημα migrations μόνο"],a:0,e:"Full ORM (EF Core): παράγει SQL, change tracking, migrations. Micro-ORM (Dapper): γράφεις εσύ το SQL, κάνει μόνο το mapping."},
{d:5,def:1,s:1,q:"Τι είναι το <b>DbContext</b>;",o:["Το connection string","Η «μονάδα εργασίας» (unit of work) του EF Core: εκπροσωπεί τη session με τη βάση, κρατά τα DbSet και τον change tracker","Ένα repository","Το migration file"],a:1,e:"Καταχωρείται ως Scoped — ο change tracker ΔΕΝ είναι thread-safe."},
{d:5,def:1,s:1,q:"Τι είναι ο <b>change tracker</b>;",o:["Το git history του schema","Ο μηχανισμός του EF Core που παρακολουθεί την κατάσταση των entities (Added/Modified/Deleted/Unchanged) και παράγει το κατάλληλο SQL στο SaveChanges","Ένα trigger της βάσης","Το logging του EF"],a:1,e:"Με AsNoTracking τον παρακάμπτεις — γρηγορότερα reads, αλλά οι αλλαγές ΔΕΝ αποθηκεύονται."},
{d:5,def:1,q:"Τι είναι το <b>IQueryable&lt;T&gt;</b>;",o:["Μια λίστα στη μνήμη","Ερώτημα υπό κατασκευή: χτίζει expression tree που ΜΕΤΑΦΡΑΖΕΤΑΙ σε SQL και εκτελείται μόνο στο materialisation (ToList/ToArray/First)","Async IEnumerable","Ένα DbSet"],a:1,e:"Deferred execution: προσθέτεις φίλτρα υπό συνθήκη και τρέχει ΕΝΑ query στο τέλος. Κάθε νέο materialisation = νέο round trip."},
{d:5,def:1,s:1,q:"Τι είναι το <b>SQL injection</b>;",o:["Η εισαγωγή δεδομένων με INSERT","Ευπάθεια όπου input του χρήστη ενσωματώνεται αυτούσιο στο SQL και εκτελείται ως κώδικας — η άμυνα είναι τα parameterized queries","Ένα performance πρόβλημα","Επίθεση στο connection pool"],a:1,e:"Ποτέ string concatenation: @Model parameter σε raw SQL, new { Model = m } στο Dapper."},
{d:5,def:1,q:"Τι είναι το <b>upsert</b> (MERGE);",o:["Η διαγραφή και επανεισαγωγή","Λειτουργία «update αν υπάρχει, insert αν δεν υπάρχει» — στο T-SQL γίνεται atomically με MERGE (WHEN MATCHED / WHEN NOT MATCHED)","Ένα bulk insert","Το rollback"],a:1,e:"Ένα statement, δύο μονοπάτια — τυπικό για periodic sync jobs."},
{d:5,def:1,s:1,q:"Τι είναι το <b>N+1 problem</b>;",o:["Πρόβλημα με τα indexes","Αντι-μοτίβο όπου φέρνεις N γραμμές με 1 query και μετά κάνεις άλλα N queries για τα σχετιζόμενα δεδομένα — αντί για ένα JOIN/Include","Ένα off-by-one bug","Υπερβολικά πολλά migrations"],a:1,e:"Λύση: Include (EF Core) ή multi-mapping με splitOn (Dapper) — ένα round trip."},
{d:5,def:1,q:"Τι είναι ένα <b>stored procedure</b>;",o:["Μια C# μέθοδος","Προ-αποθηκευμένο και προ-μεταγλωττισμένο σύνολο εντολών T-SQL που ζει μέσα στη βάση και καλείται με όνομα και παραμέτρους","Ένα view","Ένα trigger"],a:1,e:"Μπορεί να κληθεί από Dapper/EF. Προσοχή: business logic στη βάση δυσκολεύει version control και testing."},
{d:5,def:1,q:"Τι είναι το <b>code-first</b> και τι το <b>database-first</b>;",o:["Δύο τρόποι γραφής SQL","Code-first: γράφεις τις κλάσεις και τα migrations παράγουν το schema. DB-first: η βάση προϋπάρχει και κάνεις scaffold entities+context από αυτήν","Code-first = Dapper, DB-first = EF","Δύο ονόματα του migration"],a:1,e:"Code-first όταν η εφαρμογή κατέχει το schema· scaffolding όταν κληρονομείς υπάρχουσα βάση."},
// ---------- ΟΡΙΣΜΟΙ · DAY 6 ----------
{d:6,def:1,s:1,q:"Τι είναι το <b>HTTP</b>;",o:["Μια γλώσσα προγραμματισμού","Stateless πρωτόκολλο request-response πάνω από TCP/IP: ο client στέλνει αίτημα (verb + URL + headers + body) και ο server απαντά (status + headers + body)","Ένα format δεδομένων","Το ίδιο με το REST"],a:1,e:"Stateless: κάθε κύκλος είναι ανεξάρτητος — ό,τι state χρειάζεσαι το κουβαλάς (tokens, session store)."},
{d:6,def:1,s:1,q:"Τι είναι το <b>REST</b>;",o:["Ένα πρωτόκολλο","Αρχιτεκτονικό στυλ για APIs: μοντελοποιείς resources με URLs, ενεργείς πάνω τους με τα HTTP verbs και επιστρέφεις κατάλληλα status codes","Ένα NuGet package","Μια εναλλακτική του HTTP"],a:1,e:"GET /players/5 (πάρε), POST /players (δημιούργησε), PUT/PATCH (ενημέρωσε), DELETE (σβήσε)."},
{d:6,def:1,q:"Τι είναι ένα <b>resource</b> στο REST;",o:["Ένα αρχείο του server","Η οντότητα που εκθέτει το API, προσδιορισμένη από URL (π.χ. /players/5) — ουσιαστικά, όχι ρήματα, στα paths","Το DTO","Το status code"],a:1,e:"/players/5/deactivate είναι κακό REST· POST /players/5/deactivations ή PATCH με state είναι πιο σωστό."},
{d:6,def:1,s:1,q:"Τι σημαίνει <b>idempotency</b>;",o:["Η κλήση δεν αλλάζει τίποτα ποτέ","Ν επαναλαμβανόμενες ίδιες κλήσεις αφήνουν τον server στην ΙΔΙΑ κατάσταση με μία κλήση — το response μπορεί να διαφέρει","Το request είναι thread-safe","Το request γίνεται cache"],a:1,e:"GET, PUT, DELETE idempotent· POST και PATCH όχι. Το DELETE μένει idempotent ακόμα κι αν η 2η κλήση δώσει 404."},
{d:6,def:1,q:"Τι είναι ένα <b>DTO</b>;",o:["Data Transfer Object: απλό αντικείμενο που μεταφέρει ΜΟΝΟ τα δεδομένα του API contract, ξεχωριστό από το domain entity","Database Table Object","Ένα validation attribute","Το request body μόνο"],a:0,e:"Ποτέ domain entity στο API: αλλιώς δένεις το δημόσιο contract με το εσωτερικό μοντέλο. Tip: records."},
{d:6,def:1,q:"Τι σημαίνουν οι κατηγορίες <b>2xx / 4xx / 5xx</b>;",o:["Μέγεθος απάντησης","2xx = επιτυχία, 4xx = λάθος του client (input, auth, δικαιώματα), 5xx = λάθος του server","2xx = GET, 4xx = POST, 5xx = DELETE","Ταχύτητα απόκρισης"],a:1,e:"Υπάρχει και 3xx (redirects) και 1xx (informational). Το 500 σημαίνει «δικό μας bug»."},
{d:6,def:1,s:1,q:"Τι είναι το <b>middleware</b> στο ASP.NET Core;",o:["Ένα layer της αρχιτεκτονικής","Στοιχείο του request pipeline που βλέπει κάθε request/response και μπορεί να το επεξεργαστεί ή να το σταματήσει πριν φτάσει στον επόμενο κρίκο","Ένας controller","Ένα DI lifetime"],a:1,e:"π.χ. UseExceptionHandler, UseAuthentication, UseRouting — η σειρά τους μετράει."},
{d:6,def:1,q:"Τι είναι το <b>model binding</b>;",o:["Το mapping entity → table","Η αυτόματη μετατροπή των δεδομένων του request (route, query string, body, headers) στις παραμέτρους του action","Το DI","Το serialization της απάντησης"],a:1,e:"[FromRoute], [FromQuery], [FromBody], [FromHeader]. Με [ApiController] η αποτυχία δίνει αυτόματα 400."},
{d:6,def:1,s:1,q:"Τι είναι το <b>caching</b>;",o:["Η αποθήκευση δεδομένων στη βάση","Η προσωρινή διατήρηση αποτελεσμάτων σε γρήγορο αποθηκευτικό χώρο, ώστε επόμενα αιτήματα να εξυπηρετούνται χωρίς επαναϋπολογισμό/επανάκληση της πηγής","Η συμπίεση των απαντήσεων","Το connection pooling"],a:1,e:"Κέρδος: latency, DB load, κόστος. Κίνδυνος: stale data — γι' αυτό TTL και invalidation."},
{d:6,def:1,q:"Τι είναι το <b>TTL</b> ενός cache entry;",o:["Total Transfer Load","Time To Live: πόσο διάστημα θεωρείται έγκυρη η εγγραφή πριν λήξει αυτόματα","Ο χρόνος απόκρισης","Το μέγεθος του entry"],a:1,e:"Χωρίς TTL το cache μεγαλώνει απεριόριστα → out of memory. Πάντα AbsoluteExpirationRelativeToNow."},
{d:6,def:1,q:"Τι είναι τα <b>stale data</b>;",o:["Κατεστραμμένα δεδομένα","Δεδομένα που σερβίρονται από το cache ενώ η πηγή έχει ήδη αλλάξει — απόκλιση cache/DB (data drift)","Δεδομένα χωρίς index","Δεδομένα σε λάθος format"],a:1,e:"Λύση: μικρό TTL για ανοχή στην απόκλιση, ή invalidation on write για ακρίβεια."},
{d:6,def:1,q:"Τι είναι η <b>cache invalidation</b>;",o:["Ο έλεγχος εγκυρότητας του key","Η σκόπιμη αφαίρεση/ανανέωση μιας εγγραφής όταν αλλάζουν τα υποκείμενα δεδομένα — τυπικά cache.Remove(key) αμέσως μετά το write","Η λήξη λόγω TTL μόνο","Το άδειασμα όλου του cache στο restart"],a:1,e:"Read γεμίζει στο miss, write σβήνει το entry — έτσι δεν σερβίρεις παλιά rankings."},
{d:6,def:1,s:1,q:"Τι είναι ένα <b>distributed cache</b>;",o:["Cache σε κάθε process ξεχωριστά","Κοινόχρηστο cache εκτός διεργασίας (π.χ. Redis μέσω IDistributedCache) που το μοιράζονται όλα τα instances και επιβιώνει restarts","Το IMemoryCache","Ένα CDN"],a:1,e:"Με 3 instances πίσω από load balancer, το IMemoryCache θα σέρβιρε 3 διαφορετικές εκδοχές της αλήθειας."},
{d:6,def:1,q:"Τι είναι τα <b>Problem Details</b> (RFC 7807);",o:["Το stack trace στην απάντηση","Τυποποιημένο JSON σχήμα για σφάλματα API (type, title, status, detail) — ενιαία, ασφαλής μορφή χωρίς διαρροή internals","Ένα logging format","Τα validation attributes"],a:1,e:"UseExceptionHandler + Problem Details — ποτέ raw 500 με ex.Message."},

{d:7,def:1,s:1,q:"Τι είναι το <b>CQRS</b>;",o:["Ένα caching pattern","Command Query Responsibility Segregation: διαχωρίζεις τα μοντέλα/μονοπάτια ΓΡΑΦΗΣ (commands) από αυτά της ΑΝΑΓΝΩΣΗΣ (queries) — ένα type ανά intent","Ένα DI container","Το repository pattern"],a:1,e:"CreateCarCommand vs GetCarByIdQuery — κάθε ένα με τον δικό του handler, χωρίς «ένα repository για όλα»."},
{d:7,def:1,q:"Τι είναι ένα <b>Command</b> στο CQRS;",o:["Ένα SQL statement","Αίτημα που ΑΛΛΑΖΕΙ κατάσταση· επιστρέφει void ή απλώς το Id — ποτέ hydrated entity","Ένα read-only ερώτημα","Ένα notification"],a:1,e:"Θες τα δεδομένα μετά; Κάνε ξεχωριστό Query."},
{d:7,def:1,q:"Τι είναι ένα <b>Query</b> στο CQRS;",o:["Ένα LINQ expression","Αίτημα που ΔΙΑΒΑΖΕΙ μόνο — κανένα side effect, συνήθως χωρίς validator","Ένα command με return value","Ένα stored procedure"],a:1,e:"Reads και writes ξεχωριστά μονοπάτια: μπορούν να βελτιστοποιηθούν ανεξάρτητα."},
{d:7,def:1,s:1,q:"Τι είναι το <b>Mediator pattern</b> και το <b>MediatR</b>;",o:["Ένα message queue","Pattern όπου τα αντικείμενα δεν καλούν το ένα το άλλο απευθείας αλλά μέσω ενός μεσάζοντα· το MediatR είναι η υλοποίησή του στη .NET (Send/Publish + handlers)","Ένα ORM","Ένα HTTP client"],a:1,e:"Ο controller κάνει inject μόνο το IMediator — μηδενική γνώση για το ποιος χειρίζεται το request."},
{d:7,def:1,q:"Τι είναι ένας <b>handler</b>;",o:["Ένα middleware","Η κλάση που υλοποιεί IRequestHandler&lt;TRequest,TResponse&gt; και εκτελεί τη λογική ΕΝΟΣ συγκεκριμένου command/query","Ένα exception filter","Ένα validator"],a:1,e:"Ένας handler = μία δουλειά. Cross-entity checks ναι· validation σχήματος και mapping όχι όλα μαζί."},
{d:7,def:1,q:"Τι είναι ένα <b>Notification (domain event)</b> στο MediatR;",o:["Ένα email","Μήνυμα που δημοσιεύεται με Publish και το λαμβάνουν ΠΟΛΛΟΙ ανεξάρτητοι handlers, που δεν γνωρίζουν ο ένας τον άλλο","Ένα command με πολλαπλά returns","Ένα log entry"],a:1,e:"CarTransferredEvent → AuditLogHandler + RecipientNotificationHandler. Τρίτος handler αύριο = μηδέν αλλαγές αλλού."},
{d:7,def:1,q:"Τι είναι το <b>FluentValidation</b>;",o:["Ένα testing framework","Βιβλιοθήκη που ορίζει κανόνες εγκυρότητας input σε ξεχωριστές κλάσεις validator με fluent σύνταξη (RuleFor(x =&gt; x.Name).NotEmpty())","Ένα mapping tool","Middleware του ASP.NET"],a:1,e:"Ελέγχει το ΣΧΗΜΑ του input· τα cross-entity lookups ανήκουν στον handler."},
{d:7,def:1,s:1,q:"Τι είναι το <b>Decorator pattern</b>;",o:["Attribute πάνω από κλάση","Τυλίγεις ένα αντικείμενο σε ένα άλλο με ΤΟ ΙΔΙΟ interface, προσθέτοντας συμπεριφορά (logging, caching) και κάνοντας delegate στο inner — ο caller δεν βλέπει διαφορά","Κληρονομικότητα με override","Ένα middleware"],a:1,e:"Οι 3 κανόνες: ίδιο interface, κρατάς reference στο inner, πάντα delegation. Open/Closed στην πράξη."},
{d:7,def:1,q:"Τι είναι το <b>Autofac</b>;",o:["Ένα ORM","Third-party IoC container με δυνατότητες που δεν έχει ο built-in — κυρίως decorators σε open generics και assembly scanning","Ένα mocking library","Ένα logging framework"],a:1,e:"RegisterGenericDecorator: μία γραμμή τυλίγει ΚΑΘΕ IRequestHandler&lt;,&gt;."},
{d:7,def:1,q:"Τι είναι ένα <b>Autofac Module</b>;",o:["Ένα NuGet package","Μονάδα σύνθεσης: κλάση που κάνει override το Load() και συγκεντρώνει τα registrations ενός project","Ένα assembly","Ένα lifetime scope"],a:1,e:"ApplicationModule, InfrastructureModule — κάθε project δηλώνει τα δικά του, το Program.cs μένει καθαρό."},
{d:7,def:1,q:"Τι είναι ένα <b>open generic</b> type;",o:["Public generic κλάση","Generic τύπος με ΑΠΡΟΣΔΙΟΡΙΣΤΕΣ παραμέτρους (π.χ. <code>IRequestHandler&lt;,&gt;</code>) — μια εγγραφή καλύπτει όλες τις κλειστές μορφές του","Interface χωρίς μεθόδους","Δυναμικός τύπος"],a:1,e:"AddOpenBehavior(typeof(LoggingBehavior&lt;,&gt;)) — καλύπτει και τους handlers που θα γραφτούν αύριο."},

{d:8,def:1,q:"Τι είναι το <b>Polly</b>;",o:["Ένα HTTP framework","Βιβλιοθήκη resilience για .NET: retry, circuit breaker, timeout, fallback, bulkhead — δηλωτικές πολιτικές γύρω από επισφαλείς κλήσεις","Ένας scheduler","Ένα logging sink"],a:1,e:"Συνδυάζονται με Policy.WrapAsync και δένονται στο HttpClient με AddPolicyHandler."},

{d:8,def:1,s:1,q:"Τι είναι το <b>circuit breaker</b>;",o:["Ένα timeout","Μηχανισμός που μετά από N συνεχόμενες αποτυχίες «ανοίγει το κύκλωμα» και απορρίπτει ΑΜΕΣΩΣ τις κλήσεις για ένα διάστημα, προστατεύοντας το downstream και τον εαυτό σου","Ένα retry με backoff","Ένα rate limiter"],a:1,e:"Καταστάσεις: Closed → Open → Half-Open (δοκιμαστική κλήση). Πρέπει να είναι Singleton για να θυμάται το state."},

Q.sort((a, b) => a.d - b.d);

let FILTER = "all";

function visible(item) {
  return FILTER === "all"
      || (FILTER === "def"  && item.def)
      || (FILTER === "star" && item.s)
      || (FILTER === "trap" && item.t);
}

function setFilter(v) {
  FILTER = v;
  document.getElementById("result").style.display = "none";
  render();
  window.scrollTo({top:0});
}

function render() {
  const quiz = document.getElementById("quiz");
  let html = "", lastDay = 0, num = 0;
  Q.forEach((item, i) => {
    if (!visible(item)) return;
    if (item.d !== lastDay) { html += `<div class="day-header">${DAY_NAMES[item.d]}</div>`; lastDay = item.d; }
    num++;
    let badges = "";
    if (item.def) badges += ` <span class="def-tag" title="Ερώτηση ορισμού">ΟΡΙΣΜΟΣ</span>`;
    if (item.s) badges += ` <span title="Πολύ σημαντική ερώτηση">🆘</span>`;
    if (item.t) badges += ` <span title="Ερώτηση-παγίδα" style="color:#dc2626;font-weight:800;">❗</span>`;
    html += `<div class="q" id="q${i}"><div class="q-text">${num}.${badges} ${item.q}</div>`;
    const order = item.o.map((_, j) => j).sort(() => Math.random() - 0.5);
    order.forEach(j => {
      html += `<label class="opt" id="q${i}o${j}"><input type="radio" name="q${i}" value="${j}" onchange="answer(${i}, ${j})">${item.o[j]}</label>`;
    });
    html += `<div class="exp">💡 ${item.e}</div></div>`;
  });
  quiz.innerHTML = html;
  updateProgress();
}

function answer(i, picked) {
  const item = Q[i];
  const el = document.getElementById(`q${i}`);
  el.classList.add("graded"); // δείχνει την εξήγηση
  // πρασίνισε τη σωστή
  document.getElementById(`q${i}o${item.a}`).classList.add("right");
  if (picked === item.a) {
    el.classList.add("correct");
  } else {
    el.classList.add("wrong");
    document.getElementById(`q${i}o${picked}`).classList.add("picked-wrong");
  }
  // κλείδωσε την ερώτηση — δεν αλλάζει απάντηση μετά
  document.querySelectorAll(`input[name=q${i}]`).forEach(r => r.disabled = true);
  updateProgress();
}

function updateProgress() {
  const shown = Q.filter(visible).length;
  const answered = Q.filter((_, i) => document.querySelector(`input[name=q${i}]:checked`)).length;
  document.getElementById("progress").textContent = `Απαντημένες: ${answered} / ${shown}`;
}

function grade() {
  let correct = 0, total = 0, perDay = {};
  Q.forEach((item, i) => {
    const el = document.getElementById(`q${i}`);
    if (!el) return;
    total++;
    el.classList.add("graded");
    el.classList.remove("correct","wrong","unanswered");
    item.o.forEach((_, j) => document.getElementById(`q${i}o${j}`).classList.remove("right","picked-wrong"));
    const picked = document.querySelector(`input[name=q${i}]:checked`);
    perDay[item.d] = perDay[item.d] || {c:0,t:0};
    perDay[item.d].t++;
    document.getElementById(`q${i}o${item.a}`).classList.add("right");
    if (!picked) { el.classList.add("unanswered"); return; }
    if (+picked.value === item.a) { correct++; perDay[item.d].c++; el.classList.add("correct"); }
    else { el.classList.add("wrong"); document.getElementById(`q${i}o${picked.value}`).classList.add("picked-wrong"); }
  });
  const pct = total ? Math.round(100 * correct / total) : 0;
  let bars = "";
  Object.keys(perDay).forEach(d => {
    const p = perDay[d], w = Math.round(100 * p.c / p.t);
    bars += `<div class="daybar"><span class="label">${DAY_NAMES[d].split(" — ")[0]} (${p.c}/${p.t})</span><div class="track"><div class="fill" style="width:${w}%"></div></div></div>`;
  });
  const verdict = pct >= 85 ? "Έτοιμη! 🎉" : pct >= 65 ? "Καλά — δες τα κόκκινα σημεία." : "Θέλει κι άλλη επανάληψη — ξεκίνα από τις μέρες με το χαμηλότερο σκορ.";
  const res = document.getElementById("result");
  res.style.display = "block";
  res.innerHTML = `<h2>Αποτέλεσμα</h2><div class="big">${correct} / ${total} (${pct}%)</div><p>${verdict}</p>${bars}`;
}

function resetQuiz() {
  document.getElementById("result").style.display = "none";
  render();
  window.scrollTo({top:0});
}

render();
</script>
